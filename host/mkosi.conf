[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=43
Architecture=x86-64

[Output]
Format=disk
ImageId=axiom-host-lab
OutputDirectory=mkosi.output
ManifestFormat=json,changelog
Seed=e2e50e6a-6d9a-5d2c-8ea9-7e42f7a7d5a1
CompressOutput=no

[Content]
Packages=kernel-core
         systemd
         systemd-udev
         systemd-boot
         nodejs24
         nodejs24-bin
         nodejs24-npm
         nodejs24-npm-bin
         git
         ca-certificates
WithDocs=no
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
Ssh=never
Autologin=no
KernelCommandLine=quiet systemd.show_status=yes

[Validation]
Checksum=yes

[Build]
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=43
WithNetwork=no

[Runtime]
VirtualMachineMonitor=qemu
Firmware=uefi
TPM=no
RuntimeNetwork=none
Ephemeral=yes
CPUs=2
RAM=2G
