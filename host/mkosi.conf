[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=rawhide
Snapshot=20260813.n.0
Mirror=https://kojipkgs.fedoraproject.org
Architecture=x86-64

[Output]
Format=disk
ImageId=axiom-host-lab
OutputDirectory=mkosi.output
ManifestFormat=json,changelog
Seed=e2e50e6a-6d9a-5d2c-8ea9-7e42f7a7d5a1
CompressOutput=no

[Content]
Packages=kernel-core
         systemd
         systemd-udev
         systemd-boot
         nodejs24
         nodejs24-bin
         nodejs24-npm
         nodejs24-npm-bin
         git
         ca-certificates
WithDocs=no
Bootable=yes
Bootloader=uki
UnifiedKernelImages=unsigned
Ssh=never
Autologin=no
KernelCommandLine=quiet systemd.show_status=yes
RemoveFiles=/var/cache/ldconfig/aux-cache

[Validation]
Checksum=yes

[Build]
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=rawhide
ToolsTreeMirror=https://kojipkgs.fedoraproject.org
Environment=E2FSPROGS_FAKE_TIME SYSTEMD_REPART_MKFS_OPTIONS_EXT4 SYSTEMD_REPART_MKFS_OPTIONS_VFAT
WithNetwork=no

[Runtime]
VirtualMachineMonitor=qemu
Firmware=uefi
TPM=no
RuntimeNetwork=none
Ephemeral=yes
CPUs=2
RAM=2G
