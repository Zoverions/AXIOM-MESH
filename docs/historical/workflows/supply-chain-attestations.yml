name: Supply Chain Attestations

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Generate SBOM + provenance predicate
        run: ./scripts/generate_supply_chain_attestations.sh

      - name: Keyless sign SBOM and provenance files
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          cosign version
          cosign sign-blob --yes artifacts/supply-chain/sbom.spdx.json --output-signature artifacts/supply-chain/sbom.spdx.json.sig --output-certificate artifacts/supply-chain/sbom.spdx.json.pem
          cosign sign-blob --yes artifacts/supply-chain/provenance-predicate.json --output-signature artifacts/supply-chain/provenance-predicate.json.sig --output-certificate artifacts/supply-chain/provenance-predicate.json.pem

      - name: Generate GitHub provenance attestation for SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/supply-chain/sbom.spdx.json

      - name: Upload supply-chain attestation bundle
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-attestations
          path: artifacts/supply-chain/*
          if-no-files-found: error
