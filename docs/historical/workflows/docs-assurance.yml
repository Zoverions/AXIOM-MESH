name: Docs Assurance

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  docs-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs/code traceability HOWTO links
        run: python scripts/check_operator_howto_links.py

      - name: Validate quarterly evidence freshness metadata
        run: python scripts/check_evidence_freshness.py
