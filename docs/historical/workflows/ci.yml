name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [go, python, node-gateway, node-sandbox]

    steps:
    - uses: actions/checkout@v3

    # GO
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    - name: Go Lint & Test
      if: matrix.language == 'go'
      run: |
        cd grid
        go mod tidy
        go vet ./...
        go list ./... | xargs -n 1 go test -v -short

    # PYTHON
    - name: Set up Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Python Lint & Test
      if: matrix.language == 'python'
      run: |
        cd hypervisor
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio websockets httpx flake8
        flake8 src tests || true
        PYTHONPATH=.:src python -m pytest tests/

    # NODE - GATEWAY
    - name: Set up Node.js
      if: matrix.language == 'node-gateway'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Node Gateway Lint & Test
      if: matrix.language == 'node-gateway'
      run: |
        cd gateway
        npm install
        npx tsc --noEmit
        npm test

    # HARDHAT CONTRACTS (Node Gateway environment used to compile/test solidity)
    - name: Compile and Test Hardhat Contracts
      if: matrix.language == 'node-gateway'
      env:
        # Ensures that compiler downloads bypass restricted proxy environments in CI
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        # SUB-H.1 Hypervisor: Contract compilation in CI (Hardhat proxy 403 issue) — explicit proxy bypass added for Hardhat job to prevent 403 errors
      run: |
        cd grid/contracts
        npm install
        npx hardhat test

    # NODE - SANDBOX
    - name: Set up Node.js
      if: matrix.language == 'node-sandbox'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Node Sandbox Lint & Test
      if: matrix.language == 'node-sandbox'
      run: |
        cd sandbox
        npm install
        npx tsc --noEmit
        npm test

  security-scans:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd grid/contracts
        npm install --legacy-peer-deps
        pip install slither-analyzer
        # mythril is often installed via docker or requires specific python versions
        # we'll use the docker container to run it.

    - name: Set up Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Run formal verification gate (Slither + Foundry fuzz/invariant)
      run: make verify-formal

    - name: Run Mythril
      run: |
        cd grid/contracts
        docker run --rm -v $(pwd):/share --entrypoint /bin/sh mythril/myth -c "myth analyze /share/contracts/**/*.sol --max-depth 2 || exit 0"

  transformer-foundation-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cap'n Proto compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y capnproto

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r hypervisor/requirements.txt
        pip install pytest

    - name: Install Hardhat dependencies
      run: |
        cd grid/contracts
        npm install --legacy-peer-deps

    - name: Run transformer compile/test gate
      env:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
      run: |
        make transformer-gate

    - name: Verify CPoR Schema Validation
      env:
        CAPABILITY_TOKEN_SECRET: "mock"
        PYTHONPATH: "hypervisor"
      run: |
        make verify-cpor-schema

    - name: Verify cross-chain evidence bundle schema v2
      env:
        CAPABILITY_TOKEN_SECRET: "mock"
        PYTHONPATH: "hypervisor"
      run: |
        make verify-cross-chain-evidence-schema

  integration-matrix:
    runs-on: ubuntu-latest
    needs:
    - lint-and-test
    - transformer-foundation-gate
    strategy:
      fail-fast: false
      matrix:
        network_mode: ["connected", "disconnected"]

    steps:
    - uses: actions/checkout@v3

    - name: Simulate Disconnected Mode
      if: matrix.network_mode == 'disconnected'
      run: |
        # Simulate an offline mode by mapping external API domains to localhost/invalid IP
        echo "127.0.0.1 upload.ardrive.io" | sudo tee -a /etc/hosts
        echo "127.0.0.1 external.api.com" | sudo tee -a /etc/hosts

    - name: Run docker-compose Matrix
      run: |
        # Build and run the entire matrix in the background
        docker compose up -d --build

        # Wait for services to be healthy or at least running for a few seconds
        sleep 20

        # Check if containers are still running
        docker compose ps

        # Optionally, hit the health checks
        curl -f http://localhost:8000/health || echo "Hypervisor health check failed, but expected in some disconnected tests."
        curl -f http://localhost:5000/health || echo "Grid health check failed."
        curl -f http://localhost:4000/health || echo "Sandbox health check failed."

        # Fetch the new zk-stats endpoint
        curl -f http://localhost:5000/zk-stats || echo "zk-stats endpoint unreachable."

    - name: Tear Down docker-compose
      if: always()
      run: |
        docker compose logs
        docker compose down -v
