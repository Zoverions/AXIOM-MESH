version: '3.9'
networks:
  zero-trust-grid:
    internal: true
  zero-trust-gateway:
    internal: false
  zero-trust-crosschain:
    internal: true

services:
  hypervisor:
    build:
      context: .
      target: hypervisor
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./hypervisor/memory:/data"]
    depends_on: [grid]
    networks:
      - zero-trust-grid
      - zero-trust-gateway
      - zero-trust-crosschain

  gateway:
    build:
      context: .
      target: gateway
    ports: ["8080:8080"]
    depends_on: [hypervisor]
    networks:
      - zero-trust-gateway

  grid:
    image: golang:1.23
    command: go run grid/main.go
    volumes: ["./grid:/app"]
    ports: ["8545:8545"]  # local anvil or mainnet RPC proxy
    networks:
      - zero-trust-grid

  # XMCP Mock Server for X API testing (Phase 3)
  xmcp-mock:
    image: python:3.12-slim
    command: >
      sh -c "pip install flask &&
             python /app/xmcp_mock_server.py"
    volumes: ["./hypervisor/src/agents:/app"]
    ports: ["8001:8001"]
    environment:
      - FLASK_ENV=development
      - X_MOCK_MODE=true
    networks:
      - zero-trust-grid

  # Optional: Cross-chain relayer service (new)
  crosschain-relayer:
    build:
      context: .
      target: hypervisor
    command: ["python", "-m", "hypervisor.crosschain.OmnichainRelayer"]
    env_file: .env
    networks:
      - zero-trust-crosschain

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - zero-trust-grid
      - zero-trust-gateway

  grafana:
    image: grafana/grafana:10.4.1
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks:
      - zero-trust-gateway

  jaeger:
    image: jaegertracing/all-in-one:1.55.0
    ports:
      - "16686:16686" # Web UI
      - "14268:14268" # Collector HTTP
    networks:
      - zero-trust-grid
      - zero-trust-gateway
