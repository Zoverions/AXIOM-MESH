name: Audit Status Regenerate

on:
  push:
    branches:
      - audit-remediation-2026-08-30
    paths:
      - .github/workflows/audit-status-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit-remediation-2026-08-30
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Regenerate capability status artifacts
        run: |
          npm --prefix mesh run status:generate
          git diff --check
      - name: Commit generated status artifacts
        run: |
          git config user.name "axiom-audit-remediation"
          git config user.email "208527039+Zoverions@users.noreply.github.com"
          git add docs/rebuild/STATUS.md README.md CONSTITUTION.md docs/rebuild/PRODUCT-DEFINITION.md docs/rebuild/REQUIREMENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: regenerate capability status after audit remediation"
          git push origin HEAD:audit-remediation-2026-08-30
