name: Run audit verifier backfill

on:
  push:
    branches:
      - security/audit-remediation-g1-g4-2026-08-10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-remediation-g1-g4-2026-08-10
      - name: Execute reviewed backfill payload
        shell: bash
        run: |
          awk '
            found { sub(/^          /, ""); print }
            /^        run: \|$/ { found=1; next }
          ' .github/workflows/fix-audit-verifier-backfill.yml > /tmp/backfill.sh
          test -s /tmp/backfill.sh
          bash /tmp/backfill.sh
