name: Finalize machine destination claim

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/machine-destination-claim-sync-2026-08-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/machine-destination-claim-sync-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Synchronize generated markers and exact destination prose
        run: |
          npm --prefix mesh run status:generate
          node <<'NODE'
          const fs = require('node:fs');
          const replacements = new Map([
            ['README.md', [
              [
                'ceiling, and authenticated Gateway request-size, request-rate, concurrency, and response-size ceilings;',
                "ceiling, authenticated Gateway request-size, request-rate, concurrency, and response-size ceilings, and an AXIOM-computed effect destination constrained to the principal's finite destination allowlist;"
              ],
              [
                'The machine-principal capability is an authorization primitive, **not** an\nautonomous-agent runtime. Authenticated Gateway request-size, request-rate, concurrency, and response-size\nceilings are enforced and evidenced. Its schema still reserves destination\nconstraints, but destination is not a current live enforcement claim until the\ncorrect effect/adapter path and evidence are completed.',
                "The machine-principal capability is an authorization primitive, **not** an\nautonomous-agent runtime. Authenticated Gateway request-size, request-rate, concurrency, and response-size\nceilings are enforced and evidenced. For current built-in effects, AXIOM computes the\neffect destination as `local` from the authorized tool and requires it to remain\ninside the principal's finite destination ceiling. Unknown provider, remote, or MCP\ndestination semantics remain unresolved and fail closed; this is not a claim of\nremote execution or arbitrary external-destination support."
              ]
            ]]
          ]);
          for (const [path, pairs] of replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of pairs) {
              if (!text.includes(from)) throw new Error(`Expected prose drifted in ${path}: ${from.slice(0, 80)}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }
          NODE
          rm .github/workflows/finalize-machine-destination-claim.yml
          git config user.name 'axiom-claim-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md CONSTITUTION.md docs/rebuild/PRODUCT-DEFINITION.md docs/rebuild/REQUIREMENTS.md docs/rebuild/STATUS.md .github/workflows/finalize-machine-destination-claim.yml
          git commit -m 'docs: synchronize destination claim markers and README boundary'
          git push origin HEAD:docs/machine-destination-claim-sync-2026-08-09
