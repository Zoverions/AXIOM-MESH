name: Fix audit remediation source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'security/audit-remediation-g1-g4-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-remediation-g1-g4-2026-08-10
      - name: Correct computed Gateway route claim literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mesh/src/check-docs.mjs')
          text = path.read_text()
          old = "`covers all ${gatewayRoutes} authenticated \\/v1\\/ Gateway routes`"
          new = "`covers all ${gatewayRoutes} authenticated \\`/v1/\\` Gateway routes`"
          if old not in text:
              raise SystemExit('computed Gateway route claim anchor missing')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mesh/src/check-docs.mjs
          git commit -m 'fix: bind Gateway route count to literal documentation'
          git push origin HEAD:security/audit-remediation-g1-g4-2026-08-10
