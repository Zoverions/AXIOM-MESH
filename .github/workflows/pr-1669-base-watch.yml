name: PR 1669 base watch

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify-stacked-pr:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 1669 &&
       github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.number == 1669) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.number == 1669)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WATCH_PR: "1669"
      STACKED_PR: "1671"
    steps:
      - name: Post bounded watch update to stacked PR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import textwrap
          from urllib.parse import quote

          repo = os.environ["GH_REPO"]
          watch_pr = os.environ["WATCH_PR"]
          stacked_pr = os.environ["STACKED_PR"]
          event_name = os.environ["GITHUB_EVENT_NAME"]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          def run_gh(*args):
              result = subprocess.run(
                  ["gh", *args],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              return result.stdout

          def gh_json(*args):
              return json.loads(run_gh(*args))

          def post_comment(body):
              subprocess.run(
                  ["gh", "pr", "comment", stacked_pr, "--repo", repo, "--body", body],
                  check=True,
              )

          def clean(value):
              return " ".join(str(value or "").split())[:1000]

          if event_name == "pull_request_review":
              review = payload.get("review") or {}
              actor = ((review.get("user") or {}).get("login")
                       or (payload.get("sender") or {}).get("login")
                       or "unknown")
              state = review.get("state") or "submitted"
              url = review.get("html_url") or (payload.get("pull_request") or {}).get("html_url")
              summary = clean(review.get("body"))
              if not summary:
                  summary = "No review body was supplied; inspect the linked review for the state change."
              post_comment(textwrap.dedent(f"""\
                  ### Base watch: PR #{watch_pr} review feedback

                  - Event: review submitted
                  - Reviewer: @{actor}
                  - State: `{state}`
                  - Review: {url}
                  - Meaningful change: {summary}

                  PR #{stacked_pr} remains stacked and draft. No merge, rebase, retarget, push, or authority-changing action was performed by this workflow.
              """))
              raise SystemExit(0)

          if event_name == "pull_request_review_comment":
              comment = payload.get("comment") or {}
              actor = ((comment.get("user") or {}).get("login")
                       or (payload.get("sender") or {}).get("login")
                       or "unknown")
              url = comment.get("html_url") or (payload.get("pull_request") or {}).get("html_url")
              path = comment.get("path") or "(general)"
              line = comment.get("line") or comment.get("original_line")
              location = f"{path}:{line}" if line else path
              summary = clean(comment.get("body"))
              if not summary:
                  summary = "Review comment created without a text body; inspect the linked thread."
              post_comment(textwrap.dedent(f"""\
                  ### Base watch: PR #{watch_pr} review comment

                  - Event: new inline review feedback
                  - Reviewer: @{actor}
                  - Location: `{location}`
                  - Comment: {url}
                  - Meaningful change: {summary}

                  PR #{stacked_pr} remains stacked and draft. No merge, rebase, retarget, push, or authority-changing action was performed by this workflow.
              """))
              raise SystemExit(0)

          pr = payload["pull_request"]
          merged_head = pr["head"]["sha"]
          merge_commit = pr.get("merge_commit_sha") or "unknown"
          merged_url = pr["html_url"]

          repo_json = gh_json("api", f"repos/{repo}")
          default_branch = repo_json["default_branch"]

          stacked = gh_json("api", f"repos/{repo}/pulls/{stacked_pr}")
          stacked_head = stacked["head"]["sha"]
          stacked_head_ref = stacked["head"]["ref"]
          stacked_base_ref = stacked["base"]["ref"]
          stacked_draft = bool(stacked["draft"])

          base_compare = gh_json(
              "api",
              f"repos/{repo}/compare/{merged_head}...{quote(default_branch, safe='')}",
          )
          base_status = base_compare["status"]

          stack_compare = gh_json(
              "api",
              f"repos/{repo}/compare/{merged_head}...{stacked_head}",
          )
          stack_status = stack_compare["status"]

          if base_status in {"ahead", "identical"}:
              plan = textwrap.dedent(f"""\
                  **Prepared path: retarget-only.** GitHub reports merged #{watch_pr} head `{merged_head}` is an ancestor of `{default_branch}`, so #{stacked_pr} can be retargeted without rewriting its current head.

                  ```bash
                  EXPECTED_HEAD="{stacked_head}"
                  gh pr edit {stacked_pr} --repo "{repo}" --base "{default_branch}"
                  ACTUAL_HEAD="$(gh api "repos/{repo}/pulls/{stacked_pr}" --jq '.head.sha')"
                  test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
                  test "$(gh pr view {stacked_pr} --repo "{repo}" --json isDraft --jq '.isDraft')" = "true"
                  gh api "repos/{repo}/commits/$EXPECTED_HEAD/check-runs?per_page=100" \\
                    --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv'
                  ```

                  Exact-head invariant: verification belongs to `{stacked_head}`; retargeting must not change that SHA.
              """)
          elif stack_status == "ahead":
              plan = textwrap.dedent(f"""\
                  **Prepared path: rebase then retarget.** The merged #{watch_pr} head is not an ancestor of `{default_branch}` (consistent with squash/rebase-style integration), while #{stacked_pr} still descends from exact base head `{merged_head}`.

                  ```bash
                  git fetch origin "{default_branch}" "{stacked_head_ref}"
                  git switch "{stacked_head_ref}"
                  test -z "$(git status --porcelain)"
                  git merge-base --is-ancestor "{merged_head}" HEAD
                  git rebase --onto "origin/{default_branch}" "{merged_head}" "{stacked_head_ref}"
                  NEW_HEAD="$(git rev-parse HEAD)"
                  git push --force-with-lease origin "{stacked_head_ref}"
                  gh pr edit {stacked_pr} --repo "{repo}" --base "{default_branch}"
                  ACTUAL_HEAD="$(gh api "repos/{repo}/pulls/{stacked_pr}" --jq '.head.sha')"
                  test "$ACTUAL_HEAD" = "$NEW_HEAD"
                  test "$(gh pr view {stacked_pr} --repo "{repo}" --json isDraft --jq '.isDraft')" = "true"
                  gh api "repos/{repo}/commits/$NEW_HEAD/check-runs?per_page=100" \\
                    --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv'
                  ```

                  Exact-head invariant: treat `$NEW_HEAD` as the only valid verification target after the history rewrite.
              """)
          else:
              plan = textwrap.dedent(f"""\
                  **Prepared path: fail closed for ancestry inspection.** #{stacked_pr} no longer cleanly descends from merged base head `{merged_head}` (compare status: `{stack_status}`). Do not retarget or rewrite history until stack ancestry is inspected. Re-read #{stacked_pr}'s current commits against `{default_branch}`, then choose a minimal rebase/cherry-pick that preserves only the Rust-lab delta.

                  Current #{stacked_pr} exact head remains `{stacked_head}`; any later verification must bind to the post-repair head, not this pre-repair SHA.
              """)

          post_comment(textwrap.dedent(f"""\
              ### Base watch: PR #{watch_pr} merged

              - Base PR: {merged_url}
              - Merged source head: `{merged_head}`
              - Merge commit reported by GitHub: `{merge_commit}`
              - Default branch: `{default_branch}`
              - #{stacked_pr} current base: `{stacked_base_ref}`
              - #{stacked_pr} current head: `{stacked_head}`
              - #{stacked_pr} draft: `{str(stacked_draft).lower()}`

              {plan}

              This workflow only prepared and reported the next work. It did **not** rebase, retarget, push, mark ready, or merge #{stacked_pr}.
          """))
          PY
