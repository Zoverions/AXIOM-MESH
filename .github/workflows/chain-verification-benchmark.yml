name: Stacked R0 Verification

on:
  pull_request:
    branches: ["integration/stack-ci-r0-base-2026-08-12"]
    paths:
      - "mesh/**"
      - ".github/workflows/chain-verification-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-r0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact parent-stack source setup
        run: |
          npm run setup:install
          npm audit --omit=dev
          npm --prefix mesh audit --omit=dev
      - name: Verify exact R0 stacked tree
        working-directory: mesh
        run: |
          npm run check
          npm run release:verify
