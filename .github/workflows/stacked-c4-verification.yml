name: Stacked C4 Verification

on:
  pull_request:
    branches:
      - integration/stack-ci-c4-base-2026-08-11

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
          check-latest: false
      - name: Install exact current-build source setup
        run: |
          npm run setup:install
          npm audit --omit=dev
          npm --prefix mesh audit --omit=dev
      - name: Verify stacked kernel tree
        working-directory: mesh
        run: npm run check
      - name: Verify release boundary
        run: npm run release:verify
