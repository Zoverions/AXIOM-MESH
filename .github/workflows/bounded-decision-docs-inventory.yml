name: Register Bounded Decision Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bounded-decision-docs-inventory.yml'

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Register approved spec and plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mesh/src/check-docs.mjs')
          text = path.read_text(encoding='utf-8')

          spec = "  'docs/superpowers/specs/2026-09-15-bounded-decision-intelligence-v0-design.md',\n"
          spec_anchor = "  'docs/superpowers/specs/2026-09-10-continuous-threat-intelligence-defensive-adaptation-stage5b-design.md',\n"
          if spec not in text:
              if spec_anchor not in text:
                  raise SystemExit('spec anchor missing')
              text = text.replace(spec_anchor, spec_anchor + spec, 1)

          plan = "  'docs/superpowers/plans/2026-09-15-bounded-decision-intelligence-v0.md',\n"
          plan_anchor = "  'docs/superpowers/plans/2026-09-10-continuous-threat-intelligence-a-b.md',\n"
          if plan not in text:
              if plan_anchor not in text:
                  raise SystemExit('plan anchor missing')
              text = text.replace(plan_anchor, plan_anchor + plan, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit inventory registration
        run: |
          if git diff --quiet -- mesh/src/check-docs.mjs; then
            echo 'Inventory already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mesh/src/check-docs.mjs
          git commit -m 'docs: register bounded decision design artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
