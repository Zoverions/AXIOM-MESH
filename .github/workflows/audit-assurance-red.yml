name: Audit Assurance GREEN Patch

on:
  push:
    branches:
      - audit-remediation-2026-08-30
    paths:
      - .github/workflows/audit-assurance-red.yml

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit-remediation-2026-08-30
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Apply exact achieved-assurance wrapper fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('mesh/src/grid/store.mjs')
          text = path.read_text()
          old = """  getIntentContractAssessment(contractId, options = {}) {\n    this.requireIntentEvidenceChain();\n    return this.getIntentContractAssessmentFromVerifiedState(contractId, options);\n  }\n"""
          new = """  getIntentContractAssessment(contractId, options = {}) {\n    const chain = this.requireIntentEvidenceChain();\n    const state = this.getIntentContractAssessmentFromVerifiedState(contractId, options);\n    return {\n      ...state,\n      chain: {\n        ...state.chain,\n        verification_mode: chain.verification_mode\n      }\n    };\n  }\n"""
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'expected one exact intent assessment wrapper, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run targeted live-chain regression test
        run: node --test mesh/test/live-chain-verification.test.mjs
      - name: Commit minimal production fix
        run: |
          git config user.name "axiom-audit-remediation"
          git config user.email "208527039+Zoverions@users.noreply.github.com"
          git add mesh/src/grid/store.mjs
          git commit -m "fix: report achieved intent verification mode"
          git push origin HEAD:audit-remediation-2026-08-30
