name: Replay Status Patch

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: design/replay-grounded-self-improvement
          fetch-depth: 0
          persist-credentials: true
      - name: Synchronize truthful implementation status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/specs/2026-09-16-replay-grounded-self-improvement-design.md')
          text = path.read_text(encoding='utf-8')
          old = '**Status:** approved architectural design; Replay Core v0 implementation plan approved for execution; implementation not yet verified'
          new = '**Status:** approved architectural design; Replay Core v0 implemented as an inert, zero-authority laboratory; production promotion not claimed'
          if old not in text:
              raise SystemExit('expected status line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-09-16-replay-grounded-self-improvement-design.md
          git commit -m "docs: reconcile Replay Core implementation status"
          git push origin HEAD:design/replay-grounded-self-improvement
