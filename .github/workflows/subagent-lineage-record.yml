name: Subagent Lineage Record

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/src/lib/agent-trust-subagent-lineage-record.mjs"
      - "mesh/test/agent-trust-subagent-lineage-record.test.mjs"
      - ".github/workflows/subagent-lineage-record.yml"

permissions:
  contents: read

concurrency:
  group: subagent-lineage-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-subagent-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run subagent lineage record regression
        run: node --test mesh/test/agent-trust-subagent-lineage-record.test.mjs
