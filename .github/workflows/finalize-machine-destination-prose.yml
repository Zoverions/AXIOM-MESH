name: Finalize machine destination prose

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/machine-destination-claim-sync-2026-08-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/machine-destination-claim-sync-2026-08-09
          fetch-depth: 0
      - name: Reconcile exact destination security and roadmap prose
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const edits = {
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md': [
              [
                '  revalidates constrained agent principals, intersects the machine\n  execution-time ceiling with policy, constructs an explicit plan, and issues',
                "  revalidates constrained agent principals, computes the current built-in effect\n  destination from the policy-selected tool, enforces the principal's finite\n  destination ceiling, intersects the machine execution-time ceiling with policy,\n  constructs an explicit plan, and issues"
              ],
              [
                'currently enforced execution-time ceiling and authenticated Gateway request-size,\nrequest-rate, concurrency, and response-size ceilings. Wildcard scope and administrator role',
                "currently enforced execution-time ceiling, authenticated Gateway request-size,\nrequest-rate, concurrency, and response-size ceilings, and an AXIOM-computed\ncurrent built-in effect destination constrained to the principal's finite destination\nallowlist. Wildcard scope and administrator role"
              ],
              [
                'The v1 machine schema still contains a destination field. Destination is validated\nas a schema input but is **not** a current live-enforcement claim until the\ncorrect effect/adapter enforcement path and evidence are implemented. Runtime IDs and\nsoftware digests are attribution/binding metadata; they are not hardware,',
                "The v1 machine schema contains a finite destination ceiling. For current built-in\neffects, Hypervisor derives the destination from the policy-selected `builtin.*`\ntool, which resolves canonically to `local`, and denies the request before capability\nissuance when that computed destination is not allowed. Sandbox independently\nrecomputes and verifies the signed destination before execution. Unknown provider,\nremote, or MCP destination semantics remain unresolved and fail closed; no arbitrary\nexternal-destination or remote-execution claim follows. Runtime IDs and software\ndigests are attribution/binding metadata; they are not hardware,"
              ],
              [
                '| Machine action or purpose escalation | Ordinary policy is evaluated first and machine action/purpose ceilings form a second deny-dominant layer; machine constraints can only reduce authority | The destination schema field is not yet a live machine-specific enforcement claim |',
                "| Machine action, purpose, or destination escalation | Ordinary policy is evaluated first; machine action/purpose ceilings form a second deny-dominant layer; current built-in effect destination is computed from the authorized tool and must remain inside the principal's finite destination ceiling | External/provider/MCP destination semantics and remote execution remain unimplemented and fail closed |"
              ],
              [
                '- a machine request whose action or purpose is outside its profile, whose\n  authority digest changed after approval, or whose runtime metadata is',
                '- a machine request whose action, purpose, or computed effect destination is outside\n  its profile, whose authority digest changed after approval, or whose runtime metadata is'
              ]
            ],
            'docs/PROJECT-STATUS-2026.md': [
              [
                '  execution-time ceiling, and authenticated Gateway request-size, request-rate,\n  concurrency, and response-size ceilings; machine authority digests bind',
                "  execution-time ceiling, authenticated Gateway request-size, request-rate,\n  concurrency, and response-size ceilings, and an AXIOM-computed current built-in\n  effect destination constrained to the principal's finite destination allowlist;\n  machine authority digests bind"
              ],
              [
                'The constrained machine-principal capability is an authorization primitive,\nnot an autonomous-agent runtime. Request size, request rate, concurrency, and\nresponse size are enforced at authenticated Gateway boundaries. The v1 schema\nstill reserves destination, but destination is not a live-enforcement claim\nuntil the correct effect/adapter path and evidence exist. Runtime IDs and software digests are attribution metadata rather than\nTPM/TEE or measured-runtime attestation.',
                "The constrained machine-principal capability is an authorization primitive,\nnot an autonomous-agent runtime. Request size, request rate, concurrency, and\nresponse size are enforced at authenticated Gateway boundaries. For current\nbuilt-in effects, AXIOM computes the effect destination from the authorized tool,\nresolves `builtin.*` to `local`, and requires that destination to remain inside the\nprincipal's finite destination ceiling before capability issuance/execution. Unknown\nprovider, remote, or MCP destination semantics remain unresolved and fail closed.\nRuntime IDs and software digests are attribution metadata rather than TPM/TEE or\nmeasured-runtime attestation."
              ],
              [
                '- machine-specific destination, rate, concurrency, request-size, or\n  response-size enforcement beyond the current global controls;',
                '- arbitrary external/provider/MCP destination semantics or remote machine effect\n  execution beyond the current verified local built-in destination mapping;'
              ],
              [
                'Complete the AXIOM Invocation Envelope and live enforcement for the remaining\nmachine destination, rate, concurrency, request-size, and response-size limits;\nadd machine-filtered capability discovery; bind credentials and artifacts to',
                'The native Invocation Envelope and current machine action/purpose, execution-time,\nrequest-size, request-rate, concurrency, response-size, and local computed-destination\nenforcement are implemented; next add machine-filtered capability discovery and bind\ncredentials and artifacts to'
              ]
            ],
            'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md': [
              [
                '- [x] Define purpose and destination restrictions. Purpose/action ceilings are live; destination remains schema-only until its effect/adapter boundary is implemented.',
                '- [x] Define purpose and destination restrictions. Purpose/action ceilings are live; current built-in effect destination is AXIOM-computed as `local` and enforced against the finite principal ceiling; external/provider/MCP destination semantics remain future adapter work.'
              ],
              [
                '**Implemented checkpoint:** `core.machine-principals` is an implemented registry capability. Its current verified bounds include sponsorship, finite scopes, action/purpose ceilings, runtime identity, expiry, non-delegation, execution time, authenticated Gateway request size, authenticated Gateway request rate, authenticated Gateway concurrency, and authenticated Gateway response size. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, destination-effect enforcement, or hardware/runtime attestation.',
                '**Implemented checkpoint:** `core.machine-principals` is an implemented registry capability. Its current verified bounds include sponsorship, finite scopes, action/purpose ceilings, runtime identity, expiry, non-delegation, execution time, authenticated Gateway request size, authenticated Gateway request rate, authenticated Gateway concurrency, authenticated Gateway response size, and AXIOM-computed current built-in effect destination constrained to the principal allowlist. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, external/provider destination semantics, or hardware/runtime attestation.'
              ],
              [
                'The current native core binds caller, canonical request/input identity, purpose/data scopes, policy/risk/approval requirement, execution timeout, machine sponsor/runtime/authority, live ingress limits, and one invocation digest through Grid acceptance, capability, Sandbox attestation, mutation evidence, and returned result; capability/version projection, destination effects, causal parent, and fuller result/artifact semantics remain open.',
                'The current native core binds caller, canonical request/input identity, purpose/data scopes, policy/risk/approval requirement, execution timeout, machine sponsor/runtime/authority, live ingress limits, the AXIOM-computed current built-in effect destination, and one invocation digest through Grid acceptance, capability, Sandbox attestation, mutation evidence, and returned result; capability/version projection, external/provider destination semantics, causal parent, and fuller result/artifact semantics remain open.'
              ],
              [
                'MCP, A2A, delegation, remote execution, destination effects, async task/artifact semantics, and production promotion remain non-claims.',
                'MCP, A2A, delegation, remote execution, external/provider destination semantics, async task/artifact semantics, and production promotion remain non-claims.'
              ]
            ]
          };
          for (const [path, pairs] of Object.entries(edits)) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of pairs) {
              if (!text.includes(from)) throw new Error(`Expected prose drifted in ${path}: ${from.slice(0, 100)}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }
          NODE
          rm .github/workflows/finalize-machine-destination-prose.yml
          git config user.name 'axiom-claim-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/security/CURRENT-BUILD-THREAT-MODEL.md docs/PROJECT-STATUS-2026.md docs/MASTER-TODO-AGENT-INTEROPERABILITY.md .github/workflows/finalize-machine-destination-prose.yml
          git commit -m 'docs: reconcile verified machine destination boundaries'
          git push origin HEAD:docs/machine-destination-claim-sync-2026-08-09
