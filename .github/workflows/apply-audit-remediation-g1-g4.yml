name: Apply audit remediation G1-G4

on:
  push:
    branches:
      - security/audit-remediation-g1-g4-2026-08-10

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/security/audit-remediation-g1-g4-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-remediation-g1-g4-2026-08-10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Apply bounded fail-closed audit remediation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function replaceExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`Missing exact anchor in ${path}: ${before.slice(0, 120)}`);
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }
          function replaceAllExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              if (source.includes(after)) return;
              throw new Error(`Missing global anchor in ${path}: ${before}`);
            }
            source = source.split(before).join(after);
            fs.writeFileSync(path, source);
          }
          function canonicalize(value) {
            if (value === null || typeof value !== 'object') return value;
            if (Array.isArray(value)) return value.map(canonicalize);
            const out = {};
            for (const key of Object.keys(value).sort()) out[key] = canonicalize(value[key]);
            return out;
          }
          function digestObject(value) {
            return crypto.createHash('sha256')
              .update(JSON.stringify(canonicalize(value)))
              .digest('hex');
          }

          // G-1: crash injection is test-only and production ignores the variable entirely.
          replaceExact(
            'mesh/src/backup-maintenance.mjs',
            `function maybeCrashAfterRetirement(count) {\n  const configured = process.env.AXIOM_TEST_BACKUP_RETENTION_CRASH_AFTER_MOVE;\n  if (configured === undefined) return;\n  if (!/^[1-9][0-9]{0,3}$/.test(configured)) {\n    throw new ValidationError(\n      'AXIOM_TEST_BACKUP_RETENTION_CRASH_AFTER_MOVE is invalid'\n    );\n  }\n  if (count === Number(configured)) process.kill(process.pid, 'SIGKILL');\n}`,
            `function maybeCrashAfterRetirement(count) {\n  if (shouldCrashAfterRetirementForTest(count)) {\n    process.kill(process.pid, 'SIGKILL');\n  }\n}\n\nexport function shouldCrashAfterRetirementForTest(count, {\n  environment = process.env.NODE_ENV,\n  configured = process.env.AXIOM_TEST_BACKUP_RETENTION_CRASH_AFTER_MOVE\n} = {}) {\n  if (environment !== 'test' || configured === undefined) return false;\n  if (!/^[1-9][0-9]{0,3}$/.test(configured)) {\n    throw new ValidationError(\n      'AXIOM_TEST_BACKUP_RETENTION_CRASH_AFTER_MOVE is invalid'\n    );\n  }\n  return count === Number(configured);\n}`
          );

          // G-2/G-3: scope global registry reads, bound them, and reject malformed numeric queries.
          replaceExact(
            'mesh/src/gateway/server.mjs',
            `  router.add('GET', '/v1/events', async ({ url, traceId, principal }) => {\n    const requestedActor = url.searchParams.get('actor');\n    const actor = hasScope(principal, 'audit:read') && requestedActor ? requestedActor : principal.id;\n    const after = Math.max(0, Number(url.searchParams.get('after') ?? 0));\n    const limit = Math.max(1, Math.min(500, Number(url.searchParams.get('limit') ?? 100)));\n    return gridGet(\n      \`/internal/v1/events?actor=\${encodeURIComponent(actor)}&after=\${after}&limit=\${limit}\`,\n      traceId\n    );\n  });\n\n  router.add('GET', '/v1/capsules', async ({ traceId }) => gridGet('/internal/v1/capsules', traceId));\n  router.add('GET', '/v1/proposals', async ({ traceId }) => gridGet('/internal/v1/proposals', traceId));\n  router.add('GET', '/v1/nodes', async ({ traceId }) => gridGet('/internal/v1/nodes', traceId));`,
            `  router.add('GET', '/v1/events', async ({ url, traceId, principal }) => {\n    const requestedActor = url.searchParams.get('actor');\n    const actor = hasScope(principal, 'audit:read') && requestedActor ? requestedActor : principal.id;\n    const after = boundedIntegerQuery(url.searchParams.get('after'), 0, {\n      label: 'events after',\n      min: 0,\n      max: Number.MAX_SAFE_INTEGER\n    });\n    const limit = boundedIntegerQuery(url.searchParams.get('limit'), 100, {\n      label: 'events limit',\n      min: 1,\n      max: 500\n    });\n    return gridGet(\n      \`/internal/v1/events?actor=\${encodeURIComponent(actor)}&after=\${after}&limit=\${limit}\`,\n      traceId\n    );\n  });\n\n  router.add('GET', '/v1/capsules', async ({ url, traceId, principal }) => {\n    requireScope(principal, 'capsule:read');\n    const limit = boundedIntegerQuery(url.searchParams.get('limit'), 100, {\n      label: 'capsules limit',\n      min: 1,\n      max: 100\n    });\n    return gridGet(\`/internal/v1/capsules?limit=\${limit}\`, traceId);\n  });\n  router.add('GET', '/v1/proposals', async ({ url, traceId, principal }) => {\n    requireScope(principal, 'governance:read');\n    const limit = boundedIntegerQuery(url.searchParams.get('limit'), 100, {\n      label: 'proposals limit',\n      min: 1,\n      max: 100\n    });\n    return gridGet(\`/internal/v1/proposals?limit=\${limit}\`, traceId);\n  });\n  router.add('GET', '/v1/nodes', async ({ url, traceId, principal }) => {\n    requireScope(principal, 'node:read');\n    const limit = boundedIntegerQuery(url.searchParams.get('limit'), 100, {\n      label: 'nodes limit',\n      min: 1,\n      max: 100\n    });\n    return gridGet(\`/internal/v1/nodes?limit=\${limit}\`, traceId);\n  });`
          );
          replaceExact(
            'mesh/src/gateway/server.mjs',
            `function hasScope(principal, scope) {\n  return principal.scopes?.includes('*') || principal.scopes?.includes(scope);\n}\n\nfunction enforceTelemetryCollectionBoundary(req, principal) {`,
            `function hasScope(principal, scope) {\n  return principal.scopes?.includes('*') || principal.scopes?.includes(scope);\n}\n\nfunction requireScope(principal, scope) {\n  if (!hasScope(principal, scope)) {\n    throw new AxiomError('forbidden', \`\${scope} scope is required\`, 403);\n  }\n}\n\nfunction boundedIntegerQuery(value, fallback, { label, min, max }) {\n  if (value === null || value === '') return fallback;\n  if (!/^(0|[1-9][0-9]*)$/.test(value)) {\n    throw new ValidationError(\`\${label} must be an integer between \${min} and \${max}\`);\n  }\n  const parsed = Number(value);\n  if (!Number.isSafeInteger(parsed) || parsed < min || parsed > max) {\n    throw new ValidationError(\`\${label} must be an integer between \${min} and \${max}\`);\n  }\n  return parsed;\n}\n\nfunction enforceTelemetryCollectionBoundary(req, principal) {`
          );

          replaceExact(
            'mesh/src/grid/server.mjs',
            `  router.add('GET', '/internal/v1/events', async ({ url }) => ({\n    events: store.listEvents({\n      after: Number(url.searchParams.get('after') ?? 0),\n      limit: Number(url.searchParams.get('limit') ?? 100),\n      actor: url.searchParams.get('actor') ?? undefined\n    })\n  }));\n  router.add('GET', '/internal/v1/intents/:id', async ({ params }) => store.getIntent(params.id));\n  router.add('GET', '/internal/v1/capsules', async () => ({ capsules: store.listCapsules() }));\n  router.add('GET', '/internal/v1/proposals', async () => ({ proposals: store.listProposals() }));\n  router.add('GET', '/internal/v1/nodes', async () => ({ nodes: store.listNodes() }));`,
            `  router.add('GET', '/internal/v1/events', async ({ url }) => ({\n    events: store.listEvents({\n      after: integerQuery(url.searchParams.get('after'), 0, {\n        label: 'events after',\n        min: 0,\n        max: Number.MAX_SAFE_INTEGER\n      }),\n      limit: integerQuery(url.searchParams.get('limit'), 100, {\n        label: 'events limit',\n        min: 1,\n        max: 500\n      }),\n      actor: url.searchParams.get('actor') ?? undefined\n    })\n  }));\n  router.add('GET', '/internal/v1/intents/:id', async ({ params }) => store.getIntent(params.id));\n  router.add('GET', '/internal/v1/capsules', async ({ url }) => ({\n    capsules: store.listCapsules({\n      limit: integerQuery(url.searchParams.get('limit'), 100, {\n        label: 'capsules limit',\n        min: 1,\n        max: 100\n      })\n    })\n  }));\n  router.add('GET', '/internal/v1/proposals', async ({ url }) => ({\n    proposals: store.listProposals({\n      limit: integerQuery(url.searchParams.get('limit'), 100, {\n        label: 'proposals limit',\n        min: 1,\n        max: 100\n      })\n    })\n  }));\n  router.add('GET', '/internal/v1/nodes', async ({ url }) => ({\n    nodes: store.listNodes({\n      limit: integerQuery(url.searchParams.get('limit'), 100, {\n        label: 'nodes limit',\n        min: 1,\n        max: 100\n      })\n    })\n  }));`
          );
          replaceExact(
            'mesh/src/grid/server.mjs',
            `function integerQuery(value, fallback) {\n  if (value === null || value === '') return fallback;\n  const parsed = Number(value);\n  if (!Number.isSafeInteger(parsed)) {\n    throw new ValidationError('Node discovery integer query is invalid');\n  }\n  return parsed;\n}`,
            `function integerQuery(value, fallback, {\n  label = 'integer query',\n  min = 0,\n  max = Number.MAX_SAFE_INTEGER\n} = {}) {\n  if (value === null || value === '') return fallback;\n  if (!/^(0|[1-9][0-9]*)$/.test(value)) {\n    throw new ValidationError(\`\${label} is invalid\`);\n  }\n  const parsed = Number(value);\n  if (!Number.isSafeInteger(parsed) || parsed < min || parsed > max) {\n    throw new ValidationError(\`\${label} is invalid\`);\n  }\n  return parsed;\n}`
          );

          replaceExact(
            'mesh/src/grid/_store-core.mjs',
            `  listEvents({ after = 0, limit = 100, actor } = {}) {\n    const safeLimit = Math.max(1, Math.min(500, Number(limit) || 100));\n    const rows = actor\n      ? this.db.prepare('SELECT * FROM events WHERE seq > ? AND actor = ? ORDER BY seq LIMIT ?').all(after, actor, safeLimit)\n      : this.db.prepare('SELECT * FROM events WHERE seq > ? ORDER BY seq LIMIT ?').all(after, safeLimit);\n    return rows.map(row => this.decodeEventRow(row));\n  }\n\n  listCapsules() {\n    return this.db.prepare('SELECT * FROM capsules ORDER BY registered_at DESC').all().map(\n      row => this.decodeProtectedRow('capsules', 'digest', row, ['manifest_json'])\n    );\n  }\n\n  listProposals() {\n    return this.db.prepare(\`\n      SELECT\n        p.*,\n        COALESCE(SUM(CASE WHEN v.chamber = 'human' AND v.choice = 'for' THEN v.weight ELSE 0 END), 0) AS human_for,\n        COALESCE(SUM(CASE WHEN v.chamber = 'human' AND v.choice = 'against' THEN v.weight ELSE 0 END), 0) AS human_against,\n        COALESCE(SUM(CASE WHEN v.chamber = 'agent' AND v.choice = 'for' THEN v.weight ELSE 0 END), 0) AS agent_for,\n        COALESCE(SUM(CASE WHEN v.chamber = 'agent' AND v.choice = 'against' THEN v.weight ELSE 0 END), 0) AS agent_against\n      FROM proposals p\n      LEFT JOIN votes v ON v.proposal_id = p.proposal_id\n      GROUP BY p.proposal_id\n      ORDER BY p.created_at DESC\n    \`).all().map(row => this.decodeProtectedRow(\n      'proposals',\n      'proposal_id',\n      row,\n      ['action_json', 'rollback_json']\n    ));\n  }`,
            `  listEvents({ after = 0, limit = 100, actor } = {}) {\n    const safeAfter = boundedInteger(after, 'event after', 0, Number.MAX_SAFE_INTEGER);\n    const safeLimit = boundedInteger(limit, 'event limit', 1, 500);\n    const rows = actor\n      ? this.db.prepare('SELECT * FROM events WHERE seq > ? AND actor = ? ORDER BY seq LIMIT ?').all(safeAfter, actor, safeLimit)\n      : this.db.prepare('SELECT * FROM events WHERE seq > ? ORDER BY seq LIMIT ?').all(safeAfter, safeLimit);\n    return rows.map(row => this.decodeEventRow(row));\n  }\n\n  listCapsules({ limit } = {}) {\n    const rows = limit === undefined\n      ? this.db.prepare('SELECT * FROM capsules ORDER BY registered_at DESC').all()\n      : this.db.prepare('SELECT * FROM capsules ORDER BY registered_at DESC LIMIT ?').all(\n          boundedInteger(limit, 'capsule list limit', 1, 100)\n        );\n    return rows.map(\n      row => this.decodeProtectedRow('capsules', 'digest', row, ['manifest_json'])\n    );\n  }\n\n  listProposals({ limit } = {}) {\n    const safeLimit = limit === undefined\n      ? null\n      : boundedInteger(limit, 'proposal list limit', 1, 100);\n    const sql = \`\n      SELECT\n        p.*,\n        COALESCE(SUM(CASE WHEN v.chamber = 'human' AND v.choice = 'for' THEN v.weight ELSE 0 END), 0) AS human_for,\n        COALESCE(SUM(CASE WHEN v.chamber = 'human' AND v.choice = 'against' THEN v.weight ELSE 0 END), 0) AS human_against,\n        COALESCE(SUM(CASE WHEN v.chamber = 'agent' AND v.choice = 'for' THEN v.weight ELSE 0 END), 0) AS agent_for,\n        COALESCE(SUM(CASE WHEN v.chamber = 'agent' AND v.choice = 'against' THEN v.weight ELSE 0 END), 0) AS agent_against\n      FROM proposals p\n      LEFT JOIN votes v ON v.proposal_id = p.proposal_id\n      GROUP BY p.proposal_id\n      ORDER BY p.created_at DESC\n      \${safeLimit === null ? '' : 'LIMIT ?'}\n    \`;\n    const rows = safeLimit === null\n      ? this.db.prepare(sql).all()\n      : this.db.prepare(sql).all(safeLimit);\n    return rows.map(row => this.decodeProtectedRow(\n      'proposals',\n      'proposal_id',\n      row,\n      ['action_json', 'rollback_json']\n    ));\n  }`
          );
          replaceExact(
            'mesh/src/grid/_store-core.mjs',
            `  listNodes({ asOf = new Date().toISOString() } = {}) {\n    return this.decodedNodes().map(node => {`,
            `  listNodes({ asOf = new Date().toISOString(), limit } = {}) {\n    return this.decodedNodes({ limit }).map(node => {`
          );
          replaceExact(
            'mesh/src/grid/_store-core.mjs',
            `  decodedNodes() {\n    return this.db.prepare(\n      'SELECT * FROM nodes ORDER BY registered_at DESC'\n    ).all().map(row => {`,
            `  decodedNodes({ limit } = {}) {\n    const rows = limit === undefined\n      ? this.db.prepare('SELECT * FROM nodes ORDER BY registered_at DESC').all()\n      : this.db.prepare('SELECT * FROM nodes ORDER BY registered_at DESC LIMIT ?').all(\n          boundedInteger(limit, 'node list limit', 1, 100)\n        );\n    return rows.map(row => {`
          );
          replaceExact(
            'mesh/src/grid/_store-core.mjs',
            `function validDate(value) {\n  if (typeof value !== 'string') return null;`,
            `function boundedInteger(value, label, min, max) {\n  if (!Number.isSafeInteger(value) || value < min || value > max) {\n    throw new ValidationError(\`\${label} must be an integer between \${min} and \${max}\`);\n  }\n  return value;\n}\n\nfunction validDate(value) {\n  if (typeof value !== 'string') return null;`
          );

          // Contract: read scopes plus optional limit on the three registry routes.
          const contractPath = 'mesh/config/gateway-client-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const contractUpdates = {
            'capsules.list': 'capsule:read',
            'proposals.list': 'governance:read',
            'nodes.list': 'node:read'
          };
          for (const [id, access] of Object.entries(contractUpdates)) {
            const route = contract.routes.find(item => item.id === id);
            if (!route) throw new Error(`Missing Gateway contract route ${id}`);
            route.access = access;
            route.query_parameters = ['limit'];
          }
          fs.writeFileSync(contractPath, `${JSON.stringify(contract, null, 2)}\n`);
          const contractDigest = digestObject(contract);
          replaceExact(
            'mesh/src/lib/gateway-client-contract.mjs',
            `const EXPECTED_CONTRACT_DIGEST =\n  '2fbee3cfd9702cc889058018735b40c7c795adec60d6499ea9b20b90053e6d7f';`,
            `const EXPECTED_CONTRACT_DIGEST =\n  '${contractDigest}';`
          );

          // G-4: pin the actual load-bearing workflow and ensure app/client changes trigger it.
          const kernelPath = '.github/workflows/kernel.yml';
          let kernel = fs.readFileSync(kernelPath, 'utf8');
          kernel = kernel.replaceAll('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04');
          kernel = kernel.replaceAll(
            'uses: actions/checkout@v7',
            'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7'
          );
          kernel = kernel.replaceAll(
            'uses: actions/setup-node@v7',
            'uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7'
          );
          kernel = kernel.replaceAll(
            'uses: actions/upload-artifact@v7',
            'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7'
          );
          const pathAnchor = '      - "mesh/**"\n      - "docs/**"';
          if ((kernel.match(/      - "apps\/\*\*"/g) ?? []).length !== 2) {
            kernel = kernel.replaceAll(
              pathAnchor,
              '      - "mesh/**"\n      - "apps/**"\n      - "packages/**"\n      - "docs/**"'
            );
          }
          fs.writeFileSync(kernelPath, kernel);

          // D-1 plus the additional 27->28 contract-document drift.
          replaceExact(
            'README.md',
            'machine-readable default-deny policy permits only 38 current internal',
            'machine-readable default-deny policy permits only 39 current internal'
          );
          replaceExact(
            'docs/PRODUCTION-GRADE.md',
            'readable default-deny policy permits only 38 current internal',
            'readable default-deny policy permits only 39 current internal'
          );
          replaceExact(
            'docs/operations/GATEWAY-CLIENT-CONTRACT.md',
            '**Updated:** 2026-08-01',
            '**Updated:** 2026-08-10'
          );
          replaceExact(
            'docs/operations/GATEWAY-CLIENT-CONTRACT.md',
            'The contract covers all 27 authenticated `/v1/` Gateway routes.',
            'The contract covers all 28 authenticated `/v1/` Gateway routes.'
          );
          replaceExact(
            'docs/operations/GATEWAY-CLIENT-CONTRACT.md',
            `| \`capabilities.list\` | \`GET /v1/capabilities\` | authenticated | none |\n| \`status.get\` | \`GET /v1/status\` | authenticated | none |`,
            `| \`capabilities.list\` | \`GET /v1/capabilities\` | authenticated | none |\n| \`machine_discovery.get\` | \`GET /v1/machine-discovery\` | constrained machine | none |\n| \`status.get\` | \`GET /v1/status\` | authenticated | none |`
          );
          replaceExact(
            'docs/operations/GATEWAY-CLIENT-CONTRACT.md',
            `| \`capsules.list\` | \`GET /v1/capsules\` | authenticated | none |\n| \`proposals.list\` | \`GET /v1/proposals\` | authenticated | none |\n| \`nodes.list\` | \`GET /v1/nodes\` | authenticated | none |`,
            `| \`capsules.list\` | \`GET /v1/capsules\` | \`capsule:read\` | optional \`limit\` (1-100; default 100) |\n| \`proposals.list\` | \`GET /v1/proposals\` | \`governance:read\` | optional \`limit\` (1-100; default 100) |\n| \`nodes.list\` | \`GET /v1/nodes\` | \`node:read\` | optional \`limit\` (1-100; default 100) |`
          );
          replaceExact(
            'docs/operations/GATEWAY-CLIENT-CONTRACT.md',
            'The checker parses every literal Gateway `router.add()` declaration and',
            'The three global registry/history reads are explicitly scoped and bounded to at most 100 rows per call; malformed numeric query values fail with HTTP 400 rather than silently changing meaning.\n\nThe checker parses every literal Gateway `router.add()` declaration and'
          );

          // Make numeric documentation claims load-bearing instead of link-only.
          replaceExact(
            'mesh/src/check-docs.mjs',
            `import { ValidationError } from './lib/canonical.mjs';`,
            `import { ValidationError } from './lib/canonical.mjs';\nimport {\n  ACTIVE_SERVICE_NETWORK_POLICY,\n  validateServiceNetworkPolicy\n} from './lib/service-network-policy.mjs';\nimport { ACTIVE_GATEWAY_CLIENT_CONTRACT } from './lib/gateway-client-contract.mjs';`
          );
          replaceExact(
            'mesh/src/check-docs.mjs',
            `  if (normalize(contents.get('SECURITY.md')) !== normalize(contents.get('.github/SECURITY.md'))) {\n    throw new ValidationError('Root and GitHub security policies have drifted');\n  }\n\n  let checkedLinks = 0;`,
            `  if (normalize(contents.get('SECURITY.md')) !== normalize(contents.get('.github/SECURITY.md'))) {\n    throw new ValidationError('Root and GitHub security policies have drifted');\n  }\n  verifyComputedDocumentationClaims(contents);\n\n  let checkedLinks = 0;`
          );
          replaceExact(
            'mesh/src/check-docs.mjs',
            `async function verifyRepositoryMarkdownBoundary(repositoryRoot) {`,
            `function verifyComputedDocumentationClaims(contents) {\n  const network = validateServiceNetworkPolicy(ACTIVE_SERVICE_NETWORK_POLICY);\n  const gatewayRoutes = ACTIVE_GATEWAY_CLIENT_CONTRACT.routes.length;\n  const claims = [\n    ['README.md', \`permits only \${network.routes} current internal\`],\n    ['docs/PRODUCTION-GRADE.md', \`permits only \${network.routes} current internal\`],\n    ['docs/rebuild/PRODUCT-DEFINITION.md', \`authorizes only \${network.routes} exact caller\`],\n    ['docs/PROJECT-STATUS-2026.md', \`default-deny \${network.routes}-route application\`],\n    ['docs/operations/GATEWAY-CLIENT-CONTRACT.md', \`covers all \${gatewayRoutes} authenticated \\/v1\\/ Gateway routes\`],\n    ['docs/PROJECT-STATUS-2026.md', \`implemented for all \${gatewayRoutes} authenticated routes\`]\n  ];\n  for (const [path, expected] of claims) {\n    if (!contents.get(path)?.includes(expected)) {\n      throw new ValidationError(\n        \`Canonical documentation numeric claim drifted: \${path} -> \${expected}\`\n      );\n    }\n  }\n}\n\nasync function verifyRepositoryMarkdownBoundary(repositoryRoot) {`
          );

          // F-10: the example production environment must satisfy current production config invariants.
          fs.writeFileSync('.env.example', `# Supported clean-kernel production configuration\nNODE_ENV=production\nAXIOM_AUTO_BOOTSTRAP=false\nAXIOM_REQUIRE_DENY_EGRESS=true\nAXIOM_DATA_DIR=/var/lib/axiom-mesh\nAXIOM_DATA_KEY_FILE=/run/secrets/data-protection.key\nAXIOM_API_TOKENS_FILE=/run/secrets/api-tokens.json\nAXIOM_POLICY_PATHS=["/etc/axiom-mesh/policy.json"]\nAXIOM_INTERNAL_TLS=true\nAXIOM_TRANSPORT_DIR=/run/secrets/transport\nAXIOM_GATEWAY_SOCKET=/run/axiom-mesh/gateway.sock\nAXIOM_GATEWAY_HOST=127.0.0.1\nAXIOM_INTERNAL_HOST=127.0.0.1\nAXIOM_GATEWAY_PORT=8080\nAXIOM_HYPERVISOR_PORT=8081\nAXIOM_SANDBOX_PORT=8082\nAXIOM_GRID_PORT=8083\nAXIOM_HYPERVISOR_URL=https://127.0.0.1:8081\nAXIOM_SANDBOX_URL=https://127.0.0.1:8082\nAXIOM_GRID_URL=https://127.0.0.1:8083\nAXIOM_LOG_REQUESTS=true\n`);

          NODE

          cat > mesh/test/audit-remediation-boundaries.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import { mkdtemp, readFile, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import test from 'node:test';
          import { createGatewayClient } from '../../packages/axiom-client/index.mjs';
          import { shouldCrashAfterRetirementForTest } from '../src/backup-maintenance.mjs';
          import { meshConfig } from '../src/lib/config.mjs';
          import { startDevelopmentStack } from '../src/dev.mjs';
          import { reserveProductionPortBlock } from '../src/lib/production-host.mjs';

          const ADMIN_TOKEN = `audit-admin-${'a'.repeat(32)}`;
          const MACHINE_TOKEN = `audit-machine-${'m'.repeat(32)}`;

          test('backup retention crash injection is inert outside NODE_ENV=test', () => {
            assert.equal(shouldCrashAfterRetirementForTest(1, {
              environment: 'production',
              configured: '1'
            }), false);
            assert.equal(shouldCrashAfterRetirementForTest(1, {
              environment: 'development',
              configured: '1'
            }), false);
            assert.equal(shouldCrashAfterRetirementForTest(1, {
              environment: 'test',
              configured: '1'
            }), true);
            assert.throws(
              () => shouldCrashAfterRetirementForTest(1, {
                environment: 'test',
                configured: 'invalid'
              }),
              /is invalid/
            );
            assert.equal(shouldCrashAfterRetirementForTest(1, {
              environment: 'production',
              configured: 'invalid'
            }), false);
          });

          test('.env.example satisfies the current production configuration invariants', async () => {
            const serialized = await readFile(new URL('../../.env.example', import.meta.url), 'utf8');
            const parsed = Object.fromEntries(serialized
              .split(/\r?\n/)
              .filter(line => line && !line.startsWith('#'))
              .map(line => {
                const index = line.indexOf('=');
                return [line.slice(0, index), line.slice(index + 1)];
              }));
            const prior = new Map();
            for (const [key, value] of Object.entries(parsed)) {
              prior.set(key, process.env[key]);
              process.env[key] = value;
            }
            try {
              const config = meshConfig();
              assert.equal(config.environment, 'production');
              assert.equal(config.requireDenyEgress, true);
              assert.equal(config.transport.enabled, true);
              assert.match(config.gatewaySocket, /gateway\.sock$/);
              assert.equal(new URL(config.urls.hypervisor).protocol, 'https:');
              assert.equal(new URL(config.urls.sandbox).protocol, 'https:');
              assert.equal(new URL(config.urls.grid).protocol, 'https:');
            } finally {
              for (const [key, value] of prior) {
                if (value === undefined) delete process.env[key];
                else process.env[key] = value;
              }
            }
          });

          test('low-privilege machine cannot enumerate global registries and malformed queries fail closed', async t => {
            const dataDir = await mkdtemp(join(tmpdir(), 'axiom-audit-remediation-'));
            const lease = await reserveProductionPortBlock('audit remediation read scope');
            const basePort = lease.base_port;
            let stack;
            t.after(async () => {
              try {
                await stack?.stop();
              } finally {
                await lease.release();
                await rm(dataDir, { recursive: true, force: true });
              }
            });
            stack = await startDevelopmentStack({
              dataDir,
              environment: 'test',
              autoBootstrap: true,
              gatewayPort: basePort,
              hypervisorPort: basePort + 1,
              sandboxPort: basePort + 2,
              gridPort: basePort + 3,
              hypervisorUrl: `http://127.0.0.1:${basePort + 1}`,
              sandboxUrl: `http://127.0.0.1:${basePort + 2}`,
              gridUrl: `http://127.0.0.1:${basePort + 3}`,
              rateLimitCapacity: 1_000,
              rateLimitRefillPerSecond: 1_000,
              apiTokens: {
                [ADMIN_TOKEN]: {
                  id: 'audit-admin',
                  type: 'human',
                  roles: ['administrator'],
                  scopes: ['*']
                },
                [MACHINE_TOKEN]: {
                  id: 'agent.audit-read',
                  type: 'agent',
                  sponsor: 'audit-admin',
                  roles: ['researcher'],
                  scopes: ['intent:execute'],
                  lifetime: 'session',
                  expires_at: '2099-01-01T00:00:00.000Z',
                  runtime: {
                    id: 'runtime.audit-read',
                    kind: 'local-process',
                    software_digest: 'd'.repeat(64)
                  },
                  constraints: {
                    actions: ['system.echo'],
                    purposes: ['test.conformance'],
                    destinations: ['local'],
                    budgets: {
                      max_requests_per_minute: 60,
                      max_concurrent_requests: 2,
                      max_execution_ms: 2_000,
                      max_request_bytes: 65_536,
                      max_response_bytes: 262_144
                    },
                    delegation: { allowed: false, max_depth: 0 }
                  }
                }
              }
            });
            const gateway = `http://127.0.0.1:${basePort}`;
            const client = token => createGatewayClient({
              token,
              request: (path, options) => fetch(`${gateway}${path}`, options)
            });
            const machine = client(MACHINE_TOKEN);
            const admin = client(ADMIN_TOKEN);

            for (const routeId of ['capsules.list', 'proposals.list', 'nodes.list']) {
              await assert.rejects(
                () => machine.call(routeId),
                error => error.code === 'forbidden' && error.status === 403
              );
              const result = await admin.call(routeId, { query: { limit: 1 } });
              assert.ok(Array.isArray(result[routeId.split('.')[0]]));
            }

            await assert.rejects(
              () => admin.call('events.list', { query: { after: 'abc' } }),
              error => error.code === 'validation_error' && error.status === 400
            );
            await assert.rejects(
              () => admin.call('events.list', { query: { after: '-1' } }),
              error => error.code === 'validation_error' && error.status === 400
            );
            await assert.rejects(
              () => admin.call('capsules.list', { query: { limit: 101 } }),
              error => error.code === 'validation_error' && error.status === 400
            );
          });
