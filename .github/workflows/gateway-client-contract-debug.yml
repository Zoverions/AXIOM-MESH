name: Gateway Client Contract Debug

on:
  push:
    branches:
      - feat/sovereign-context-plane

permissions:
  contents: read

jobs:
  gateway-client-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact source setup
        run: npm run setup:install
      - name: Run each Gateway client contract test with a process ceiling
        shell: bash
        run: |
          set +e
          patterns=(
            "current Gateway client contract is exact"
            "Gateway client emits only contract-owned relative requests"
            "Gateway client invokes browser fetch without an object receiver"
            "Gateway client binds intent schema and idempotency"
            "Gateway client encodes exact path and query inventories"
            "Gateway client preserves explicit errors"
            "Gateway client supports external cancellation"
            "Gateway client contract rejects authority and implementation drift"
            "Gateway client contract is compatible with the real four-service path"
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            echo "=== CASE: $pattern ==="
            timeout 20s node --test --test-reporter=spec --test-name-pattern="$pattern" mesh/test/gateway-client-contract.test.mjs
            status=$?
            echo "=== STATUS: $status ==="
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
