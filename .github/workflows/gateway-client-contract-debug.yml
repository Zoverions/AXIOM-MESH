name: Gateway Client Contract Debug

on:
  push:
    branches:
      - feat/sovereign-context-plane

permissions:
  contents: read

jobs:
  gateway-client-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact source setup
        run: npm run setup:install
      - name: Run isolated Gateway client contract tests
        run: node --test --test-reporter=spec mesh/test/gateway-client-contract.test.mjs
