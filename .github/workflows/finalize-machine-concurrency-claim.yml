name: Finalize Machine Concurrency Claim Sync

on:
  push:
    branches:
      - docs/machine-concurrency-claim-sync-2026-08-09
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/machine-concurrency-claim-sync-2026-08-09' || github.ref == 'refs/heads/docs/machine-concurrency-claim-sync-2026-08-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/machine-concurrency-claim-sync-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Synchronize concurrency claim, evidence, threat model, and generated status
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';

          async function replaceExact(path, oldText, newText) {
            const content = await readFile(path, 'utf8');
            if (!content.includes(oldText)) {
              throw new Error(`Expected text not found in ${path}: ${oldText.slice(0, 100)}`);
            }
            const next = content.replace(oldText, newText);
            if (next === content) throw new Error(`Text did not change in ${path}`);
            await writeFile(path, next);
          }

          const capabilityPath = 'mesh/config/capabilities.json';
          const registry = JSON.parse(await readFile(capabilityPath, 'utf8'));
          const machine = registry.capabilities.find(item => item.id === 'core.machine-principals');
          if (!machine) throw new Error('core.machine-principals is missing');
          const oldSummary = 'Authenticated agent principals are human-sponsored and deny-dominantly bounded by finite scopes, action and purpose ceilings, runtime identity, expiry, non-delegation, an execution-time ceiling, and authenticated Gateway ingress ceilings for request size and request rate; infrastructure service principals remain backward-compatible unless they opt into the same constrained profile.';
          const newSummary = 'Authenticated agent principals are human-sponsored and deny-dominantly bounded by finite scopes, action and purpose ceilings, runtime identity, expiry, non-delegation, an execution-time ceiling, and authenticated Gateway ingress ceilings for request size, request rate, and concurrency; infrastructure service principals remain backward-compatible unless they opt into the same constrained profile.';
          if (machine.summary !== oldSummary) throw new Error('Unexpected machine-principal capability summary');
          machine.summary = newSummary;
          if (!machine.evidence.includes('mesh/test/machine-concurrency.test.mjs')) {
            machine.evidence.push('mesh/test/machine-concurrency.test.mjs');
          }
          await writeFile(capabilityPath, `${JSON.stringify(registry, null, 2)}\n`);

          process.argv[1] = './machine-concurrency-claim-sync.mjs';
          const { validateCapabilityRegistry } = await import('./mesh/src/check-registry.mjs');
          const registryResult = validateCapabilityRegistry(registry);
          const registryDigest = registryResult.digest;
          console.log(`registry_digest=${registryDigest}`);

          const bindingsPath = 'mesh/config/capability-evidence-bindings.json';
          const bindings = JSON.parse(await readFile(bindingsPath, 'utf8'));
          bindings.registry_digest = registryDigest;
          const machineBinding = bindings.bindings.find(item => item.capability_id === 'core.machine-principals');
          if (!machineBinding) throw new Error('core.machine-principals evidence binding is missing');
          const concurrencyAssertion = 'assert.equal(accepted.payload.invocation.limits.ingress.max_concurrent_requests, 1);';
          if (!machineBinding.assertions.includes(concurrencyAssertion)) {
            machineBinding.assertions.push(concurrencyAssertion);
          }
          await writeFile(bindingsPath, `${JSON.stringify(bindings, null, 2)}\n`);

          const e2ePath = 'mesh/test/machine-principal-e2e.test.mjs';
          await replaceExact(
            e2ePath,
            `    budgets: {\n      max_request_bytes: 1_024,\n      max_requests_per_minute: 2\n    }`,
            `    budgets: {\n      max_request_bytes: 1_024,\n      max_requests_per_minute: 3\n    }`
          );
          await replaceExact(
            e2ePath,
            `  assert.equal(\n    replay.evidence.machine_authority_digest,\n    result.evidence.machine_authority_digest\n  );\n\n  // The capability binding below proves both newly claimed ingress ceilings.`,
            `  assert.equal(\n    replay.evidence.machine_authority_digest,\n    result.evidence.machine_authority_digest\n  );\n\n  const events = await client.call('events.list', {\n    query: { after: 0, limit: 100 }\n  });\n  const accepted = events.events.find(event => (\n    event.kind === 'intent.accepted'\n    && event.subject === result.intent_id\n  ));\n  assert.ok(accepted);\n  assert.equal(accepted.payload.invocation.limits.ingress.max_concurrent_requests, 1);\n\n  // The capability binding below proves all three claimed ingress ceilings.`
          );

          await replaceExact(
            'README.md',
            `  execution-time ceiling, and authenticated Gateway request-size and request-rate ceilings;`,
            `  execution-time ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings;`
          );
          await replaceExact(
            'README.md',
            `Authenticated Gateway request-size and request-rate ceilings are enforced and evidenced. Its schema also reserves destination, concurrency, and response-size constraints, but those are not current live enforcement claims until their correct runtime paths and evidence are completed.`,
            `Authenticated Gateway request-size, request-rate, and concurrency ceilings are enforced and evidenced. Its schema also reserves destination and response-size constraints, but those are not current live enforcement claims until their correct runtime paths and evidence are completed.`
          );
          await replaceExact(
            'CONSTITUTION.md',
            `Gateway request-size and request-rate ceilings. Additional machine destination,\nconcurrency, and response-size limits must not be described as live enforcement`,
            `Gateway request-size, request-rate, and concurrency ceilings. Additional machine\ndestination and response-size limits must not be described as live enforcement`
          );
          await replaceExact(
            'docs/rebuild/REQUIREMENTS.md',
            `a current execution-time ceiling, and authenticated Gateway request-size and request-rate ceilings.`,
            `a current execution-time ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings.`
          );
          await replaceExact(
            'docs/rebuild/PRODUCT-DEFINITION.md',
            `execution-time ceiling, and authenticated Gateway request-size and request-rate\nceilings. The v1 schema also reserves destination, concurrency, and response-size\nlimits, but those are not current live-enforcement claims until their correct`,
            `execution-time ceiling, and authenticated Gateway request-size, request-rate, and\nconcurrency ceilings. The v1 schema also reserves destination and response-size\nlimits, but those are not current live-enforcement claims until their correct`
          );
          await replaceExact(
            'docs/rebuild/PRODUCT-DEFINITION.md',
            `  ceiling, and authenticated Gateway request-size and request-rate ceilings;`,
            `  ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings;`
          );

          await replaceExact(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            `  authenticates bearer principals, validates request sizes and shapes,\n  rate-limits abuse, and forwards signed internal requests.`,
            `  authenticates bearer principals, validates request sizes and shapes,\n  rate-limits abuse, enforces constrained-machine request-size, request-rate,\n  and concurrency ceilings, and forwards signed internal requests.`
          );
          await replaceExact(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            `currently enforced execution-time ceiling. Wildcard scope and administrator\nrole are rejected.`,
            `currently enforced execution-time ceiling and authenticated Gateway request-size,\nrequest-rate, and concurrency ceilings. Wildcard scope and administrator role\nare rejected.`
          );
          await replaceExact(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            `The v1 machine schema also contains destination, request-rate, concurrency,\nrequest-size, and response-size fields. Those fields are validated as schema\ninputs but are **not** current live-enforcement claims until their Gateway and\nruntime enforcement paths and evidence are implemented.`,
            `The v1 machine schema also contains destination and response-size fields. Those\nfields are validated as schema inputs but are **not** current live-enforcement\nclaims until their correct effect/response enforcement paths and evidence are\nimplemented.`
          );
          await replaceExact(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            `| Machine action or purpose escalation | Ordinary policy is evaluated first and machine action/purpose ceilings form a second deny-dominant layer; machine constraints can only reduce authority | Destination/rate/concurrency/request-size/response-size schema fields are not yet live machine-specific enforcement claims |`,
            `| Machine action or purpose escalation | Ordinary policy is evaluated first and machine action/purpose ceilings form a second deny-dominant layer; machine constraints can only reduce authority | Destination and response-size schema fields are not yet live machine-specific enforcement claims |`
          );
          await replaceExact(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            `- oversized bodies, rate pressure, dependency suspension/loss, partial\n  startup, stale readiness, and restart races;`,
            `- oversized bodies, rate pressure, constrained-machine concurrency pressure,\n  dependency suspension/loss, partial startup, stale readiness, and restart\n  races;`
          );

          await replaceExact(
            'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
            `Execution time, authenticated Gateway request size, and authenticated Gateway request rate are live; response size and concurrency remain schema-only machine fields, while storage/bandwidth/cost profiles remain future work.`,
            `Execution time, authenticated Gateway request size, authenticated Gateway request rate, and authenticated Gateway concurrency are live; response size remains schema-only, while storage/bandwidth/cost profiles remain future work.`
          );
          await replaceExact(
            'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
            `authenticated Gateway request size, and authenticated Gateway request rate. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, destination-effect enforcement, machine-specific concurrency/response-size enforcement, or hardware/runtime attestation.`,
            `authenticated Gateway request size, authenticated Gateway request rate, and authenticated Gateway concurrency. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, destination-effect enforcement, machine-specific response-size enforcement, or hardware/runtime attestation.`
          );

          await rm('.github/workflows/finalize-machine-concurrency-claim.yml');
          NODE
          node mesh/src/status.mjs --write
      - name: Commit synchronized claim set
        run: |
          git config user.name "axiom-claim-sync"
          git config user.email "axiom-claim-sync@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize machine concurrency claim synchronization"
          git push origin HEAD:docs/machine-concurrency-claim-sync-2026-08-09
