name: TypeSafe System One B1 Verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/src/lib/bounded-decision-routing.mjs"
      - "mesh/src/lib/bounded-decision-typesafe-system-one-adapter.mjs"
      - "mesh/test/bounded-decision-provider-profile.test.mjs"
      - "mesh/test/bounded-decision-routing.test.mjs"
      - "mesh/test/bounded-decision-typesafe-system-one-adapter.test.mjs"
      - ".github/workflows/system-one-typesafe-b1-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify combined Bounded Decision routing and TypeSafe adapter chain
        run: |
          node --test --test-reporter=spec \
            mesh/test/bounded-decision-provider-profile.test.mjs \
            mesh/test/bounded-decision-routing.test.mjs \
            mesh/test/bounded-decision-typesafe-system-one-adapter.test.mjs
