name: Replay Inline Schema Registration

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-inline-schema-register.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/replay-grounded-self-improvement
          fetch-depth: 0
          persist-credentials: true
      - name: Register exact replay schema paths and claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mesh/src/check-docs.mjs')
          text = path.read_text(encoding='utf-8')

          anchor = "  'docs/architecture/contracts/capability-surfaces.v0.schema.json',\n"
          addition = (
              anchor
              + "  'docs/architecture/contracts/discovery-trace.v0.schema.json',\n"
              + "  'docs/architecture/contracts/replay-world.v0.schema.json',\n"
              + "  'docs/architecture/contracts/exploration-policy.v0.schema.json',\n"
              + "  'docs/architecture/contracts/replay-objective.v0.schema.json',\n"
              + "  'docs/architecture/contracts/replay-world-pool.v0.schema.json',\n"
              + "  'docs/architecture/contracts/replay-policy-evaluation.v0.schema.json',\n"
          )
          if anchor not in text:
              raise SystemExit('canonical schema anchor missing')
          if 'docs/architecture/contracts/discovery-trace.v0.schema.json' not in text:
              text = text.replace(anchor, addition, 1)

          required_anchor = "const REQUIRED_CONTENT = Object.freeze({\n"
          required_entries = """const REQUIRED_CONTENT = Object.freeze({
  'docs/architecture/contracts/discovery-trace.v0.schema.json': [
    'axiom-discovery-trace.v0',
    '\"authority_effect\": { \"const\": \"none\" }',
    '\"network_effect\": { \"const\": \"none\" }',
    '\"external_effects\": { \"const\": 0 }'
  ],
  'docs/architecture/contracts/replay-world.v0.schema.json': [
    'axiom-replay-world.v0',
    'after-parent-revealed',
    'record-and-stop',
    '\"runtime_activation\": { \"const\": false }'
  ],
  'docs/architecture/contracts/exploration-policy.v0.schema.json': [
    'axiom-exploration-policy.v0',
    'not-executed-by-replay-core',
    '\"authority_effect\": { \"const\": \"none\" }'
  ],
  'docs/architecture/contracts/replay-objective.v0.schema.json': [
    'axiom-replay-objective.v0',
    '\"comparison_mode\": { \"const\": \"lexicographic\" }',
    '\"max_external_effects\": { \"const\": 0 }'
  ],
  'docs/architecture/contracts/replay-world-pool.v0.schema.json': [
    'axiom-replay-world-pool.v0',
    'sealed-holdout',
    'acceptance-sealed',
    '\"production_promotion\": { \"const\": false }'
  ],
  'docs/architecture/contracts/replay-policy-evaluation.v0.schema.json': [
    'axiom-replay-policy-evaluation.v0',
    'fixed-replay-pool-and-objective-only',
    'live-world-monotonic-improvement',
    '\"authority_effect\": { \"const\": \"none\" }'
  ],
"""
          if required_anchor not in text:
              raise SystemExit('required content anchor missing')
          if "'docs/architecture/contracts/discovery-trace.v0.schema.json': [" not in text:
              text = text.replace(required_anchor, required_entries, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesh/src/check-docs.mjs
          git commit -m "docs: register replay core schema mirrors"
          git push origin HEAD:design/replay-grounded-self-improvement
