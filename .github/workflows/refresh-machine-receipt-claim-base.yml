name: Refresh machine receipt claim base

on:
  push:
    branches:
      - "docs/machine-receipt-claim-sync-2026-08-10"
    paths:
      - ".github/machine-receipt-base-refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/machine-receipt-claim-sync-2026-08-10
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rewriting claim history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit --no-ff origin/main
          git push origin HEAD:docs/machine-receipt-claim-sync-2026-08-10
