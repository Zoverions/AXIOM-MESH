name: Fix emergency overlay test window

on:
  push:
    branches:
      - "test/emergency-overlay-expiry-stability-2026-08-10"
    paths:
      - ".github/emergency-overlay-test-window-trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/emergency-overlay-expiry-stability-2026-08-10
          persist-credentials: true
      - name: Widen only the test timing window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('mesh/test/kernel.test.mjs')
          text = p.read_text()
          edits = [
              ('const emergencyExpiresAt = new Date(Date.now() + 800).toISOString();',
               'const emergencyExpiresAt = new Date(Date.now() + 5_000).toISOString();'),
              ('review_by: new Date(Date.now() + 2_000).toISOString(),',
               'review_by: new Date(Date.now() + 10_000).toISOString(),'),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one test timing fixture: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "mesh/test/kernel.test.mjs"
      - name: Commit timing-only test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mesh/test/kernel.test.mjs
          git commit -m 'test: stabilize emergency overlay expiry window'
          git push origin HEAD:test/emergency-overlay-expiry-stability-2026-08-10
