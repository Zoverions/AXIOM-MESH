name: Bounded Decision TDD

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bounded-decision-tdd.yml'
      - 'mesh/src/lib/bounded-decision-*.mjs'
      - 'mesh/config/bounded-decision-*.schema.json'
      - 'mesh/test/bounded-decision-*.test.mjs'

permissions:
  contents: read

jobs:
  slice-a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Run bounded decision Slice A tests
        working-directory: mesh
        run: node --test test/bounded-decision-*.test.mjs
