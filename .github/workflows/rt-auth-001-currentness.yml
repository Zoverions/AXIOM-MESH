name: RT-AUTH-001 Currentness Regression

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/src/lib/agent-trust-currentness-checkpoint.mjs"
      - "mesh/src/lib/machine-authority-currentness-checkpoint.mjs"
      - "mesh/src/lib/machine-effect-currentness-admission.mjs"
      - "mesh/test/machine-authority-currentness-checkpoint.test.mjs"
      - "mesh/test/machine-effect-currentness-admission.test.mjs"
      - ".github/workflows/rt-auth-001-currentness.yml"

permissions:
  contents: read

concurrency:
  group: rt-auth-001-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-currentness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run focused authority-currentness regressions
        run: >-
          node --test
          mesh/test/machine-authority-currentness-checkpoint.test.mjs
          mesh/test/machine-effect-currentness-admission.test.mjs
