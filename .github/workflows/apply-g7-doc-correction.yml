name: Apply G7 documentation correction

on:
  push:
    branches:
      - "security/audit-hardening-g5-g9-2026-08-10"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-hardening-g5-g9-2026-08-10
      - name: Correct G7 documentation boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          threat = Path('docs/security/CURRENT-BUILD-THREAT-MODEL.md')
          text = threat.read_text()
          old = """The compact candidate container uses `network_mode: none`. Signed deny-egress
evidence binds the observed `/proc/self/ns/net` namespace identity by digest and
derives the Compose `network_mode: none` requirement from the actual production
Compose policy; both are required provenance-bearing checks. Host-local Gateway
ingress is mounted separately, and startup fails before launching children if
"""
          new = """The compact candidate container uses `network_mode: none`. Signed deny-egress
runtime evidence binds the observed `/proc/self/ns/net` namespace identity by
digest. The static `network_mode: none` requirement is intentionally not asserted
inside runtime evidence: release/deployment verification reads the actual production
Compose policy, requires that setting, and binds the Compose digest before the
protected container job launches it. Host-local Gateway ingress is mounted
separately, and startup fails before launching children if
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('threat-model G7 anchor missing')
              text = text.replace(old, new, 1)
          threat.write_text(text)

          audit = Path('docs/audits/AUDIT-HARDENING-G5-G9-2026-08-10.md')
          text = audit.read_text()
          anchor = "## Documentation and maintenance clarifications\n"
          section = """## G-7 resolution boundary

Review of the candidate image found that `compose.production.yml` is not present
inside the runtime container. The first hardening draft therefore would have
turned a source-policy fact into an impossible runtime read. That draft was not
accepted. The final design measures `/proc/self/ns/net` in the runtime evidence
and removes `compose_network_mode_none_required` from that evidence entirely.
The actual Compose requirement remains enforced by the release/deployment
verifier, which has access to the checked-out Compose source and binds its
digest. Tests reject both a forged namespace binding and reintroduction of the
old static Compose boolean into runtime evidence.

"""
          if section not in text:
              if anchor not in text:
                  raise SystemExit('audit G7 anchor missing')
              text = text.replace(anchor, section + anchor, 1)
          audit.write_text(text)
          PY

          rm -f .github/g7-doc-correction-trigger
          if git diff --quiet; then
            echo 'G7 documentation correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/security/CURRENT-BUILD-THREAT-MODEL.md \
            docs/audits/AUDIT-HARDENING-G5-G9-2026-08-10.md \
            .github/g7-doc-correction-trigger
          git commit -m 'docs: correct G7 runtime and deployment evidence boundary'
          git push origin HEAD:security/audit-hardening-g5-g9-2026-08-10
