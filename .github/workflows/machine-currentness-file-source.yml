name: Machine Currentness Process-Safe File Source

on:
  pull_request:
    branches: ["security/machine-currentness-effect-barrier"]
    paths:
      - "mesh/src/lib/machine-principal-currentness-store.mjs"
      - "mesh/src/lib/machine-principal-currentness-file-source.mjs"
      - "mesh/src/sandbox/server.mjs"
      - "mesh/test/machine-principal-currentness-file-source.test.mjs"
      - "mesh/test/rt-auth-001-machine-currentness-file-source-race.test.mjs"
      - ".github/workflows/machine-currentness-file-source.yml"

permissions:
  contents: read

concurrency:
  group: machine-currentness-file-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-file-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run process-safe currentness source regressions
        run: >-
          node --test
          mesh/test/machine-principal-currentness-file-source.test.mjs
          mesh/test/rt-auth-001-machine-currentness-file-source-race.test.mjs
          mesh/test/rt-auth-001-machine-currentness-effect-barrier.test.mjs
