name: Context Final Check Debug

on:
  push:
    branches:
      - feat/sovereign-context-plane

permissions:
  contents: read

jobs:
  check-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact source setup
        run: npm run setup:install
      - name: Setup checker
        run: npm --prefix mesh run setup:check
      - name: Service-network checker
        run: node mesh/src/check-service-network-policy.mjs
      - name: Gateway-client checker
        run: node mesh/src/check-gateway-client-contract.mjs
      - name: AXIOM One checker
        run: node mesh/src/check-axiom-one.mjs
      - name: Capability-registry checker
        run: node mesh/src/check-registry.mjs
      - name: Generated status checker
        run: node mesh/src/status.mjs
      - name: Documentation checker
        run: node mesh/src/check-docs.mjs
      - name: Node test suite
        run: node --test --test-reporter=spec mesh/test
