name: Apply G5-G9 documentation hardening

on:
  push:
    branches:
      - "security/audit-hardening-g5-g9-2026-08-10"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-hardening-g5-g9-2026-08-10
      - name: Apply reviewability and maintenance hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))
              return True

          def prepend_once(path, marker, prefix):
              p = Path(path)
              text = p.read_text()
              if marker in text[:1200]:
                  return False
              p.write_text(prefix + text)
              return True

          prepend_once(
              'mesh/src/_network-boundary-core.mjs',
              'RETAINED LOWER LAYER',
              """// RETAINED LOWER LAYER: this file provides route parsing/probe primitives and the\n// pre-provenance drill retained for compatibility and historical comparison. The supported\n// deny-egress evidence entry point is network-boundary.mjs -> _network-boundary-signed.mjs\n// -> _network-boundary-provenance.mjs. Do not audit runDenyEgressDrill in this file as the\n// current assurance surface in isolation.\n\n"""
          )
          prepend_once(
              'mesh/src/grid/_store-core.mjs',
              'RETAINED LOWER LAYER',
              """// RETAINED LOWER LAYER: this file contains the baseline GridStore implementation.\n// The supported GridStore exported by store.mjs subclasses this layer with signed checkpoint\n// and streaming chain verification. The baseline verifyChain remains intentionally reachable\n// only for compatibility/tests and benchmark comparison; it is not the current production\n// verification path when store.mjs is used.\n\n"""
          )

          replace_once(
              'CONTRIBUTING.md',
              "5. Update every affected canonical document, including product definition,\n   requirements, status, roadmap, execution queue, readiness tracker, release\n   notes, white paper, threat model, and operator/user runbook as applicable.\n6. Add or update rollback, uninstall, migration, recovery, and decommissioning\n",
              "5. Update every affected canonical document, including product definition,\n   requirements, status, roadmap, execution queue, readiness tracker, release\n   notes, white paper, threat model, and operator/user runbook as applicable.\n6. For every defect or security fix, search the supported tree for equivalent\n   patterns and either backfill the fix everywhere it applies or record why a\n   matching site is intentionally different; add regression coverage for the\n   class, not only the first instance.\n7. Add or update rollback, uninstall, migration, recovery, and decommissioning\n"
          )
          # Renumber the two trailing requirements after the inserted backfill rule.
          replace_once(
              'CONTRIBUTING.md',
              "7. Never commit private keys, tokens, data-protection keys, production data,\n   plaintext user data, or evidence containing secret values.\n8. Target lowercase `main`; do not target the deprecated branch or immutable\n",
              "8. Never commit private keys, tokens, data-protection keys, production data,\n   plaintext user data, or evidence containing secret values.\n9. Target lowercase `main`; do not target the deprecated branch or immutable\n"
          )

          replace_once(
              'docs/rebuild/PRODUCT-DEFINITION.md',
              "3. **Sandbox** — executes only the action, provider, destination, data, and\n   resources named by a valid grant; it has no ambient network, filesystem,\n   secret, package, or host authority.\n",
              "3. **Sandbox** — a deterministic capability executor for the fixed built-in\n   operation set. It executes only the action, provider, destination, data, and\n   resources named by a valid grant and has no ambient network, filesystem,\n   secret, package, or host authority. It is **not** a general-purpose arbitrary-\n   code isolation sandbox; that remains an explicit non-claim.\n"
          )

          replace_once(
              'docs/security/DENY-EGRESS-BOUNDARY.md',
              "6. Grid signs a secret-free evidence object. Protected CI retains\n   `axiom-deny-egress-evidence-<commit>` for 90 days.\n\nThe evidence records only the source revision, kernel version, route counts,\nabsence of default and non-loopback routes, successful runner and Unix-socket\ncontrol flags, public-probe outcome class, loopback status, local-ingress\ntransport class, public Grid key, and Ed25519 attestation. The protected\nworkflow passes the two control flags only after their steps succeed. The\nartifact contains no tokens, private keys, route addresses, host paths, or\nrequest payloads.\n",
              "6. The drill also reads `/proc/self/ns/net` and binds its namespace identity\n   by digest, then derives the required `network_mode: \"none\"` fact from the\n   actual `compose.production.yml` text and binds that policy digest. Both facts\n   are members of the same required-check/provenance inventory as the route and\n   probe checks rather than literal booleans outside assurance accounting.\n7. Grid signs a secret-free evidence object. Protected CI retains\n   `axiom-deny-egress-evidence-<commit>` for 90 days.\n\nThe evidence records only the source revision, kernel version, route counts,\nabsence of default and non-loopback routes, namespace and Compose-policy\ndigests, successful runner and Unix-socket control measurements, public-probe\noutcome class, loopback status, local-ingress transport class, public Grid key,\nand Ed25519 attestation. After signed observer substitution, every required\ncheck has measured or derived provenance and `asserted_checks` is empty. The\nartifact contains no tokens, private keys, route addresses, host paths, or\nrequest payloads.\n"
          )

          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "allowlist. Wildcard scope and administrator role\nare rejected. The machine authority digest is carried through request\n",
              "allowlist. Wildcard or glob scope syntax and administrator role\nare rejected; machine scopes therefore use the same exact-match grammar as the\nauthorization evaluator. The machine authority digest is carried through request\n"
          )
          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "The compact candidate container uses `network_mode: none`. Host-local Gateway\ningress is mounted separately, and startup fails before launching children if\n",
              "The compact candidate container uses `network_mode: none`. Signed deny-egress\nevidence binds the observed `/proc/self/ns/net` namespace identity by digest and\nderives the Compose `network_mode: none` requirement from the actual production\nCompose policy; both are required provenance-bearing checks. Host-local Gateway\ningress is mounted separately, and startup fails before launching children if\n"
          )

          # Make the new audit note canonical and make the backfill/Sandbox clarifications load-bearing.
          p = Path('mesh/src/check-docs.mjs')
          text = p.read_text()
          audit_entry = "  'docs/audits/AUDIT-HARDENING-G5-G9-2026-08-10.md',\n"
          anchor = "  'docs/audits/SCALABILITY-AUDIT-2026-07-30.md',\n"
          if audit_entry not in text:
              if anchor not in text:
                  raise SystemExit('canonical audit anchor missing')
              text = text.replace(anchor, anchor + audit_entry, 1)
          old = "  'CONTRIBUTING.md': ['npm run setup', 'npm run setup:check'],\n"
          new = "  'CONTRIBUTING.md': [\n    'npm run setup',\n    'npm run setup:check',\n    'search the supported tree for equivalent',\n    'regression coverage for the class'\n  ],\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('CONTRIBUTING required-content anchor missing')
              text = text.replace(old, new, 1)
          product_anchor = "  'docs/rebuild/PRODUCT-DEFINITION.md': [\n"
          if product_anchor in text and "general-purpose arbitrary-code isolation sandbox" not in text:
              text = text.replace(
                  product_anchor,
                  product_anchor + "    'general-purpose arbitrary-code isolation sandbox',\n",
                  1
              )
          p.write_text(text)
          PY

          if git diff --quiet; then
            echo 'Documentation hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mesh/src/_network-boundary-core.mjs mesh/src/grid/_store-core.mjs \
            CONTRIBUTING.md docs/rebuild/PRODUCT-DEFINITION.md \
            docs/security/DENY-EGRESS-BOUNDARY.md docs/security/CURRENT-BUILD-THREAT-MODEL.md \
            mesh/src/check-docs.mjs
          git commit -m 'docs: backfill G5-G9 hardening across supported tree'
          git push origin HEAD:security/audit-hardening-g5-g9-2026-08-10
