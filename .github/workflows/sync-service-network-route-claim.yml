name: Sync service network route claim

on:
  push:
    branches:
      - "docs/service-network-route-claim-sync-2026-08-10"
    paths:
      - ".github/service-network-route-claim-trigger"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/service-network-route-claim-sync-2026-08-10
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Synchronize registry summary and derived evidence digest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { digestObject } from './mesh/src/lib/canonical.mjs';
          const capabilitiesPath = 'mesh/config/capabilities.json';
          const bindingsPath = 'mesh/config/capability-evidence-bindings.json';
          const registry = JSON.parse(fs.readFileSync(capabilitiesPath, 'utf8'));
          const capability = registry.capabilities.find(item => item.id === 'operations.service-network-policy');
          if (!capability) throw new Error('operations.service-network-policy missing');
          const old = 'permits only 39 exact internal caller, destination, method, and route combinations';
          const next = 'permits only 40 exact internal caller, destination, method, and route combinations';
          if (!capability.summary.includes(old)) throw new Error('Expected stale 39-route registry summary');
          capability.summary = capability.summary.replace(old, next);
          fs.writeFileSync(capabilitiesPath, `${JSON.stringify(registry, null, 2)}\n`);
          const digest = digestObject(registry);
          const bindings = JSON.parse(fs.readFileSync(bindingsPath, 'utf8'));
          bindings.registry_digest = digest;
          fs.writeFileSync(bindingsPath, `${JSON.stringify(bindings, null, 2)}\n`);
          console.log(`registry_digest=${digest}`);
          NODE
          node mesh/src/status.mjs --write
          (cd mesh && npm run check-registry)
          node mesh/src/status.mjs
          node mesh/src/check-docs.mjs
          git diff --check
      - name: Commit claim synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mesh/config/capabilities.json mesh/config/capability-evidence-bindings.json docs/rebuild/STATUS.md README.md CONSTITUTION.md docs/rebuild/PRODUCT-DEFINITION.md docs/rebuild/REQUIREMENTS.md
          git commit -m 'docs: sync 40-route service-network claim'
          git push origin HEAD:docs/service-network-route-claim-sync-2026-08-10
