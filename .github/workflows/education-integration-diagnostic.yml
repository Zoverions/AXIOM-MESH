name: Education Integration Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mesh/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/education-integration-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          check-latest: false
      - name: Install exact source setup
        run: npm run setup:install
      - name: Capture clean-kernel output
        id: check
        shell: bash
        run: |
          set +e
          npm run check > education-integration-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: education-integration-diagnostic
          path: education-integration-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve check result
        if: always()
        shell: bash
        run: |
          test "${{ steps.check.outputs.exit_code }}" = "0"
