name: Education Integration Diagnostic

on:
  push:
    branches:
      - integration/education-learner-record-current-main-20260812

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          check-latest: false
      - name: Apply diagnostic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          replace_once(
              'mesh/src/release.mjs',
              "'40 exact caller/destination/method/route'",
              "'41 exact caller/destination/method/route'",
          )
          replace_once(
              'mesh/test/education-native-append-conformance.test.mjs',
              "['submission.created', 'assignment.created']",
              "['assignment.created', 'submission.created']",
          )
          replace_once(
              'mesh/test/production-host.test.mjs',
              """  const randomWithFallback = fallback => {\n    let first = true;\n    return () => {\n      if (!first) return fallback;\n      first = false;\n      return firstSample;\n    };\n  };""",
              """  const randomWithFallback = fallback => {\n    let attempt = 0;\n    return () => {\n      attempt += 1;\n      if (attempt === 1) return firstSample;\n      return (fallback + (attempt - 2) * 0.071) % 1;\n    };\n  };""",
          )
          replace_once(
              'mesh/test/production-host.test.mjs',
              """  const initialBase = basePortForSample(firstSample);\n  const initialLease = [first, second].find(\n    lease => lease.base_port === initialBase\n  );\n  assert.ok(initialLease);\n  await initialLease.release();\n  await initialLease.release();\n  const replacement = await reserveProductionPortBlock('replacement drill', {\n    lockRoot,\n    random: () => firstSample\n  });\n  leases.push(replacement);\n  assert.equal(replacement.base_port, initialBase);""",
              """  const reusableLease = first;\n  const reusableSample = (\n    ((reusableLease.base_port - 20_000) / 4 + 0.5) / 5_000\n  );\n  await reusableLease.release();\n  await reusableLease.release();\n  const replacement = await reserveProductionPortBlock('replacement drill', {\n    lockRoot,\n    random: () => reusableSample\n  });\n  leases.push(replacement);\n  assert.equal(replacement.base_port, reusableLease.base_port);""",
          )
          PY
          git rm .github/workflows/education-integration-diagnostic.yml
      - name: Install exact source setup
        run: npm run setup:install
      - name: Verify corrected clean kernel
        run: npm run check
      - name: Commit verified fixes and remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "Zoverions"
          git config user.email "208527039+Zoverions@users.noreply.github.com"
          git add -A
          git commit -m "Fix learner read ordering and integration verification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
