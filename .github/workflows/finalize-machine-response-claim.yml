name: Finalize Machine Response Claim Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/machine-response-size-claim-sync-2026-08-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/machine-response-size-claim-sync-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Synchronize response-size claim and evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';

          async function replaceOnce(path, oldText, newText) {
            const content = await readFile(path, 'utf8');
            const first = content.indexOf(oldText);
            const last = content.lastIndexOf(oldText);
            if (first < 0 || first !== last) {
              throw new Error(`Expected exactly one match in ${path}: ${oldText.slice(0, 120)}`);
            }
            await writeFile(path, content.slice(0, first) + newText + content.slice(first + oldText.length));
          }

          const capabilityPath = 'mesh/config/capabilities.json';
          const registry = JSON.parse(await readFile(capabilityPath, 'utf8'));
          const machine = registry.capabilities.find(item => item.id === 'core.machine-principals');
          if (!machine) throw new Error('core.machine-principals is missing');
          const oldSummary = 'Authenticated agent principals are human-sponsored and deny-dominantly bounded by finite scopes, action and purpose ceilings, runtime identity, expiry, non-delegation, an execution-time ceiling, and authenticated Gateway ingress ceilings for request size, request rate, and concurrency; infrastructure service principals remain backward-compatible unless they opt into the same constrained profile.';
          const newSummary = 'Authenticated agent principals are human-sponsored and deny-dominantly bounded by finite scopes, action and purpose ceilings, runtime identity, expiry, non-delegation, an execution-time ceiling, and authenticated Gateway ingress ceilings for request size, request rate, concurrency, and response size; infrastructure service principals remain backward-compatible unless they opt into the same constrained profile.';
          if (machine.summary !== oldSummary) throw new Error('Unexpected machine-principal capability summary');
          machine.summary = newSummary;
          if (!machine.evidence.includes('mesh/test/machine-response-size.test.mjs')) {
            machine.evidence.push('mesh/test/machine-response-size.test.mjs');
          }
          await writeFile(capabilityPath, `${JSON.stringify(registry, null, 2)}\n`);

          process.argv[1] = './machine-response-claim-sync.mjs';
          const { validateCapabilityRegistry } = await import('./mesh/src/check-registry.mjs');
          const registryDigest = validateCapabilityRegistry(registry).digest;
          console.log(`registry_digest=${registryDigest}`);

          const bindingsPath = 'mesh/config/capability-evidence-bindings.json';
          const bindings = JSON.parse(await readFile(bindingsPath, 'utf8'));
          bindings.registry_digest = registryDigest;
          const binding = bindings.bindings.find(item => item.capability_id === 'core.machine-principals');
          if (!binding) throw new Error('core.machine-principals evidence binding is missing');
          for (const assertion of [
            "assert.equal(accepted.payload.invocation.limits.ingress.max_response_bytes, 8_192);",
            "assert.equal(error.code, 'machine_response_budget_exceeded');"
          ]) {
            if (!binding.assertions.includes(assertion)) binding.assertions.push(assertion);
          }
          await writeFile(bindingsPath, `${JSON.stringify(bindings, null, 2)}\n`);

          await replaceOnce(
            'README.md',
            '  ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings;',
            '  ceiling, and authenticated Gateway request-size, request-rate, concurrency, and response-size ceilings;'
          );
          await replaceOnce(
            'README.md',
            'Authenticated Gateway request-size, request-rate, and\nconcurrency ceilings are enforced and evidenced. Its schema also reserves\ndestination and response-size constraints, but those are not current live\nenforcement claims until their correct runtime paths and evidence are completed.',
            'Authenticated Gateway request-size, request-rate, concurrency, and response-size\nceilings are enforced and evidenced. Its schema still reserves destination\nconstraints, but destination is not a current live enforcement claim until the\ncorrect effect/adapter path and evidence are completed.'
          );
          await replaceOnce(
            'CONSTITUTION.md',
            'Gateway request-size, request-rate, and concurrency ceilings. Additional machine\ndestination and response-size limits must not be described as live enforcement\nuntil their runtime paths and evidence exist.',
            'Gateway request-size, request-rate, concurrency, and response-size ceilings.\nMachine destination limits must not be described as live enforcement until the\ncorrect effect/adapter path and evidence exist.'
          );
          await replaceOnce(
            'docs/rebuild/REQUIREMENTS.md',
            'a current execution-time ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings.',
            'a current execution-time ceiling, and authenticated Gateway request-size, request-rate, concurrency, and response-size ceilings.'
          );
          await replaceOnce(
            'docs/rebuild/PRODUCT-DEFINITION.md',
            'execution-time ceiling, and authenticated Gateway request-size, request-rate, and\nconcurrency ceilings. The v1 schema also reserves destination and response-size\nlimits, but those are not current live-enforcement claims until their correct\nruntime paths and evidence exist.',
            'execution-time ceiling, and authenticated Gateway request-size, request-rate,\nconcurrency, and response-size ceilings. The v1 schema still reserves destination\nlimits, but destination is not a current live-enforcement claim until the correct\neffect/adapter path and evidence exist.'
          );
          await replaceOnce(
            'docs/rebuild/PRODUCT-DEFINITION.md',
            '  ceiling, and authenticated Gateway request-size, request-rate, and concurrency ceilings;',
            '  ceiling, and authenticated Gateway request-size, request-rate, concurrency, and response-size ceilings;'
          );

          await replaceOnce(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            '  rate-limits abuse, enforces constrained-machine request-size, request-rate,\n  and concurrency ceilings, and forwards signed internal requests.',
            '  rate-limits abuse, enforces constrained-machine request-size, request-rate,\n  concurrency, and response-size ceilings, and forwards signed internal requests.'
          );
          await replaceOnce(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            'currently enforced execution-time ceiling and authenticated Gateway request-size,\nrequest-rate, and concurrency ceilings.',
            'currently enforced execution-time ceiling and authenticated Gateway request-size,\nrequest-rate, concurrency, and response-size ceilings.'
          );
          await replaceOnce(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            'The v1 machine schema also contains destination and response-size fields. Those\nfields are validated as schema inputs but are **not** current live-enforcement\nclaims until their correct effect/response enforcement paths and evidence are\nimplemented.',
            'The v1 machine schema still contains a destination field. Destination is validated\nas a schema input but is **not** a current live-enforcement claim until the\ncorrect effect/adapter enforcement path and evidence are implemented.'
          );
          await replaceOnce(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            'Destination and response-size schema fields are not yet live machine-specific enforcement claims',
            'The destination schema field is not yet a live machine-specific enforcement claim'
          );
          await replaceOnce(
            'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
            '- oversized bodies, rate pressure, constrained-machine concurrency pressure,\n  dependency suspension/loss, partial startup, stale readiness, and restart\n  races;',
            '- oversized request/response bodies, rate pressure, constrained-machine\n  concurrency pressure, dependency suspension/loss, partial startup, stale\n  readiness, and restart races;'
          );

          await replaceOnce(
            'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
            'Execution time, authenticated Gateway request size, authenticated Gateway request rate, and authenticated Gateway concurrency are live; response size remains schema-only, while storage/bandwidth/cost profiles remain future work.',
            'Execution time, authenticated Gateway request size, authenticated Gateway request rate, authenticated Gateway concurrency, and authenticated Gateway response size are live; storage/bandwidth/cost profiles remain future work.'
          );
          await replaceOnce(
            'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
            'authenticated Gateway request size, authenticated Gateway request rate, and authenticated Gateway concurrency. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, destination-effect enforcement, machine-specific response-size enforcement, or hardware/runtime attestation.',
            'authenticated Gateway request size, authenticated Gateway request rate, authenticated Gateway concurrency, and authenticated Gateway response size. It does not claim autonomous agent loops, machine delegation, MCP/A2A, remote execution, destination-effect enforcement, or hardware/runtime attestation.'
          );

          await replaceOnce(
            'docs/PROJECT-STATUS-2026.md',
            '  purpose ceilings, runtime identity, expiry, non-delegation, and an enforced\n  execution-time ceiling; machine authority digests bind request approval,\n  plan provenance, capability claims, and returned evidence;',
            '  purpose ceilings, runtime identity, expiry, non-delegation, an enforced\n  execution-time ceiling, and authenticated Gateway request-size, request-rate,\n  concurrency, and response-size ceilings; machine authority digests bind\n  request approval, plan provenance, capability claims, and returned evidence;'
          );
          await replaceOnce(
            'docs/PROJECT-STATUS-2026.md',
            'The constrained machine-principal capability is an authorization primitive,\nnot an autonomous-agent runtime. The v1 schema reserves destination, rate,\nconcurrency, request-size, and response-size constraints, but those are not\ncurrent live-enforcement claims until their Gateway/runtime paths and evidence\nexist.',
            'The constrained machine-principal capability is an authorization primitive,\nnot an autonomous-agent runtime. Request size, request rate, concurrency, and\nresponse size are enforced at authenticated Gateway boundaries. The v1 schema\nstill reserves destination, but destination is not a live-enforcement claim\nuntil the correct effect/adapter path and evidence exist.'
          );

          await rm('.github/workflows/finalize-machine-response-claim.yml');
          NODE
          node mesh/src/status.mjs --write
      - name: Commit synchronized response-size claim set
        run: |
          git config user.name "axiom-claim-sync"
          git config user.email "axiom-claim-sync@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize machine response-size claim synchronization"
          git push origin HEAD:docs/machine-response-size-claim-sync-2026-08-09
