name: Windows Compatibility

on:
  push:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CONSTITUTION.md"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CONSTITUTION.md"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact lockfiles without lifecycle scripts
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm --prefix mesh ci --ignore-scripts
      - name: Verify Windows-compatible kernel surface
        shell: pwsh
        run: npm run check
