name: Windows Compatibility

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install exact lockfiles without lifecycle scripts
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm --prefix mesh ci --ignore-scripts
      - name: Verify Windows-compatible kernel surface
        shell: pwsh
        run: |
          npm run check -- -- --test-concurrency=1 *> windows-kernel-diagnostic.log
          $status = $LASTEXITCODE
          Get-Content windows-kernel-diagnostic.log
          exit $status
      - name: Upload Windows kernel diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-kernel-diagnostic
          path: windows-kernel-diagnostic.log
          if-no-files-found: error
          retention-days: 1

  verify-macos:
    name: verify-macos (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Record Apple runner architecture
        shell: bash
        run: |
          sw_vers
          uname -a
          node -p "JSON.stringify({platform: process.platform, arch: process.arch, node: process.version})"
      - name: Prepare short private Unix-socket temp root
        shell: bash
        run: |
          socket_tmp="/private/tmp/axiom-mesh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$socket_tmp"
          chmod 700 "$socket_tmp"
          echo "TMPDIR=$socket_tmp" >> "$GITHUB_ENV"
      - name: Install exact lockfiles without lifecycle scripts
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix mesh ci --ignore-scripts
      - name: Verify macOS-compatible kernel surface
        shell: bash
        run: npm run check
