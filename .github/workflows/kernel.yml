name: Clean Kernel

on:
  push:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONSTITUTION.md"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/kernel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONSTITUTION.md"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/kernel.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify root supply chain
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
      - name: Verify clean kernel
        working-directory: mesh
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm run check
          npm run release:verify
      - name: Verify deprecated credential inventory and supported trust
        working-directory: mesh
        env:
          AXIOM_CREDENTIAL_AUDIT_KEY: ${{ secrets.AXIOM_CREDENTIAL_AUDIT_KEY }}
        run: |
          npm run credential-history:audit \
            > "$RUNNER_TEMP/axiom-credential-history-audit-evidence.json"
      - name: Upload signed credential-history audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-credential-history-audit-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-credential-history-audit-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run disposable-host recovery drill
        working-directory: mesh
        run: |
          node src/recovery-drill.mjs \
            "$RUNNER_TEMP/axiom-recovery-drill" \
            > "$RUNNER_TEMP/axiom-recovery-drill-evidence.json"
      - name: Upload signed recovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-recovery-drill-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-recovery-drill-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run encrypted-backup lifecycle and restore drill
        working-directory: mesh
        run: |
          node src/backup-lifecycle-drill.mjs \
            "$RUNNER_TEMP/axiom-backup-lifecycle-drill" \
            > "$RUNNER_TEMP/axiom-backup-lifecycle-evidence.json"
      - name: Upload signed backup lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-backup-lifecycle-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-backup-lifecycle-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run controlled SLO and restart drill
        working-directory: mesh
        run: |
          node src/slo-drill.mjs \
            "$RUNNER_TEMP/axiom-slo-drill" \
            > "$RUNNER_TEMP/axiom-slo-baseline-evidence.json"
      - name: Upload signed SLO baseline evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-slo-baseline-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-slo-baseline-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run coordinated credential rotation drill
        working-directory: mesh
        run: |
          node src/credential-rotation-drill.mjs \
            "$RUNNER_TEMP/axiom-credential-rotation-drill" \
            > "$RUNNER_TEMP/axiom-credential-rotation-evidence.json"
      - name: Upload signed credential rotation evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-credential-rotation-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-credential-rotation-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run data-protection-key rotation drill
        working-directory: mesh
        run: |
          node src/data-key-rotation-drill.mjs \
            "$RUNNER_TEMP/axiom-data-key-rotation-drill" \
            > "$RUNNER_TEMP/axiom-data-key-rotation-evidence.json"
      - name: Upload signed data-key rotation evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-data-key-rotation-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-data-key-rotation-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Run coordinated incident tabletop
        working-directory: mesh
        run: |
          node src/incident-tabletop-drill.mjs \
            "$RUNNER_TEMP/axiom-incident-tabletop" \
            "$RUNNER_TEMP/axiom-recovery-drill-evidence.json" \
            "$RUNNER_TEMP/axiom-backup-lifecycle-evidence.json" \
            "$RUNNER_TEMP/axiom-slo-baseline-evidence.json" \
            "$RUNNER_TEMP/axiom-credential-rotation-evidence.json" \
            "$RUNNER_TEMP/axiom-data-key-rotation-evidence.json" \
            > "$RUNNER_TEMP/axiom-incident-tabletop-evidence.json"
      - name: Upload signed incident tabletop evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-incident-tabletop-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-incident-tabletop-evidence.json
          if-no-files-found: error
          retention-days: 90

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Provision ephemeral production credentials
        working-directory: mesh
        run: |
          node src/provision-production.mjs \
            "$RUNNER_TEMP/axiom-data" \
            "$RUNNER_TEMP/axiom-secrets"
          sudo chown -R 10001:10001 \
            "$RUNNER_TEMP/axiom-data"
          mkdir -p "$RUNNER_TEMP/axiom-ingress"
          sudo chown 10001:10001 \
            "$RUNNER_TEMP/axiom-ingress"
          sudo chown 10001:10001 \
            "$RUNNER_TEMP/axiom-secrets/data-protection.key" \
            "$RUNNER_TEMP/axiom-secrets/api-tokens.json"
          {
            echo "AXIOM_DATA_DIR_HOST=$RUNNER_TEMP/axiom-data"
            echo "AXIOM_GATEWAY_SOCKET_DIR_HOST=$RUNNER_TEMP/axiom-ingress"
            echo "AXIOM_DATA_KEY_FILE_HOST=$RUNNER_TEMP/axiom-secrets/data-protection.key"
            echo "AXIOM_API_TOKENS_FILE_HOST=$RUNNER_TEMP/axiom-secrets/api-tokens.json"
          } >> "$GITHUB_ENV"
      - name: Build digest-pinned image
        working-directory: mesh
        run: docker build --pull=false --tag axiom-mesh-kernel:0.11.0 .
      - name: Run container readiness drill
        working-directory: mesh
        run: |
          docker compose -f compose.production.yml up --detach --no-build
          for attempt in $(seq 1 30); do
            if sudo curl --fail --silent \
              --unix-socket "$RUNNER_TEMP/axiom-ingress/gateway.sock" \
              http://localhost/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.production.yml logs
              exit 1
            fi
            sleep 2
          done
          token="$(tr -d '\n' <"$RUNNER_TEMP/axiom-secrets/operator.token")"
          sudo curl --fail --silent \
            --unix-socket "$RUNNER_TEMP/axiom-ingress/gateway.sock" \
            -H "Authorization: Bearer $token" \
            http://localhost/v1/operations \
            > "$RUNNER_TEMP/operations.json"
          node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync(process.argv[1]));if(report.status!=='ready'||report.services.length!==4)process.exit(1)" \
            "$RUNNER_TEMP/operations.json"
          echo "AXIOM_HOST_INGRESS_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Prove public probe target is reachable from the runner
        run: |
          node -e "const net=require('node:net');const socket=net.createConnection({host:'1.1.1.1',port:443});const timer=setTimeout(()=>{socket.destroy();process.exit(1)},5000);socket.once('connect',()=>{clearTimeout(timer);socket.destroy()});socket.once('close',()=>process.exit(0));socket.once('error',()=>process.exit(1))"
          echo "AXIOM_RUNNER_PUBLIC_CONTROL_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Verify container deny-egress boundary
        working-directory: mesh
        run: |
          docker compose -f compose.production.yml exec -T \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e AXIOM_HOST_INGRESS_VERIFIED="$AXIOM_HOST_INGRESS_VERIFIED" \
            -e AXIOM_RUNNER_PUBLIC_CONTROL_VERIFIED="$AXIOM_RUNNER_PUBLIC_CONTROL_VERIFIED" \
            kernel node src/network-boundary.mjs \
            > "$RUNNER_TEMP/axiom-deny-egress-evidence.json"
      - name: Upload signed deny-egress evidence
        uses: actions/upload-artifact@v7
        with:
          name: axiom-deny-egress-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-deny-egress-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop container
        if: always()
        working-directory: mesh
        run: docker compose -f compose.production.yml down --volumes --remove-orphans
