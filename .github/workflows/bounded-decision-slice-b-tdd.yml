name: Bounded Decision Slice B TDD

on:
  pull_request:
    branches:
      - docs/system-one-bounded-decision-provider-20260915
    paths:
      - '.github/workflows/bounded-decision-slice-b-tdd.yml'
      - 'mesh/src/lib/bounded-decision-local-conformance-adapter.mjs'
      - 'mesh/test/bounded-decision-local-conformance-adapter.test.mjs'
      - 'docs/superpowers/specs/2026-09-15-bounded-decision-intelligence-v0-design.md'

permissions:
  contents: read

jobs:
  slice-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Run Slice B local conformance tests
        working-directory: mesh
        run: node --test test/bounded-decision-local-conformance-adapter.test.mjs
