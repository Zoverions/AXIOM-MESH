name: RT-AUTH-001 Machine Currentness Effect Barrier

on:
  pull_request:
    branches: ["security/machine-currentness-lifecycle-source"]
    paths:
      - "mesh/src/sandbox/server.mjs"
      - "mesh/src/dev.mjs"
      - "mesh/test/rt-auth-001-machine-currentness-effect-barrier.test.mjs"
      - ".github/workflows/rt-auth-001-machine-currentness-effect-barrier.yml"

permissions:
  contents: read

concurrency:
  group: rt-auth-001-machine-currentness-effect-barrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  barrier-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run RT-AUTH-001 consume-before-effect currentness races
        run: >-
          node --test
          mesh/test/rt-auth-001-machine-currentness-effect-barrier.test.mjs
          mesh/test/machine-currentness-lifecycle-source.test.mjs
          mesh/test/machine-effect-currentness-checkpoint-adapter.test.mjs
