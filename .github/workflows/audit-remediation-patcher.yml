name: Audit Remediation Patcher

on:
  push:
    branches:
      - audit-remediation-2026-08-30
    paths:
      - .github/workflows/audit-remediation-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit-remediation-2026-08-30
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Configure commit identity
        run: |
          git config user.name "axiom-audit-remediation"
          git config user.email "208527039+Zoverions@users.noreply.github.com"

      - name: Apply F-01 bounded live-chain verification
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact patch anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          checkpoint = 'mesh/src/grid/_store-checkpoints.mjs'
          replace_once(
              checkpoint,
              """    this.checkpointInterval = interval;\n    this.ensureChainCheckpoint({ minimumDistance: interval });\n""",
              """    this.checkpointInterval = interval;\n    this.liveChainVerificationCache = null;\n    this.liveChainTrustedGrowth = null;\n    this.ensureChainCheckpoint({ minimumDistance: interval });\n"""
          )
          replace_once(
              checkpoint,
              """  appendEvents(input) {\n    const appended = super.appendEvents(input);\n    this.ensureChainCheckpoint({ minimumDistance: this.checkpointInterval });\n    return appended;\n  }\n""",
              """  appendEvents(input) {\n    const before = this.readLiveChainMarker();\n    const cached = this.liveChainVerificationCache;\n    const previousGrowth = this.liveChainTrustedGrowth;\n    const trustedBase = Boolean(\n      cached\n      && (\n        sameLiveChainMarker(before, cached.marker)\n        || (\n          previousGrowth\n          && sameLiveChainMarker(previousGrowth.from, cached.marker)\n          && sameLiveChainMarker(before, previousGrowth.to)\n        )\n      )\n    );\n    const appended = super.appendEvents(input);\n    this.ensureChainCheckpoint({ minimumDistance: this.checkpointInterval });\n    const after = this.readLiveChainMarker();\n    this.liveChainTrustedGrowth = trustedBase\n      ? {\n          from: structuredClone(cached.marker),\n          to: structuredClone(after)\n        }\n      : null;\n    return appended;\n  }\n"""
          )
          replace_once(
              checkpoint,
              """  verifyChain({ mode = 'checkpoint' } = {}) {\n""",
              """  readLiveChainMarker() {\n    const seqRow = this.db.prepare(\"SELECT value FROM meta WHERE key = 'last_seq'\").get();\n    const hashRow = this.db.prepare(\"SELECT value FROM meta WHERE key = 'last_hash'\").get();\n    const dataVersionRow = this.db.prepare('PRAGMA data_version').get();\n    const totalChangesRow = this.db.prepare('SELECT total_changes() AS total_changes').get();\n    const marker = {\n      last_seq: Number(seqRow?.value),\n      last_hash: hashRow?.value,\n      data_version: Number(\n        dataVersionRow?.data_version ?? Object.values(dataVersionRow ?? {})[0]\n      ),\n      total_changes: Number(\n        totalChangesRow?.total_changes ?? Object.values(totalChangesRow ?? {})[0]\n      )\n    };\n    if (\n      !Number.isSafeInteger(marker.last_seq)\n      || marker.last_seq < 0\n      || !DIGEST.test(marker.last_hash ?? '')\n      || !Number.isSafeInteger(marker.data_version)\n      || marker.data_version < 0\n      || !Number.isSafeInteger(marker.total_changes)\n      || marker.total_changes < 0\n    ) {\n      throw new ValidationError('Grid live verification marker is invalid');\n    }\n    return marker;\n  }\n\n  verifyLiveChain() {\n    const current = this.readLiveChainMarker();\n    const cached = this.liveChainVerificationCache;\n    if (cached && sameLiveChainMarker(current, cached.marker)) {\n      return structuredClone(cached.result);\n    }\n\n    const growth = this.liveChainTrustedGrowth;\n    const checkpointEligible = Boolean(\n      cached\n      && growth\n      && sameLiveChainMarker(growth.from, cached.marker)\n      && sameLiveChainMarker(growth.to, current)\n      && current.last_seq >= cached.marker.last_seq\n    );\n    const verification = checkpointEligible\n      ? this.verifyChain({ mode: 'checkpoint' })\n      : this.verifyFullChain();\n    if (!verification.valid) {\n      this.liveChainVerificationCache = null;\n      this.liveChainTrustedGrowth = null;\n      return verification;\n    }\n\n    const after = this.readLiveChainMarker();\n    if (!sameLiveChainMarker(current, after)) {\n      this.liveChainVerificationCache = null;\n      this.liveChainTrustedGrowth = null;\n      return {\n        valid: false,\n        reason: 'chain_changed_during_verification'\n      };\n    }\n    this.liveChainVerificationCache = {\n      marker: structuredClone(after),\n      result: structuredClone(verification)\n    };\n    this.liveChainTrustedGrowth = null;\n    return structuredClone(verification);\n  }\n\n  verifyChain({ mode = 'checkpoint' } = {}) {\n"""
          )
          replace_once(
              checkpoint,
              """function isPlainObject(value) {\n""",
              """function sameLiveChainMarker(left, right) {\n  return Boolean(\n    left\n    && right\n    && left.last_seq === right.last_seq\n    && left.last_hash === right.last_hash\n    && left.data_version === right.data_version\n    && left.total_changes === right.total_changes\n  );\n}\n\nfunction isPlainObject(value) {\n"""
          )
          replace_once(
              'mesh/src/grid/store.mjs',
              """    const chain = this.verifyFullChain();\n""",
              """    const chain = this.verifyLiveChain();\n"""
          )
          PY
          git add mesh/src/grid/_store-checkpoints.mjs mesh/src/grid/store.mjs
          git commit -m "fix: bound live evidence-chain verification"

      - name: Apply F-10 pinned MCP conformance
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact patch anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          module = 'mesh/src/lib/agent-commons-mcp-readonly.mjs'
          replace_once(
              module,
              """  header_mismatch: -32001,\n  unsupported_protocol_version: -32022,\n""",
              """  header_mismatch: -32020,\n  missing_required_client_capability: -32021,\n  unsupported_protocol_version: -32022,\n"""
          )
          replace_once(
              module,
              """    'header_mismatch',\n    'unsupported_protocol_version',\n""",
              """    'header_mismatch',\n    'missing_required_client_capability',\n    'unsupported_protocol_version',\n"""
          )

          manifest_path = Path('agent-commons/mcp-readonly-lab.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['error_codes'] = {
              'invalid_request': -32600,
              'method_not_found': -32601,
              'invalid_params': -32602,
              'header_mismatch': -32020,
              'missing_required_client_capability': -32021,
              'unsupported_protocol_version': -32022,
              'internal_error': -32603
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git add mesh/src/lib/agent-commons-mcp-readonly.mjs agent-commons/mcp-readonly-lab.json mesh/test/fixtures/mcp-2026-07-28-error-codes.json mesh/test/mcp-spec-conformance.test.mjs
          git commit -m "fix: pin MCP 2026-07-28 error codes"

      - name: Apply F-04 and F-05 registry closure
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact patch anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          checker = 'mesh/src/check-registry.mjs'
          replace_once(
              checker,
              """  'operations.provider-runtime',\n  'operations.pilot-dossier-verification',\n""",
              """  'operations.provider-runtime',\n  'operations.public-witness',\n  'operations.pilot-dossier-verification',\n"""
          )
          replace_once(
              checker,
              """  'operations.installer-observability-release'\n]);\n\nexport function validateCapabilityRegistry(registry) {\n""",
              """  'operations.installer-observability-release'\n]);\nconst SERVICE_SCRIPT_ALLOWLIST = new Set(['dev']);\n\nexport function validateCapabilityRegistry(registry) {\n"""
          )
          replace_once(
              checker,
              """    if (typeof item.family !== 'string' || typeof item.summary !== 'string' || item.summary.length < 20) {\n      throw new ValidationError(`Capability ${item.id} is missing family or summary metadata`);\n    }\n    if (item.evidence !== undefined) {\n""",
              """    if (typeof item.family !== 'string' || typeof item.summary !== 'string' || item.summary.length < 20) {\n      throw new ValidationError(`Capability ${item.id} is missing family or summary metadata`);\n    }\n    if (item.surfaces !== undefined) {\n      if (!Array.isArray(item.surfaces) || !item.surfaces.length) {\n        throw new ValidationError(`Capability ${item.id} surfaces must be a non-empty array`);\n      }\n      const surfaces = item.surfaces.map(surface => {\n        if (typeof surface !== 'string' || !/^npm:[a-z0-9][a-z0-9:._-]{0,127}$/.test(surface)) {\n          throw new ValidationError(`Capability ${item.id} surface is invalid`);\n        }\n        return surface;\n      });\n      if (new Set(surfaces).size !== surfaces.length) {\n        throw new ValidationError(`Capability ${item.id} contains duplicate surfaces`);\n      }\n    }\n    if (item.evidence !== undefined) {\n"""
          )
          replace_once(
              checker,
              """export async function validateCapabilityEvidenceBindings(registry, {\n""",
              """export function validateCapabilityServiceSurfaces(registry, packageManifest) {\n  if (!packageManifest || typeof packageManifest !== 'object' || Array.isArray(packageManifest)) {\n    throw new ValidationError('Package manifest must be an object');\n  }\n  if (!packageManifest.scripts || typeof packageManifest.scripts !== 'object' || Array.isArray(packageManifest.scripts)) {\n    throw new ValidationError('Package manifest scripts must be an object');\n  }\n\n  const scriptNames = Object.keys(packageManifest.scripts).sort();\n  const serviceScripts = scriptNames.filter(\n    name => name.startsWith('start:') || name.endsWith(':start')\n  );\n  const allowlistedScripts = [...SERVICE_SCRIPT_ALLOWLIST]\n    .filter(name => Object.hasOwn(packageManifest.scripts, name))\n    .sort();\n  const surfaceMap = {};\n  for (const capability of registry.capabilities ?? []) {\n    for (const surface of capability.surfaces ?? []) {\n      if (!surface.startsWith('npm:')) continue;\n      const script = surface.slice(4);\n      if (!Object.hasOwn(packageManifest.scripts, script)) {\n        throw new ValidationError(\n          `Capability ${capability.id} references unknown npm service surface: ${script}`\n        );\n      }\n      if (Object.hasOwn(surfaceMap, script)) {\n        throw new ValidationError(`Duplicate npm service surface mapping: ${script}`);\n      }\n      surfaceMap[script] = capability.id;\n    }\n  }\n\n  const unmapped = serviceScripts.filter(\n    script => !Object.hasOwn(surfaceMap, script) && !SERVICE_SCRIPT_ALLOWLIST.has(script)\n  );\n  if (unmapped.length) {\n    throw new ValidationError(`Unmapped runnable service scripts: ${unmapped.join(', ')}`);\n  }\n  return {\n    valid: true,\n    service_scripts: serviceScripts,\n    allowlisted_scripts: allowlistedScripts,\n    surface_map: Object.fromEntries(\n      Object.entries(surfaceMap).sort(([left], [right]) => left.localeCompare(right))\n    )\n  };\n}\n\nexport async function validateCapabilityEvidenceBindings(registry, {\n"""
          )
          replace_once(
              checker,
              """  const implemented = new Map(\n    (registry.capabilities ?? [])\n      .filter(item => item.status === 'implemented')\n      .map(item => [item.id, item])\n  );\n  const seen = new Set();\n""",
              """  const bindable = new Map(\n    (registry.capabilities ?? [])\n      .filter(item => item.status === 'implemented' || item.status === 'experimental')\n      .map(item => [item.id, item])\n  );\n  const implemented = new Map(\n    (registry.capabilities ?? [])\n      .filter(item => item.status === 'implemented')\n      .map(item => [item.id, item])\n  );\n  const seen = new Set();\n"""
          )
          replace_once(
              checker,
              """    const item = implemented.get(binding.capability_id);\n    if (!item) {\n      throw new ValidationError(\n        `Capability evidence binding names a non-implemented or unknown capability: ${binding.capability_id}`\n      );\n    }\n""",
              """    const item = bindable.get(binding.capability_id);\n    if (!item) {\n      throw new ValidationError(\n        `Capability evidence binding names a non-bindable or unknown capability: ${binding.capability_id}`\n      );\n    }\n"""
          )
          replace_once(
              checker,
              """  const extras = [...seen].filter(id => !implemented.has(id));\n""",
              """  const extras = [...seen].filter(id => !bindable.has(id));\n"""
          )
          replace_once(
              checker,
              """  const registryResult = validateCapabilityRegistry(registry);\n  const evidenceResult = await validateCapabilityEvidenceBindings(registry);\n  process.stdout.write(`${JSON.stringify({\n    ...registryResult,\n    evidence: evidenceResult\n  }, null, 2)}\\n`);\n""",
              """  const registryResult = validateCapabilityRegistry(registry);\n  const packageManifest = JSON.parse(await readFile(resolve(MESH_ROOT, 'package.json'), 'utf8'));\n  const serviceSurfaceResult = validateCapabilityServiceSurfaces(registry, packageManifest);\n  const evidenceResult = await validateCapabilityEvidenceBindings(registry);\n  process.stdout.write(`${JSON.stringify({\n    ...registryResult,\n    service_surfaces: serviceSurfaceResult,\n    evidence: evidenceResult\n  }, null, 2)}\\n`);\n"""
          )

          registry_path = Path('mesh/config/capabilities.json')
          registry = json.loads(registry_path.read_text())
          registry['verified_at'] = '2026-08-30'
          by_id = {item['id']: item for item in registry['capabilities']}
          surface_assignments = {
              'ui.operator-api': ['npm:start:gateway-unit'],
              'operations.observability': ['npm:telemetry-relay:start'],
              'operations.independent-service-units': ['npm:start:production'],
              'operations.provider-runtime': ['npm:provider:start']
          }
          for capability_id, surfaces in surface_assignments.items():
              if capability_id not in by_id:
                  raise SystemExit(f'missing expected capability: {capability_id}')
              by_id[capability_id]['surfaces'] = surfaces
          if 'operations.public-witness' in by_id:
              raise SystemExit('operations.public-witness already exists unexpectedly')
          public_witness = {
              'id': 'operations.public-witness',
              'family': 'operations',
              'status': 'experimental',
              'summary': 'Independently operated public witnessing durably publishes and verifies signed currentness anchors without granting execution authority or claiming global currentness or finality.',
              'surfaces': ['npm:public-witness:start'],
              'evidence': ['mesh/test/public-witness-currentness-anchor-publication.test.mjs']
          }
          insert_at = next(
              index + 1
              for index, item in enumerate(registry['capabilities'])
              if item['id'] == 'operations.provider-runtime'
          )
          registry['capabilities'].insert(insert_at, public_witness)
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')

          bindings_path = Path('mesh/config/capability-evidence-bindings.json')
          bindings = json.loads(bindings_path.read_text())
          if any(item['capability_id'] == 'operations.public-witness' for item in bindings['bindings']):
              raise SystemExit('operations.public-witness binding already exists unexpectedly')
          bindings['bindings'].append({
              'capability_id': 'operations.public-witness',
              'path': 'mesh/test/public-witness-currentness-anchor-publication.test.mjs',
              'test': 'public witness anchor store durably publishes a verified anchor without authority or global-currentness claims',
              'assertions': [
                  "assert.equal(result.status, 'published');",
                  "assert.equal(result.durable_record.statement.global_currentness_claimed, false);",
                  "assert.equal(result.durable_record.statement.authority_effect, 'none');",
                  "assert.equal(result.execution_authority_granted, false);"
              ]
          })
          bindings['bindings'].sort(key=lambda item: item['capability_id'])
          bindings_path.write_text(json.dumps(bindings, indent=2) + '\n')
          PY
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { digestObject } from './mesh/src/lib/canonical.mjs';
          const registry = JSON.parse(await readFile('./mesh/config/capabilities.json', 'utf8'));
          const bindings = JSON.parse(await readFile('./mesh/config/capability-evidence-bindings.json', 'utf8'));
          bindings.registry_digest = digestObject(registry);
          await writeFile(
            './mesh/config/capability-evidence-bindings.json',
            `${JSON.stringify(bindings, null, 2)}\n`,
            'utf8'
          );
          NODE
          git add mesh/src/check-registry.mjs mesh/config/capabilities.json mesh/config/capability-evidence-bindings.json mesh/test/capability-service-surface.test.mjs
          git commit -m "fix: close capability registry over service surfaces"

      - name: Push remediation commits
        run: git push origin HEAD:audit-remediation-2026-08-30
