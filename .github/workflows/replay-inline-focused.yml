name: Replay Inline Focused Verification

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-inline-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/replay-grounded-self-improvement
          persist-credentials: false
      - name: Verify complete Replay Core focused suite
        run: |
          node --test \
            mesh/test/discovery-trace.test.mjs \
            mesh/test/replay-world.test.mjs \
            mesh/test/replay-policy-contracts.test.mjs \
            mesh/test/replay-engine.test.mjs \
            mesh/test/replay-world-pool.test.mjs \
            mesh/test/replay-policy-evaluation.test.mjs \
            mesh/test/replay-schema-parity.test.mjs \
            mesh/test/replay-boundary-static.test.mjs
      - name: Verify canonical docs
        run: node mesh/src/check-docs.mjs
