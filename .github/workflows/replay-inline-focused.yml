name: Replay Inline Focused Verification

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-inline-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/replay-grounded-self-improvement
          persist-credentials: false
      - name: Verify Replay Schema parity GREEN
        run: node --test mesh/test/replay-schema-parity.test.mjs
      - name: Verify canonical docs GREEN
        run: node mesh/src/check-docs.mjs
