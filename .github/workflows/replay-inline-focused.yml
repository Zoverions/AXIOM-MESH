name: Replay Inline Focused Verification

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-inline-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/replay-grounded-self-improvement
          persist-credentials: false
      - name: Witness Replay Schema parity RED
        shell: bash
        run: |
          set +e
          output=$(node --test mesh/test/replay-schema-parity.test.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -E "ENOENT|no such file or directory"
          printf '%s\n' "$output" | grep -E "discovery-trace\.v0\.schema\.json|replay-world\.v0\.schema\.json|exploration-policy\.v0\.schema\.json|replay-objective\.v0\.schema\.json|replay-world-pool\.v0\.schema\.json|replay-policy-evaluation\.v0\.schema\.json"
