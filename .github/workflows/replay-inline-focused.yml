name: Replay Inline Focused Verification

on:
  push:
    branches:
      - design/replay-grounded-self-improvement
    paths:
      - .github/workflows/replay-inline-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/replay-grounded-self-improvement
          persist-credentials: false
      - name: Witness Exploration Policy and Replay Objective RED
        shell: bash
        run: |
          set +e
          output=$(node --test mesh/test/replay-policy-contracts.test.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "ERR_MODULE_NOT_FOUND"
