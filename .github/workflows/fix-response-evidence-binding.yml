name: Fix Response Evidence Binding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'docs/machine-response-size-claim-sync-2026-08-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/machine-response-size-claim-sync-2026-08-09
          fetch-depth: 0
      - name: Correct exact response-size envelope assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';
          const path = 'mesh/config/capability-evidence-bindings.json';
          const bindings = JSON.parse(await readFile(path, 'utf8'));
          const binding = bindings.bindings.find(item => item.capability_id === 'core.machine-principals');
          if (!binding) throw new Error('core.machine-principals binding is missing');
          const oldAssertion = 'assert.equal(accepted.payload.invocation.limits.ingress.max_response_bytes, 8_192);';
          const newAssertion = 'assert.equal(accepted.payload.invocation.limits.ingress.max_response_bytes, 262_144);';
          const index = binding.assertions.indexOf(oldAssertion);
          if (index < 0) throw new Error('Expected old response-size assertion is missing');
          binding.assertions[index] = newAssertion;
          await writeFile(path, `${JSON.stringify(bindings, null, 2)}\n`);
          await rm('.github/workflows/fix-response-evidence-binding.yml');
          NODE
      - name: Commit exact evidence correction
        run: |
          git config user.name "axiom-claim-sync"
          git config user.email "axiom-claim-sync@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: correct response-size claim evidence binding"
          git push origin HEAD:docs/machine-response-size-claim-sync-2026-08-09
