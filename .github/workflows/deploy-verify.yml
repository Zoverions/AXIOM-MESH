name: AXIOM-MESH Deploy + Verify + Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build & Test Contracts
        run: |
          cd grid/contracts
          forge build
          forge test --gas-report

      - name: Deploy to Testnet & Verify
        run: |
          cd grid/contracts
          forge script script/DeployAllPillars.s.sol --rpc-url ${{ secrets.TESTNET_RPC }} --broadcast --verify
          forge script script/VerifyAllOnMainnet.s.sol --rpc-url ${{ secrets.ETH_RPC }} --etherscan-api-key ${{ secrets.ETHERSCAN_KEY }} --broadcast
        env:
          FOUNDER_COMMITMENT_ETH: "0x1111111111111111111111111111111111111111"
          FACTORY_ETH: "0x2222222222222222222222222222222222222222"
          POOL_ETH: "0x3333333333333333333333333333333333333333"
          DARK_POOL_ETH: "0x4444444444444444444444444444444444444444"
          ROBOT_ETH: "0x5555555555555555555555555555555555555555"
          SHADOW_ETH: "0x6666666666666666666666666666666666666666"
          BRIDGE_ETH: "0x7777777777777777777777777777777777777777"
          BRIDGE_ARB: "0x8888888888888888888888888888888888888888"


      - name: Build & Push Docker
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: zoverions/axiom-mesh:latest
          file: Dockerfile

      - name: Run docker-compose
        run: docker-compose up -d --build

      - name: WORM Export & Audit
        run: python -m grid.cli export_worm > audit.json
