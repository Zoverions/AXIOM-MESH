name: Audit Sync Main

on:
  push:
    branches:
      - audit-remediation-2026-08-30
    paths:
      - .github/workflows/audit-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit-remediation-2026-08-30
          fetch-depth: 0
      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "axiom-audit-remediation"
          git config user.email "208527039+Zoverions@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "merge: sync current main into audit remediation"
          git rm .github/workflows/audit-sync-main.yml
          git commit -m "chore: remove temporary main-sync workflow"
          git push origin HEAD:audit-remediation-2026-08-30
