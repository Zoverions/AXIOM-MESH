name: Rust Trust-Core Laboratory

on:
  push:
    branches:
      - "feat/rust-trust-core-foundation"
      - "feat/rust-trust-core-stage2-conformance"
      - "feat/rust-trust-core-stage3-source-promotion"
      - "feat/rust-trust-core-stage4-adversarial-differential"
      - "feat/rust-trust-core-stage5a-intent-attenuation"
    paths:
      - "labs/rust-trust-core/**"
      - "trust-core/rust/**"
      - "mesh/src/rust-trust-core-source-boundary.mjs"
      - "mesh/test/rust-trust-core-candidate-source-boundary.test.mjs"
      - ".github/workflows/rust-trust-core-lab.yml"
      - "docs/MASTER-TODO-SOVEREIGN-HOST-DEPLOYMENT.md"
      - "docs/ROADMAP.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-migration-foundation-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-migration-foundation.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-stage2-differential-conformance-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-stage2-differential-conformance.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-stage4-adversarial-differential-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-stage4-adversarial-differential.md"
  pull_request:
    branches: ["main"]
    paths:
      - "labs/rust-trust-core/**"
      - "trust-core/rust/**"
      - "mesh/src/rust-trust-core-source-boundary.mjs"
      - "mesh/test/rust-trust-core-candidate-source-boundary.test.mjs"
      - ".github/workflows/rust-trust-core-lab.yml"
      - "docs/MASTER-TODO-SOVEREIGN-HOST-DEPLOYMENT.md"
      - "docs/ROADMAP.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-migration-foundation-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-migration-foundation.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-stage2-differential-conformance-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-stage2-differential-conformance.md"
      - "docs/superpowers/specs/2026-09-06-rust-trust-core-stage4-adversarial-differential-design.md"
      - "docs/superpowers/plans/2026-09-06-rust-trust-core-stage4-adversarial-differential.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-trust-core-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-trust-core-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Verify Node canonical oracle
        run: node --test labs/rust-trust-core/node/canonical_oracle.test.mjs
      - name: Verify Stage 4 adversarial corpus contract
        run: node --test labs/rust-trust-core/node/canonical_adversarial_corpus.test.mjs
      - name: Verify Stage 4 adversarial limits
        run: node --test labs/rust-trust-core/node/canonical_adversarial_limits.test.mjs
      - name: Verify Stage 5A Node intent attenuation oracle
        run: node --test labs/rust-trust-core/node/intent_attenuation_oracle.test.mjs
      - name: Verify Stage 3 source boundary
        run: node mesh/src/rust-trust-core-source-boundary.mjs
      - name: Verify Stage 4 does not modify promoted Rust v0 source
        run: git diff --exit-code ec2a480ff8d903fbef89807429c289637e3a0d7c -- trust-core/rust/canonical_value_v0.rs
      - name: Verify Stage 5A does not modify promoted Rust v0 source
        run: git diff --exit-code ad8c0bd92f74f328c1c7e86c3d6e2723119defb3 -- trust-core/rust/canonical_value_v0.rs
      - name: Verify pinned Rust toolchain
        working-directory: labs/rust-trust-core
        run: |
          rustc --version
          cargo --version
      - name: Verify formatting
        run: cargo fmt --manifest-path labs/rust-trust-core/Cargo.toml --all -- --check
      - name: Verify Clippy
        run: cargo clippy --manifest-path labs/rust-trust-core/Cargo.toml --all-targets -- -D warnings
      - name: Verify trust-core laboratory tests
        run: cargo test --manifest-path labs/rust-trust-core/Cargo.toml --locked
      - name: Checkout pinned Bend 2 checker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bendlang/bend
          ref: 8008146ab90abb98b496fa2a6ffe555da7fb0dd5
          path: .tools/bend
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Bun runtime for Bend laboratory
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 source pin
        with:
          bun-version: "1.4.2"
      - name: Verify Bend authority-v0 laws
        run: |
          test "$(git -C .tools/bend rev-parse HEAD)" = "8008146ab90abb98b496fa2a6ffe555da7fb0dd5"
          test "$(bun --version)" = "1.4.2"
          test "$(bun --revision)" = "1.4.2+744846f84"
          bun run .tools/bend/bend2/main.ts labs/rust-trust-core/formal/bend/PROOF.bend
      - name: Verify Bend rejects false authority proof
        run: |
          if bun run .tools/bend/bend2/main.ts labs/rust-trust-core/formal/bend/NEGATIVE_PROOF.bend > bend-negative-control.log 2>&1; then
            cat bend-negative-control.log
            echo "Bend negative control unexpectedly verified" >&2
            exit 1
          fi
          cat bend-negative-control.log
