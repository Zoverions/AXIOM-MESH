name: Agent Linux Isolation Conformance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "agent-commons/**"
      - "docs/architecture/AGENT-COMMONS.md"
      - "AGENTS.md"
      - ".github/workflows/agent-linux-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-linux-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify reviewed local Docker endpoint
        run: |
          test -x /usr/bin/docker
          test "$(readlink -f /usr/bin/docker)" = "/usr/bin/docker"
      - name: Build exact fixed probe image
        working-directory: mesh
        run: docker build --pull=false --tag axiom-mesh-kernel:0.12.0-dev.3 .
      - name: Run fixed-probe Linux isolation conformance
        working-directory: mesh
        env:
          AXIOM_AGENT_LINUX_ISOLATION_LAB: "1"
        run: |
          node src/linux-isolation-adapter-drill.mjs \
            > "$RUNNER_TEMP/axiom-agent-linux-isolation-conformance.json"
      - name: Reverify bounded Linux isolation receipt
        working-directory: mesh
        run: |
          RECEIPT="$RUNNER_TEMP/axiom-agent-linux-isolation-conformance.json" \
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifyAgentLinuxIsolationConformanceReceipt } from "./src/lib/agent-linux-isolation-conformance.mjs";
            const receipt = JSON.parse(readFileSync(process.env.RECEIPT, "utf8"));
            verifyAgentLinuxIsolationConformanceReceipt(receipt);
          '
      - name: Run plan-bound read-system-facts effect
        working-directory: mesh
        env:
          AXIOM_AGENT_READ_SYSTEM_FACTS_EFFECT_LAB: "1"
          AXIOM_AGENT_LINUX_ISOLATION_RECEIPT: ${{ runner.temp }}/axiom-agent-linux-isolation-conformance.json
        run: |
          node src/read-system-facts-effect-drill.mjs \
            > "$RUNNER_TEMP/axiom-agent-read-system-facts-effect.json"
      - name: Reverify read-system-facts effect evidence
        working-directory: mesh
        env:
          EFFECT_BUNDLE: ${{ runner.temp }}/axiom-agent-read-system-facts-effect.json
          ISOLATION_RECEIPT: ${{ runner.temp }}/axiom-agent-linux-isolation-conformance.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { digestObject } from "./src/lib/canonical.mjs";
            import { verifyAgentExecutorDurableStateReceipt } from "./src/lib/agent-executor-durable-format.mjs";
            import { verifyAgentReadSystemFactsEffectAdmission } from "./src/lib/agent-read-system-facts-effect-admission.mjs";
            import { verifyAgentReadSystemFactsEffectReceipt } from "./src/lib/agent-read-system-facts-effect.mjs";
            import { verifyAgentLinuxIsolationConformanceReceipt } from "./src/lib/agent-linux-isolation-conformance.mjs";
            const bundle = JSON.parse(readFileSync(process.env.EFFECT_BUNDLE, "utf8"));
            const isolation = verifyAgentLinuxIsolationConformanceReceipt(JSON.parse(readFileSync(process.env.ISOLATION_RECEIPT, "utf8")));
            const { bundle_digest, ...body } = bundle;
            if (bundle_digest !== digestObject(body)) throw new Error("effect evidence bundle digest mismatch");
            if (bundle.revision !== process.env.GITHUB_SHA || bundle.isolation_receipt_digest !== isolation.receipt_digest) throw new Error("effect evidence revision/isolation binding mismatch");
            verifyAgentReadSystemFactsEffectAdmission(bundle.admission, {
              trustedIssuerPublicKey: bundle.admission_issuer_public_key,
              plan: bundle.plan,
              expectedRevision: bundle.revision,
              now: bundle.effect_receipt.statement.started_at
            });
            const consumed = verifyAgentExecutorDurableStateReceipt(bundle.durable_consume_head_receipt, {
              trustedStorePublicKey: bundle.durable_store_public_key,
              plan: bundle.plan,
              expectedStoreId: bundle.effect_receipt.statement.durable_store_id
            });
            const effect = verifyAgentReadSystemFactsEffectReceipt(bundle.effect_receipt, {
              trustedExecutorPublicKey: bundle.executor_public_key,
              trustedAdmissionIssuerPublicKey: bundle.admission_issuer_public_key,
              trustedDurableStorePublicKey: bundle.durable_store_public_key,
              durableConsumeHeadReceipt: bundle.durable_consume_head_receipt,
              plan: bundle.plan,
              admission: bundle.admission,
              isolationConformanceReceipt: isolation
            });
            if (consumed.statement.lifecycle_status !== "consumed" || consumed.statement.generation !== effect.statement.durable_consume_generation || consumed.statement.record_digest !== effect.statement.durable_consume_record_digest || consumed.receipt_digest !== effect.statement.durable_consume_head_receipt_digest) throw new Error("effect consumed durable head binding mismatch");
            const durable = verifyAgentExecutorDurableStateReceipt(bundle.durable_head_receipt, {
              trustedStorePublicKey: bundle.durable_store_public_key,
              plan: bundle.plan,
              expectedStoreId: effect.statement.durable_store_id
            });
            if (durable.statement.generation !== effect.statement.durable_final_generation || durable.statement.record_digest !== effect.statement.durable_final_record_digest) throw new Error("effect durable head binding mismatch");
            for (const value of Object.values(bundle.claims)) if (value !== false) throw new Error("effect evidence bundle attempts claim elevation");
          '
      - name: Upload Linux isolation and read-system-facts effect evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axiom-agent-linux-isolation-conformance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/axiom-agent-linux-isolation-conformance.json
            ${{ runner.temp }}/axiom-agent-read-system-facts-effect.json
          if-no-files-found: error
          retention-days: 90