name: Agent Linux Isolation Conformance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/**"
      - "agent-commons/**"
      - "docs/architecture/AGENT-COMMONS.md"
      - "AGENTS.md"
      - ".github/workflows/agent-linux-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-linux-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify reviewed local Docker endpoint
        run: |
          test -x /usr/bin/docker
          test "$(readlink -f /usr/bin/docker)" = "/usr/bin/docker"
      - name: Build exact fixed probe image
        working-directory: mesh
        run: docker build --pull=false --tag axiom-mesh-kernel:0.12.0-dev.3 .
      - name: Run fixed-probe Linux isolation conformance
        working-directory: mesh
        env:
          AXIOM_AGENT_LINUX_ISOLATION_LAB: "1"
        run: |
          node src/linux-isolation-adapter-drill.mjs \
            > "$RUNNER_TEMP/axiom-agent-linux-isolation-conformance.json"
      - name: Reverify bounded Linux isolation receipt
        working-directory: mesh
        run: |
          RECEIPT="$RUNNER_TEMP/axiom-agent-linux-isolation-conformance.json" \
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifyAgentLinuxIsolationConformanceReceipt } from "./src/lib/agent-linux-isolation-conformance.mjs";
            const receipt = JSON.parse(readFileSync(process.env.RECEIPT, "utf8"));
            verifyAgentLinuxIsolationConformanceReceipt(receipt);
          '
      - name: Upload Linux isolation conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axiom-agent-linux-isolation-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/axiom-agent-linux-isolation-conformance.json
          if-no-files-found: error
          retention-days: 90
