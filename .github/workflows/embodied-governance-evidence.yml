name: Embodied Governance Evidence Gate

on:
  pull_request:
    paths:
      - 'docs/evidence/**'
      - 'scripts/check_embodied_governance_evidence.py'
      - '.github/workflows/embodied-governance-evidence.yml'
  workflow_dispatch:

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate embodied governance evidence
        run: |
          python scripts/check_embodied_governance_evidence.py docs/evidence/embodied-governance/high-autonomy-evidence.json
