name: AXIOM Host H0 Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "host/**"
      - "mesh/src/axiom-host-*.mjs"
      - "mesh/src/check-axiom-host-lab.mjs"
      - "mesh/test/axiom-host-*.test.mjs"
      - "package.json"
      - "mesh/package.json"
      - ".github/workflows/axiom-host-h0-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-host-h0-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkosi-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AXIOM_HOST_LAB_ACK: I_UNDERSTAND_THIS_IS_NON_PRODUCTION
      MKOSI_V26_COMMIT: 84af20892b61c8e177e391f997ded8b4cb5514f2
      FEDORA_RAWHIDE_COMPOSE_ID_URL: https://kojipkgs.fedoraproject.org/compose/rawhide/latest-Fedora-Rawhide/COMPOSE_ID
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify static H0 contract
        run: npm run host:lab:check

      - name: Fetch exact upstream mkosi v26 commit
        shell: bash
        run: |
          set -euo pipefail
          MKOSI_DIR="$RUNNER_TEMP/mkosi-v26"
          git init "$MKOSI_DIR"
          git -C "$MKOSI_DIR" remote add origin https://github.com/systemd/mkosi.git
          git -C "$MKOSI_DIR" fetch --depth=1 origin "$MKOSI_V26_COMMIT"
          git -C "$MKOSI_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$MKOSI_DIR" rev-parse HEAD)" = "$MKOSI_V26_COMMIT"
          printf '%s/bin\n' "$MKOSI_DIR" >> "$GITHUB_PATH"

      - name: Verify exact mkosi version
        shell: bash
        run: |
          set -euo pipefail
          mkosi --version | tee "$RUNNER_TEMP/mkosi-version.txt"
          grep -Eq '^mkosi 26([ .]|$)' "$RUNNER_TEMP/mkosi-version.txt"

      - name: Parse AXIOM Host H0 configuration with upstream mkosi
        run: npm run host:lab:summary

      - name: Attempt mkosi Rawhide snapshot discovery on hosted runner
        id: snapshot
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run host:lab:snapshot \
            > "$RUNNER_TEMP/axiom-host-fedora-snapshot-attempt.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/axiom-host-fedora-snapshot-attempt.log"
          exit "$status"

      - name: Cross-check exact Rawhide compose candidate without mkosi sandbox
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "$FEDORA_RAWHIDE_COMPOSE_ID_URL" \
            -o "$RUNNER_TEMP/fedora-rawhide-compose-id.txt"
          compose_id="$(tr -d '\r\n' < "$RUNNER_TEMP/fedora-rawhide-compose-id.txt")"
          case "$compose_id" in
            Fedora-Rawhide-*) ;;
            *) echo "Unexpected Fedora Rawhide COMPOSE_ID: $compose_id" >&2; exit 1 ;;
          esac
          candidate="${compose_id#Fedora-Rawhide-}"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/fedora-rawhide-snapshot-candidate.txt"
          node -e 'const fs=require("node:fs"); const v=fs.readFileSync(process.argv[1],"utf8").trim(); if(!/^[A-Za-z0-9][A-Za-z0-9._:+-]{0,159}$/.test(v)) process.exit(1)' \
            "$RUNNER_TEMP/fedora-rawhide-snapshot-candidate.txt"

      - name: Record snapshot discovery outcome
        if: always()
        shell: bash
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          COMPOSE_OUTCOME: ${{ steps.compose.outcome }}
        run: |
          set -euo pipefail
          candidate=""
          if [[ -f "$RUNNER_TEMP/fedora-rawhide-snapshot-candidate.txt" ]]; then
            candidate="$(tr -d '\r\n' < "$RUNNER_TEMP/fedora-rawhide-snapshot-candidate.txt")"
          fi
          printf '{"schema":"axiom-host-h0-snapshot-probe.v1","github_sha":"%s","mkosi_commit":"%s","mkosi_latest_snapshot_outcome":"%s","direct_compose_outcome":"%s","candidate":"%s","candidate_committed":false,"gating":false,"interpretation":"The direct compose lookup mirrors the pinned mkosi v26 Fedora Rawhide latest_snapshot endpoint semantics but remains review evidence only. H0 build still requires the same reviewed candidate to be committed in mkosi.snapshot and Snapshot=."}\n' \
            "$GITHUB_SHA" "$MKOSI_V26_COMMIT" "$SNAPSHOT_OUTCOME" "$COMPOSE_OUTCOME" "$candidate" \
            > "$RUNNER_TEMP/axiom-host-fedora-snapshot-probe.json"

      - name: Upload snapshot probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axiom-host-fedora-snapshot-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/axiom-host-fedora-snapshot-probe.json
            ${{ runner.temp }}/axiom-host-fedora-snapshot-attempt.log
            ${{ runner.temp }}/fedora-rawhide-compose-id.txt
            ${{ runner.temp }}/fedora-rawhide-snapshot-candidate.txt
          if-no-files-found: warn
          retention-days: 14
