name: AXIOM Host H0 Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "host/**"
      - "mesh/src/axiom-host-*.mjs"
      - "mesh/src/check-axiom-host-lab.mjs"
      - "mesh/test/axiom-host-*.test.mjs"
      - "package.json"
      - "mesh/package.json"
      - ".github/workflows/axiom-host-h0-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-host-h0-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkosi-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AXIOM_HOST_LAB_ACK: I_UNDERSTAND_THIS_IS_NON_PRODUCTION
      MKOSI_V26_COMMIT: 84af20892b61c8e177e391f997ded8b4cb5514f2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify static H0 contract
        run: npm run host:lab:check

      - name: Fetch exact upstream mkosi v26 commit
        shell: bash
        run: |
          set -euo pipefail
          MKOSI_DIR="$RUNNER_TEMP/mkosi-v26"
          git init "$MKOSI_DIR"
          git -C "$MKOSI_DIR" remote add origin https://github.com/systemd/mkosi.git
          git -C "$MKOSI_DIR" fetch --depth=1 origin "$MKOSI_V26_COMMIT"
          git -C "$MKOSI_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$MKOSI_DIR" rev-parse HEAD)" = "$MKOSI_V26_COMMIT"
          printf '%s/bin\n' "$MKOSI_DIR" >> "$GITHUB_PATH"

      - name: Verify exact mkosi version
        shell: bash
        run: |
          set -euo pipefail
          mkosi --version | tee "$RUNNER_TEMP/mkosi-version.txt"
          grep -Eq '^mkosi 26([ .]|$)' "$RUNNER_TEMP/mkosi-version.txt"

      - name: Parse AXIOM Host H0 configuration with upstream mkosi
        run: npm run host:lab:summary

      - name: Attempt Fedora snapshot discovery on hosted runner
        id: snapshot
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run host:lab:snapshot \
            > "$RUNNER_TEMP/axiom-host-fedora-snapshot-attempt.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/axiom-host-fedora-snapshot-attempt.log"
          exit "$status"

      - name: Record snapshot discovery outcome
        if: always()
        shell: bash
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          set -euo pipefail
          printf '{"schema":"axiom-host-h0-snapshot-probe.v1","github_sha":"%s","mkosi_commit":"%s","outcome":"%s","gating":false,"interpretation":"Hosted-runner snapshot discovery is evidence-only; a failure does not weaken the requirement to resolve and commit a reviewed snapshot before H0 build."}\n' \
            "$GITHUB_SHA" "$MKOSI_V26_COMMIT" "$SNAPSHOT_OUTCOME" \
            > "$RUNNER_TEMP/axiom-host-fedora-snapshot-probe.json"

      - name: Upload snapshot probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axiom-host-fedora-snapshot-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/axiom-host-fedora-snapshot-probe.json
            ${{ runner.temp }}/axiom-host-fedora-snapshot-attempt.log
          if-no-files-found: error
          retention-days: 14
