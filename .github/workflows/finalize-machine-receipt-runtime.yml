name: Finalize machine receipt runtime

on:
  push:
    branches:
      - feat/machine-receipt-verification-v1-2026-08-10

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/feat/machine-receipt-verification-v1-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/machine-receipt-verification-v1-2026-08-10
      - name: Wire owner-scoped signed machine receipt verification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function replaceExact(path, before, after) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`Missing exact anchor in ${path}`);
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }
          function canonicalize(value) {
            if (value === null || typeof value !== 'object') return value;
            if (Array.isArray(value)) return value.map(canonicalize);
            const output = {};
            for (const key of Object.keys(value).sort()) output[key] = canonicalize(value[key]);
            return output;
          }
          function digestObject(value) {
            return crypto.createHash('sha256')
              .update(JSON.stringify(canonicalize(value)))
              .digest('hex');
          }

          replaceExact(
            'mesh/src/lib/machine-receipt.mjs',
            '      terminal_payload_digest: eventDigest\n    };',
            '      terminal_payload_digest: digestObject(payload)\n    };'
          );

          replaceExact(
            'mesh/src/grid/_store-core.mjs',
            "  getIntent(intentId) {\n    const row = this.db.prepare('SELECT * FROM intents WHERE intent_id = ?').get(intentId);\n    if (!row) throw new AxiomError('intent_not_found', 'Intent was not found', 404);\n    return this.decodeProtectedRow('intents', 'intent_id', row, ['result_json', 'error_json']);\n  }\n\n  listEvents({ after = 0, limit = 100, actor } = {}) {",
            "  getIntent(intentId) {\n    const row = this.db.prepare('SELECT * FROM intents WHERE intent_id = ?').get(intentId);\n    if (!row) throw new AxiomError('intent_not_found', 'Intent was not found', 404);\n    return this.decodeProtectedRow('intents', 'intent_id', row, ['result_json', 'error_json']);\n  }\n\n  listIntentEvents(intentId) {\n    assertString(intentId, 'intent_id', { max: 160, pattern: ID });\n    return this.db.prepare(`\n      SELECT * FROM events\n      WHERE subject = ?\n        AND kind IN ('intent.accepted', 'intent.completed', 'intent.denied', 'intent.failed')\n      ORDER BY seq\n    `).all(intentId).map(row => this.decodeEventRow(row));\n  }\n\n  listEvents({ after = 0, limit = 100, actor } = {}) {"
          );

          replaceExact(
            'mesh/src/grid/server.mjs',
            "import { ValidationError, assertPlainObject, assertString } from '../lib/canonical.mjs';",
            "import { AxiomError, ValidationError, assertPlainObject, assertString } from '../lib/canonical.mjs';"
          );
          replaceExact(
            'mesh/src/grid/server.mjs',
            "import { runServiceProcess } from '../lib/service-lifecycle.mjs';",
            "import { runServiceProcess } from '../lib/service-lifecycle.mjs';\nimport { buildMachineIntentReceipt } from '../lib/machine-receipt.mjs';"
          );
          replaceExact(
            'mesh/src/grid/server.mjs',
            "  router.add('GET', '/internal/v1/status', async () => store.getStatus());\n  router.add('GET', '/internal/v1/verify-chain', async () => store.verifyChain());\n  router.add('GET', '/internal/v1/events', async ({ url }) => ({",
            "  router.add('GET', '/internal/v1/status', async () => store.getStatus());\n  router.add('GET', '/internal/v1/verify-chain', async () => store.verifyChain());\n  router.add('GET', '/internal/v1/machine-receipts/intents/:id/verify', async ({ params, url }) => {\n    const intentId = assertString(params.id, 'intent_id', {\n      max: 160,\n      pattern: /^intent_[a-f0-9]{64}$/\n    });\n    const requester = assertString(url.searchParams.get('principal'), 'principal', {\n      max: 160,\n      pattern: /^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$/\n    });\n    const intent = store.getIntent(intentId);\n    if (intent.principal !== requester) {\n      throw new AxiomError('forbidden', 'Intent receipt belongs to another principal', 403);\n    }\n    return buildMachineIntentReceipt({\n      intent,\n      events: store.listIntentEvents(intentId),\n      chain: store.verifyChain(),\n      identity,\n      kernelVersion: '0.12.0-dev.3'\n    });\n  });\n  router.add('GET', '/internal/v1/events', async ({ url }) => ({"
          );

          replaceExact(
            'mesh/src/gateway/server.mjs',
            "  router.add('GET', '/v1/status', async ({ traceId }) => {",
            "  router.add('GET', '/v1/machine-receipts/intents/:id/verify', async ({\n    params,\n    traceId,\n    principal\n  }) => {\n    if (principal.schema !== 'axiom-machine-principal.v1') {\n      throw new AxiomError(\n        'forbidden',\n        'Machine receipt verification requires a constrained machine principal',\n        403\n      );\n    }\n    const intentId = assertString(params.id, 'intent_id', {\n      max: 160,\n      pattern: /^intent_[a-f0-9]{64}$/\n    });\n    return gridGet(\n      `/internal/v1/machine-receipts/intents/${encodeURIComponent(intentId)}`\n        + `/verify?principal=${encodeURIComponent(principal.id)}`,\n      traceId\n    );\n  });\n\n  router.add('GET', '/v1/status', async ({ traceId }) => {"
          );

          const networkPath = 'mesh/config/service-network-policy.json';
          const network = JSON.parse(fs.readFileSync(networkPath, 'utf8'));
          const gatewayGrid = network.flows.find(flow => flow.id === 'gateway-to-grid');
          if (!gatewayGrid) throw new Error('gateway-to-grid flow missing');
          if (!gatewayGrid.routes.some(route => route.path === '/internal/v1/machine-receipts/intents/:id/verify')) {
            const index = gatewayGrid.routes.findIndex(route => route.path === '/internal/v1/intents/:id');
            gatewayGrid.routes.splice(index + 1, 0, {
              method: 'GET',
              path: '/internal/v1/machine-receipts/intents/:id/verify'
            });
          }
          fs.writeFileSync(networkPath, `${JSON.stringify(network, null, 2)}\n`);
          const networkDigest = digestObject(network);
          replaceExact(
            'mesh/src/lib/service-network-policy.mjs',
            "const EXPECTED_POLICY_DIGEST =\n  'f8b84ef64073607fc84512c1b05b0f3a7dd02b156a2386a7328d59c91712a3a5';",
            `const EXPECTED_POLICY_DIGEST =\n  '${networkDigest}';`
          );
          replaceExact(
            'mesh/src/lib/service-network-policy.mjs',
            '    gatewayGrid.routes.length !== 24',
            '    gatewayGrid.routes.length !== 25'
          );

          const contractPath = 'mesh/config/gateway-client-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          if (!contract.routes.some(route => route.id === 'machine_receipts.verify')) {
            const index = contract.routes.findIndex(route => route.id === 'machine_discovery.get');
            contract.routes.splice(index + 1, 0, {
              id: 'machine_receipts.verify',
              method: 'GET',
              path: '/v1/machine-receipts/intents/:id/verify',
              access: 'constrained-machine-owner',
              idempotency: 'not_applicable',
              path_parameters: ['id'],
              query_parameters: [],
              request_schema: null,
              response_schema: 'axiom-machine-intent-receipt.v1',
              required_response_fields: ['schema', 'statement', 'attestation', 'receipt_digest'],
              response_media_type: 'application/json'
            });
          }
          fs.writeFileSync(contractPath, `${JSON.stringify(contract, null, 2)}\n`);
          const contractDigest = digestObject(contract);
          replaceExact(
            'mesh/src/lib/gateway-client-contract.mjs',
            "const EXPECTED_CONTRACT_DIGEST =\n  '2fbee3cfd9702cc889058018735b40c7c795adec60d6499ea9b20b90053e6d7f';",
            `const EXPECTED_CONTRACT_DIGEST =\n  '${contractDigest}';`
          );
          replaceExact(
            'mesh/src/lib/gateway-client-contract.mjs',
            'if (!Array.isArray(contract.routes) || contract.routes.length !== 28) {',
            'if (!Array.isArray(contract.routes) || contract.routes.length !== 29) {'
          );

          replaceExact(
            'mesh/test/gateway-client-contract.test.mjs',
            '  assert.equal(result.routes, 28);\n  assert.equal(result.implemented_routes, 28);',
            '  assert.equal(result.routes, 29);\n  assert.equal(result.implemented_routes, 29);'
          );
          replaceExact(
            'mesh/test/service-network-policy.test.mjs',
            '  assert.equal(result.routes, 39);',
            '  assert.equal(result.routes, 40);'
          );
          replaceExact(
            'mesh/test/service-network-policy.test.mjs',
            '  assert.equal(implementation.implemented_routes, 35);',
            '  assert.equal(implementation.implemented_routes, 36);'
          );
          NODE
          rm .github/workflows/finalize-machine-receipt-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesh .github/workflows/finalize-machine-receipt-runtime.yml
          git commit -m "feat: wire owner-scoped machine receipt verification"
          git push origin HEAD:feat/machine-receipt-verification-v1-2026-08-10
