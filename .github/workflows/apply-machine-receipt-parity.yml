name: Apply machine receipt parity

on:
  push:
    branches:
      - "feat/machine-receipt-verification-v1b-2026-08-10"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/machine-receipt-verification-v1b-2026-08-10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Apply receipt parity and provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, old, new, *, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return 0
              if count < minimum:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new))
              return count

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return 0
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))
              return 1

          # Existing executable inventory tests.
          replace_all(
              'mesh/test/service-network-policy.test.mjs',
              'assert.equal(result.routes, 39);',
              'assert.equal(result.routes, 40);'
          )
          replace_all(
              'mesh/test/service-network-policy.test.mjs',
              'assert.equal(implementation.implemented_routes, 35);',
              'assert.equal(implementation.implemented_routes, 36);'
          )
          # Gateway contract test may already be connector-authored.
          p = Path('mesh/test/gateway-client-contract.test.mjs')
          text = p.read_text()
          text = text.replace('assert.equal(result.routes, 28);', 'assert.equal(result.routes, 29);')
          text = text.replace('assert.equal(implementation.implemented_routes, 28);', 'assert.equal(implementation.implemented_routes, 29);')
          p.write_text(text)

          # Numeric claims made load-bearing by #929.
          replace_all('README.md', 'permits only 39 current internal', 'permits only 40 current internal')
          replace_all('docs/PRODUCTION-GRADE.md', 'permits only 39 current internal', 'permits only 40 current internal')
          replace_all(
              'mesh/PRODUCTION.md',
              'policy additionally authorizes only 39 exact caller/destination/method/route',
              'policy additionally authorizes only 40 exact caller/destination/method/route'
          )
          replace_all(
              'mesh/src/release.mjs',
              "'39 exact caller/destination/method/route'",
              "'40 exact caller/destination/method/route'"
          )

          # Gateway-client operator contract.
          doc = Path('docs/operations/GATEWAY-CLIENT-CONTRACT.md')
          text = doc.read_text()
          text = text.replace('28 authenticated Gateway routes', '29 authenticated Gateway routes')
          text = text.replace('all 28 authenticated Gateway routes', 'all 29 authenticated Gateway routes')
          receipt_line = '- `GET /v1/machine-receipts/intents/:id/verify` — constrained-machine owner only; returns a Grid-attested digest-only receipt for independent verification. It does not grant execution authority.\n'
          if receipt_line not in text:
              marker = '- `GET /v1/machine-discovery`'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('machine-discovery documentation anchor missing')
              line_end = text.find('\n', pos)
              if line_end < 0:
                  raise SystemExit('machine-discovery documentation line is unterminated')
              text = text[:line_end + 1] + receipt_line + text[line_end + 1:]
          doc.write_text(text)

          # Append-only port provenance.
          provenance = Path('docs/audits/MACHINE-RECEIPT-PORT-2026-08-10.md')
          if not provenance.exists():
              provenance.write_text('''# Hardened Machine Receipt Port — 2026-08-10

**Build:** `0.12.0-dev.3`  
**Status:** built-underclaimed implementation; not a production-promotion claim

## Source and migration boundary

Historical PR #928 and branch `feat/machine-receipt-verification-v1-2026-08-10`
are preserved as the pre-hardening implementation attempt. They were not
rewritten because #929 and #930 changed security and verification boundaries
under them. The authoritative implementation was rebuilt on hardened `main` as
`feat/machine-receipt-verification-v1b-2026-08-10`.

A branch-only porter was staged but did not reliably land its complete payload;
its delayed write briefly overlapped direct connector-authored work. GitHub
rejected one stale-SHA update during that overlap. The porter and trigger were
removed, and all authoritative completion decisions were made from actual
branch contents rather than intended automation payloads.

## Receipt boundary

The public route is constrained-machine owner only. Grid reconstructs exactly
one accepted and one terminal intent event, verifies the current evidence
chain, binds the canonical request digest, invocation digest, and machine
authority digest, and signs a digest-only receipt statement. Independent
verification uses a pinned Grid public key.

Completed receipts contain a result digest rather than raw result content;
denied/failed receipts contain an error digest rather than raw error content.
Foreign-owned and nonexistent intent receipt IDs intentionally return the same
HTTP 404 `not_found` result so the endpoint does not become an intent-existence
oracle. Human callers remain ineligible for this constrained-machine surface.

The receipt reports the exact current Grid chain verification mode and prefix
assurance. A signed checkpoint is not described as full historical
reverification, and the receipt does not create new execution authority.

## Contract changes

The hardened Gateway-client contract grows from 28 to 29 authenticated routes.
Its exact contract digest is
`f334cc1b2fcc2fd8cb3f93157053956a56a8ab5e4167739606399e7920704f5b`.

The default-deny service-network policy grows from 39 to 40 exact
caller/destination/method/route entries. Its hardened receipt-policy digest is
`f8b84ef64073607fc84512c1b05b0f3a7dd02b156a2386a7328d59c91712a3a5`.
The new internal allowance is only Gateway -> Grid `GET` on the exact machine
receipt verification path.

The large retained Grid `_store-core.mjs` layer is intentionally unchanged;
the read-only two-event receipt query is localized to Grid service routing and
uses the existing event decoder.

## Claim boundary

The capability registry remains unchanged at 48 tracked / 30 implemented
through this implementation PR. Runtime existence is not claim promotion.
MCP, A2A, delegation, remote execution, arbitrary external destination
semantics, and production promotion remain non-claims.

## Promotion rule

The implementation can merge only after its exact final head passes the pinned
Clean Kernel `verify` and `container` jobs and the independent signed 50,000-
event chain-verification benchmark. Any later registry or governing-claim
promotion requires a separate evidence/claim synchronization step.
''')

          # Make provenance canonical without creating a capability claim.
          checks = Path('mesh/src/check-docs.mjs')
          text = checks.read_text()
          canonical_anchor = "  'docs/audits/AUDIT-HARDENING-G5-G9-2026-08-10.md',\n"
          canonical_entry = "  'docs/audits/MACHINE-RECEIPT-PORT-2026-08-10.md',\n"
          if canonical_entry not in text:
              if canonical_anchor not in text:
                  raise SystemExit('canonical audit-list anchor missing')
              text = text.replace(canonical_anchor, canonical_anchor + canonical_entry, 1)
          required_anchor = "  'docs/audits/AUDIT-HARDENING-G5-G9-2026-08-10.md': [\n"
          required_entry = """  'docs/audits/MACHINE-RECEIPT-PORT-2026-08-10.md': [
    '## Source and migration boundary',
    '## Receipt boundary',
    '## Contract changes',
    '## Claim boundary',
    '## Promotion rule'
  ],
"""
          if required_entry not in text:
              if required_anchor not in text:
                  raise SystemExit('canonical required-content anchor missing')
              text = text.replace(required_anchor, required_entry + required_anchor, 1)
          checks.write_text(text)
          PY

          # Read-only precommit validation. Do not weaken these if they fail.
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { validateGatewayClientContract, validateGatewayClientRouteImplementation } from './mesh/src/lib/gateway-client-contract.mjs';
          import { validateServiceNetworkPolicy, validateServiceRouteImplementation } from './mesh/src/lib/service-network-policy.mjs';
          const gatewayContract = JSON.parse(await readFile('./mesh/config/gateway-client-contract.json', 'utf8'));
          const gatewaySource = await readFile('./mesh/src/gateway/server.mjs', 'utf8');
          const networkPolicy = JSON.parse(await readFile('./mesh/config/service-network-policy.json', 'utf8'));
          const [grid, hypervisor, sandbox] = await Promise.all([
            readFile('./mesh/src/grid/server.mjs', 'utf8'),
            readFile('./mesh/src/hypervisor/server.mjs', 'utf8'),
            readFile('./mesh/src/sandbox/server.mjs', 'utf8')
          ]);
          const gc = validateGatewayClientContract(gatewayContract);
          const gi = validateGatewayClientRouteImplementation({ contract: gatewayContract, source: gatewaySource });
          const np = validateServiceNetworkPolicy(networkPolicy);
          const ni = validateServiceRouteImplementation({ policy: networkPolicy, sources: { grid, hypervisor, sandbox } });
          if (gc.routes !== 29 || gi.implemented_routes !== 29 || np.routes !== 40 || ni.implemented_routes !== 36) {
            throw new Error(`receipt parity mismatch: ${JSON.stringify({gc:gc.routes,gi:gi.implemented_routes,np:np.routes,ni:ni.implemented_routes})}`);
          }
          console.log(JSON.stringify({
            gateway_contract_digest: gc.contract_digest,
            gateway_routes: gc.routes,
            service_network_digest: np.policy_digest,
            service_network_routes: np.routes,
            implemented_service_routes: ni.implemented_routes
          }));
          NODE
          node mesh/src/check-docs.mjs
          node --test mesh/test/machine-receipt.test.mjs mesh/test/machine-receipt-client.test.mjs mesh/test/machine-receipt-network.test.mjs mesh/test/machine-receipt-e2e.test.mjs mesh/test/gateway-client-contract.test.mjs mesh/test/service-network-policy.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs mesh
          if git diff --cached --quiet; then
            echo 'Receipt parity already applied.'
            exit 0
          fi
          git commit -m 'docs: synchronize hardened machine receipt contracts and provenance'
          git push origin HEAD:feat/machine-receipt-verification-v1b-2026-08-10
