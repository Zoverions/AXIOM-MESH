name: RT-AUTH-001 Expiry Hotfix

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/src/sandbox/server.mjs"
      - "mesh/test/machine-principal-e2e.test.mjs"
      - "mesh/test/red-team/rt-auth-001-currentness-expiry.test.mjs"
      - ".github/workflows/rt-auth-001-expiry-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: rt-auth-001-expiry-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expiry-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run real four-service expiry race regression
        run: node --test mesh/test/red-team/rt-auth-001-currentness-expiry.test.mjs
      - name: Run existing machine-principal behavioral compatibility suite
        run: node --test mesh/test/machine-principal-e2e.test.mjs
