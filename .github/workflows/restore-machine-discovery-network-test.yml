name: Restore machine discovery network test

on:
  push:
    branches:
      - feat/machine-discovery-v1-2026-08-10

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/feat/machine-discovery-v1-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/machine-discovery-v1-2026-08-10
          fetch-depth: 0
      - name: Restore main test and apply only intended route counts
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:mesh/test/service-network-policy.test.mjs > mesh/test/service-network-policy.test.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'mesh/test/service-network-policy.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['assert.equal(result.routes, 38);', 'assert.equal(result.routes, 39);'],
            ['assert.equal(implementation.implemented_routes, 34);', 'assert.equal(implementation.implemented_routes, 35);']
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Missing exact restoration anchor: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/restore-machine-discovery-network-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesh/test/service-network-policy.test.mjs .github/workflows/restore-machine-discovery-network-test.yml
          git commit -m "test: restore service-network adversarial fixtures"
          git push origin HEAD:feat/machine-discovery-v1-2026-08-10
