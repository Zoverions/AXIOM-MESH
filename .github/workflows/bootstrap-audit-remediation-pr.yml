name: Bootstrap audit remediation PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'security/audit-remediation-g1-g4-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-remediation-g1-g4-2026-08-10
      - name: Execute source, test, and documentation remediation only
        shell: bash
        run: |
          awk '
            found { sub(/^          /, ""); print }
            /^        run: \|$/ { found=1; next }
          ' .github/workflows/apply-audit-remediation-g1-g4.yml > /tmp/apply-audit-remediation.sh
          test -s /tmp/apply-audit-remediation.sh
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/apply-audit-remediation.sh')
          text = path.read_text()
          text, count = re.subn(
              r"\n// G-4: pin the actual load-bearing workflow.*?\nfs\.writeFileSync\(kernelPath, kernel\);\n",
              "\n",
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one G-4 workflow mutation block, found {count}')
          old = 'rm -f .github/audit-remediation-trigger .github/workflows/apply-audit-remediation-g1-g4.yml'
          if old not in text:
              raise SystemExit('helper cleanup anchor not found')
          text = text.replace(old, 'rm -f .github/audit-remediation-trigger')
          path.write_text(text)
          PY
          bash /tmp/apply-audit-remediation.sh
