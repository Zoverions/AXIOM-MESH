name: Bootstrap audit remediation PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'security/audit-remediation-g1-g4-2026-08-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/audit-remediation-g1-g4-2026-08-10
      - name: Execute the staged remediation payload once
        shell: bash
        run: |
          awk '
            found { sub(/^          /, ""); print }
            /^        run: \|$/ { found=1; next }
          ' .github/workflows/apply-audit-remediation-g1-g4.yml > /tmp/apply-audit-remediation.sh
          test -s /tmp/apply-audit-remediation.sh
          bash /tmp/apply-audit-remediation.sh
      - name: Remove bootstrap workflow from the remediated branch
        shell: bash
        run: |
          git pull --ff-only origin security/audit-remediation-g1-g4-2026-08-10
          rm -f .github/workflows/bootstrap-audit-remediation-pr.yml
          if ! git diff --quiet -- .github/workflows/bootstrap-audit-remediation-pr.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/bootstrap-audit-remediation-pr.yml
            git commit -m 'chore: remove audit remediation bootstrap'
            git push origin HEAD:security/audit-remediation-g1-g4-2026-08-10
          fi
