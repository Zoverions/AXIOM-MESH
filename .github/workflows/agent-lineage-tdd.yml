name: Agent Lineage TDD

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mesh/src/lib/agent-lineage-delegation.mjs"
      - "mesh/test/agent-lineage-delegation.test.mjs"
      - "agent-commons/agent-lineage-delegation-threat-model.json"
      - "docs/rebuild/AGENT-LINEAGE-AND-RECURSIVE-IMPROVEMENT.md"
      - ".github/workflows/agent-lineage-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Run lineage contract
        working-directory: mesh
        run: node --test --test-reporter=spec test/agent-lineage-delegation.test.mjs
