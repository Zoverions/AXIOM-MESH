name: Machine Currentness Lifecycle Mutation Source

on:
  pull_request:
    branches: ["integration/machine-effect-currentness-checkpoint-adapter"]
    paths:
      - "mesh/src/lib/machine-currentness-mutation-command.mjs"
      - "mesh/src/lib/machine-currentness-lifecycle-source.mjs"
      - "mesh/test/machine-currentness-lifecycle-source.test.mjs"
      - ".github/workflows/machine-currentness-lifecycle-source.yml"

permissions:
  contents: read

concurrency:
  group: machine-currentness-lifecycle-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-mutation-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          check-latest: false
      - name: Run authorized currentness mutation regressions
        run: >-
          node --test
          mesh/test/machine-currentness-lifecycle-source.test.mjs
          mesh/test/machine-effect-currentness-checkpoint-adapter.test.mjs
