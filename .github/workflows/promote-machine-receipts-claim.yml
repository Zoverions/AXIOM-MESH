name: Promote machine receipt claim

on:
  push:
    branches:
      - "docs/machine-receipt-claim-sync-2026-08-10"
    paths:
      - ".github/machine-receipt-claim-trigger"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/machine-receipt-claim-sync-2026-08-10
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Promote exact receipt capability and evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { digestObject } from './mesh/src/lib/canonical.mjs';

          const capabilitiesPath = 'mesh/config/capabilities.json';
          const bindingsPath = 'mesh/config/capability-evidence-bindings.json';
          const registry = JSON.parse(fs.readFileSync(capabilitiesPath, 'utf8'));
          if (registry.capabilities.length !== 48) throw new Error(`Expected 48 capabilities, found ${registry.capabilities.length}`);
          if (registry.capabilities.some(item => item.id === 'core.machine-receipts')) throw new Error('core.machine-receipts already exists');
          const discoveryIndex = registry.capabilities.findIndex(item => item.id === 'core.machine-discovery');
          if (discoveryIndex < 0) throw new Error('core.machine-discovery not found');
          registry.capabilities.splice(discoveryIndex + 1, 0, {
            id: 'core.machine-receipts',
            family: 'verification',
            status: 'implemented',
            summary: 'Authenticated constrained machines can retrieve owner-scoped Grid-attested receipts for terminal intents; receipts bind canonical request and machine-authority digests, accepted and terminal Grid event anchors, current chain-assurance metadata, and terminal result/error digests, and can be independently verified against the trusted Grid public key without exposing raw result/error content.',
            evidence: [
              'mesh/test/machine-receipt.test.mjs',
              'mesh/test/machine-receipt-e2e.test.mjs',
              'mesh/test/machine-receipt-client.test.mjs',
              'mesh/test/machine-receipt-network.test.mjs'
            ]
          });
          const gateway = registry.capabilities.find(item => item.id === 'ui.gateway-client');
          if (!gateway?.summary?.includes('all 28 authenticated routes')) throw new Error('Expected stale ui.gateway-client 28-route summary');
          gateway.summary = gateway.summary.replace('all 28 authenticated routes', 'all 29 authenticated routes');
          fs.writeFileSync(capabilitiesPath, `${JSON.stringify(registry, null, 2)}\n`);

          const registryDigest = digestObject(registry);
          const bindings = JSON.parse(fs.readFileSync(bindingsPath, 'utf8'));
          if (bindings.bindings.some(item => item.capability_id === 'core.machine-receipts')) throw new Error('core.machine-receipts binding already exists');
          bindings.registry_digest = registryDigest;
          const discoveryBindingIndex = bindings.bindings.findIndex(item => item.capability_id === 'core.machine-discovery');
          if (discoveryBindingIndex < 0) throw new Error('core.machine-discovery binding not found');
          bindings.bindings.splice(discoveryBindingIndex + 1, 0, {
            capability_id: 'core.machine-receipts',
            path: 'mesh/test/machine-receipt-e2e.test.mjs',
            test: 'real Gateway returns an owner-scoped Grid-attested machine receipt that verifies independently',
            assertions: [
              "assert.equal(receipt.schema, 'axiom-machine-intent-receipt.v1');",
              "assert.equal(receipt.statement.intent.principal, 'agent.receipt-e2e');",
              'assert.equal(receipt.statement.outcome.result_digest, digestObject(result));',
              'assert.equal(receipt.statement.authority.invocation_digest, result.evidence.invocation_digest);',
              'assert.equal(receipt.statement.authority.machine_authority_digest, result.evidence.machine_authority_digest);',
              'assert.equal(receipt.statement.verification.owner_bound, true);',
              "assert.equal(JSON.stringify(receipt).includes('receipt-bound-output'), false);",
              'assert.equal(verification.valid, true);'
            ]
          });
          fs.writeFileSync(bindingsPath, `${JSON.stringify(bindings, null, 2)}\n`);
          console.log(`registry_digest=${registryDigest}`);
          NODE

          node mesh/src/status.mjs --write

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          # README: promote only the receipt primitive, not the AXIOM Verify product.
          replace_once(
              'README.md',
              "- authenticated constrained-machine discovery through `/v1/machine-discovery`, filtered by the active deny-dominant policy and the caller's own finite scopes, actions, destinations, purposes, and budgets, with discovery explicitly not granting execution authority;\n",
              "- authenticated constrained-machine discovery through `/v1/machine-discovery`, filtered by the active deny-dominant policy and the caller's own finite scopes, actions, destinations, purposes, and budgets, with discovery explicitly not granting execution authority;\n- owner-scoped Grid-attested receipts for terminal constrained-machine intents, binding request and machine-authority digests, accepted/terminal evidence anchors, current chain assurance, and terminal outcome digests for independent verification with the trusted Grid public key;\n"
          )
          replace_once(
              'README.md',
              "intersection; that snapshot is not permission and every effect still undergoes\nthe normal intent and policy evaluation path. AXIOM One remains an experimental browser/PWA preview,\n",
              "intersection; that snapshot is not permission and every effect still undergoes\nthe normal intent and policy evaluation path. Terminal constrained-machine intents also expose\nowner-scoped Grid-attested, digest-only receipts that can be independently checked with the trusted\nGrid public key; this is a kernel verification primitive, not the AXIOM Verify product or proof of\nan arbitrary external side effect. AXIOM One remains an experimental browser/PWA preview,\n"
          )
          replace_once('README.md', 'External AI, Verify, Circles,', 'External AI, the AXIOM Verify product, Circles,')

          # Project status: count and exact machine-interoperability milestone.
          replace_once('docs/PROJECT-STATUS-2026.md', 'records 30 implemented, 3\nexperimental', 'records 31 implemented, 3\nexperimental')
          replace_once(
              'docs/PROJECT-STATUS-2026.md',
              "- authenticated machine-filtered discovery exposes only the constrained caller's\n  requestable intersection under active policy and explicitly does not grant authority;\n  machine authority digests bind\n",
              "- authenticated machine-filtered discovery exposes only the constrained caller's\n  requestable intersection under active policy and explicitly does not grant authority;\n- owner-scoped Grid-attested receipts for terminal constrained-machine intents bind the\n  canonical request and machine-authority digests, accepted and terminal event anchors,\n  current chain-assurance metadata, and terminal result/error digests, and verify\n  independently against the trusted Grid public key without returning raw outcomes;\n  machine authority digests bind\n"
          )
          replace_once(
              'docs/PROJECT-STATUS-2026.md',
              "- an autonomous-agent runtime, machine delegation, MCP/A2A endpoint, agent\n  federation, or remote agent execution;\n",
              "- an autonomous-agent runtime, machine delegation, MCP/A2A endpoint, agent\n  federation, or remote agent execution;\n- a separately deployed AXIOM Verify product, remote receipt-verification service, or proof\n  that an arbitrary external side effect occurred beyond the recorded AXIOM evidence;\n"
          )
          replace_once(
              'docs/PROJECT-STATUS-2026.md',
              "enforcement and machine-filtered discovery are implemented; next bind credentials and\nartifacts to that envelope and add machine-readable receipt/evidence verification,\nthen build MCP compatibility against the same native Gateway\n",
              "enforcement, machine-filtered discovery, and owner-scoped Grid-attested terminal\nreceipt verification are implemented; next bind credentials and artifacts more fully to that\nenvelope, extend selective artifact/evidence semantics, then build MCP compatibility against the same native Gateway\n"
          )

          # Threat model: make receipt confidentiality/integrity boundary explicit.
          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "  concurrency, and response-size ceilings, exposes constrained-machine-only\n  requestability discovery, and forwards signed internal requests.\n",
              "  concurrency, and response-size ceilings, exposes constrained-machine-only\n  requestability discovery and owner-scoped terminal receipt retrieval, and forwards signed internal requests.\n"
          )
          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "  identities, consent, governance, node records, backups, and import/export.\n  It is one transparency log, not replicated consensus.\n",
              "  identities, consent, governance, node records, backups, import/export, and\n  Grid-attested terminal machine-receipt construction. It is one transparency log, not replicated consensus.\n"
          )
          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "states that discovery is not authorization. Runtime IDs and software\ndigests are attribution/binding metadata; they are not hardware,\n",
              "states that discovery is not authorization. After a constrained-machine intent reaches\na terminal evidence state, the owner may request a Grid-attested receipt. The receipt binds\nthe canonical request and machine-authority digests, exactly one accepted and one terminal\nGrid event, current chain-verification metadata, and a terminal result/error digest. Raw\nresults and errors are omitted; foreign-owned and nonexistent identifiers deliberately\nreturn the same `not_found` boundary. Independent verification checks the Grid signature\nagainst a trusted Grid public key. This proves the signed AXIOM receipt statement and its\nrecorded evidence binding, not that an arbitrary external-world effect occurred. Runtime IDs and software\ndigests are attribution/binding metadata; they are not hardware,\n"
          )
          replace_once(
              'docs/security/CURRENT-BUILD-THREAT-MODEL.md',
              "| Machine discovery metadata inference or discovery-as-authority | The route is constrained-machine-only; Hypervisor intersects the active deny-dominant policy with only the authenticated principal's finite actions, scopes and destinations; unresolved or denied actions are omitted; overlay structure, bearer material and unrelated actions are not returned; the response declares `discovery_is_not_authorization` | The caller intentionally learns its own authority facts plus merged policy version/digest and requestable action metadata; future provider/MCP schemas or global discovery must receive separate minimization and inference review |\n",
              "| Machine discovery metadata inference or discovery-as-authority | The route is constrained-machine-only; Hypervisor intersects the active deny-dominant policy with only the authenticated principal's finite actions, scopes and destinations; unresolved or denied actions are omitted; overlay structure, bearer material and unrelated actions are not returned; the response declares `discovery_is_not_authorization` | The caller intentionally learns its own authority facts plus merged policy version/digest and requestable action metadata; future provider/MCP schemas or global discovery must receive separate minimization and inference review |\n| Machine receipt substitution, disclosure, or intent-existence probing | Receipt construction requires terminal evidence, exact accepted/terminal event identity, verified Grid chain state and a Grid signature; the public route is constrained-machine owner-only, raw terminal content is replaced by digests, and foreign/nonexistent ids share `not_found` | A trusted Grid key proves Grid attestation, not external-world truth; key compromise, host compromise, selective evidence disclosure beyond the current receipt, and future remote verifier/product semantics require separate controls |\n"
          )

          # Agent execution queue and capability map.
          replace_once(
              'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
              '- [ ] Add machine-readable receipt/evidence verification through AXIOM Verify foundations.',
              '- [x] Add machine-readable receipt/evidence verification foundations: owner-scoped terminal intent receipts are Grid-attested, digest-only, independently verifiable with the trusted Grid public key, and do not promote the separate AXIOM Verify product.'
          )
          replace_once(
              'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
              "**Implemented discovery checkpoint:** constrained machines can request a digest-bound `axiom-machine-discovery.v1` snapshot through the normal Gateway. Hypervisor computes it from the active deny-dominant policy and the authenticated machine profile, omits denied, out-of-scope, unresolved-destination, and out-of-destination-ceiling actions, exposes only merged policy version/digest rather than overlay structure, and never converts discovery into permission.\n",
              "**Implemented discovery checkpoint:** constrained machines can request a digest-bound `axiom-machine-discovery.v1` snapshot through the normal Gateway. Hypervisor computes it from the active deny-dominant policy and the authenticated machine profile, omits denied, out-of-scope, unresolved-destination, and out-of-destination-ceiling actions, exposes only merged policy version/digest rather than overlay structure, and never converts discovery into permission.\n\n**Implemented receipt checkpoint:** `core.machine-receipts` promotes only the native verification primitive. A constrained machine can retrieve its own terminal Grid-attested receipt; the receipt binds request and machine-authority digests, accepted/terminal Grid anchors, current chain assurance and terminal outcome digests, omits raw terminal content, and verifies against the trusted Grid public key. Foreign-owned and nonexistent receipt ids are intentionally indistinguishable at the public boundary. AXIOM Verify as a product, remote verification, arbitrary external-effect truth, MCP/A2A, delegation and remote execution remain separate non-claims.\n"
          )
          replace_once(
              'docs/MASTER-TODO-AGENT-INTEROPERABILITY.md',
              'Grid acceptance and execution/result evidence are bound now; export/selective verification/causal transport remain open.',
              'Grid acceptance, execution/result evidence, and owner-scoped terminal receipt verification are bound now; export/selective artifact verification and causal transport remain open.'
          )

          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Grid evidence chain | current-registry | durable receipts and provenance |\n',
              '| Grid evidence chain | current-registry | durable receipts and provenance |\n| Machine intent receipts | current-registry | owner-scoped Grid-attested terminal receipt verification without promoting the AXIOM Verify product |\n'
          )
          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Destination/rate/concurrency/request/response limits | specified-next | Gateway + runtime enforcement | schema exists; live machine-specific enforcement not-claimed |\n| Principal-specific capability visibility | planned | discovery policy | not-claimed |',
              '| Destination/rate/concurrency/request/response limits | current-registry / partial | Gateway + runtime enforcement | request/rate/concurrency/response ceilings and current built-in `local` destination enforcement are live; external/provider destination semantics remain future work |\n| Principal-specific capability visibility | current-registry | discovery policy | principal-filtered requestability discovery is live and explicitly not authorization |'
          )
          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Minimal invocation envelope | specified-next / partial current foundation | intents, machine authority digest, grants, evidence | exact v1 schema/canonicalization across native and adapter paths |',
              '| Minimal invocation envelope | current-registry / native partial | intents, machine authority digest, grants, evidence | native v1 schema/canonicalization is live; external protocol projections remain future work |'
          )
          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Destination binding | planned | deny-egress/adapters | schema-to-live enforcement |',
              '| Destination binding | current-registry / partial | deny-egress/adapters | current built-in `local` destination is computed and enforced; external/provider semantics remain future work |'
          )
          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Capability discovery | specified-next | Gateway contract/registry | discovery does not grant permission |',
              '| Capability discovery | current-registry | Gateway contract/registry | principal-filtered discovery is live and does not grant permission |'
          )
          replace_once(
              'docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md',
              '| Machine Verify | specified-next | signed evidence/export verifier | independent verification |',
              '| Machine Verify | current-registry / primitive | Grid-attested machine receipts | owner-scoped terminal receipts verify independently; the separate AXIOM Verify product remains planned |'
          )
          PY

          (cd mesh && npm run check-registry)
          node mesh/src/status.mjs
          node mesh/src/check-docs.mjs
          git diff --check
          test -z "$(git status --porcelain | awk '$2 ~ /^\.github\// {print}')" || true
      - name: Commit claim synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mesh/config/capabilities.json mesh/config/capability-evidence-bindings.json docs/rebuild/STATUS.md README.md CONSTITUTION.md docs/rebuild/PRODUCT-DEFINITION.md docs/rebuild/REQUIREMENTS.md docs/PROJECT-STATUS-2026.md docs/security/CURRENT-BUILD-THREAT-MODEL.md docs/MASTER-TODO-AGENT-INTEROPERABILITY.md docs/rebuild/AGENT-INTEROPERABILITY-CAPABILITY-MAP.md
          git commit -m 'docs: promote Grid-attested machine receipt verification'
          git push origin HEAD:docs/machine-receipt-claim-sync-2026-08-10
