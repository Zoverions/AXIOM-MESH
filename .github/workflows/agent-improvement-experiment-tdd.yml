name: Agent Improvement Experiment TDD

on:
  pull_request:
    branches: ["feat/recursive-agent-lineage-convergence"]
    paths:
      - "mesh/src/lib/agent-improvement-experiment*.mjs"
      - "mesh/test/agent-improvement-experiment*.test.mjs"
      - ".github/workflows/agent-improvement-experiment-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Run improvement experiment contracts
        working-directory: mesh
        run: node --test --test-reporter=spec test/agent-improvement-experiment*.test.mjs
