name: Sync machine receipt release route count

on:
  push:
    branches:
      - "feat/machine-receipt-verification-v1b-2026-08-10"
    paths:
      - ".github/machine-receipt-release-sync-trigger"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/machine-receipt-verification-v1b-2026-08-10
          persist-credentials: true
      - name: Synchronize release route-count invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('mesh/src/release.mjs')
          text = p.read_text()
          old = "'39 exact caller/destination/method/route'"
          new = "'40 exact caller/destination/method/route'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale release invariant, found {count}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = "mesh/src/release.mjs"
      - name: Commit synchronized release invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mesh/src/release.mjs
          git commit -m 'fix: sync release service-network route count'
          git push origin HEAD:feat/machine-receipt-verification-v1b-2026-08-10
