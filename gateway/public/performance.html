<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Status - AxiomMesh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app" style="display: flex; flex-direction: column; min-height: 100vh;">
        <header style="padding: 20px; background: #222; border-bottom: 1px solid #444;">
            <h1><a href="index.html" style="color: white; text-decoration: none;">&larr; Back to Dashboard</a></h1>
        </header>
        <main class="content" style="flex: 1;">
            <section id="status" class="tab-content active" style="display: block;">
                <h2>System Health Status</h2>
                <div class="status-grid" id="status-grid">
                    <div class="card">
                        <h3>Gateway</h3>
                        <p id="status-gateway">Loading...</p>
                        <p id="metrics-gateway" class="text-sm text-gray-400"></p>
                    </div>
                    <div class="card">
                        <h3>Hypervisor</h3>
                        <p id="status-hypervisor">Loading...</p>
                        <p id="deps-hypervisor" class="text-sm text-gray-400"></p>
                    </div>
                    <div class="card">
                        <h3>Sandbox</h3>
                        <p id="status-sandbox">Loading...</p>
                        <p id="deps-sandbox" class="text-sm text-gray-400"></p>
                    </div>
                    <div class="card">
                        <h3>Grid</h3>
                        <p id="status-grid-node">Loading...</p>
                        <p id="deps-grid" class="text-sm text-gray-400"></p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
