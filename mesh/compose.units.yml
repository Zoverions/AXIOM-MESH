x-unit: &unit
  image: axiom-mesh-kernel:0.12.0-dev.3
  init: true
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 256m
  cpus: 1.0
  stop_grace_period: 15s
  environment: &unit-environment
    NODE_ENV: production
    AXIOM_AUTO_BOOTSTRAP: "false"
    AXIOM_REQUIRE_DENY_EGRESS: "false"
    AXIOM_DATA_KEY: ""
    AXIOM_API_TOKENS: ""
    AXIOM_INTERNAL_TLS: "true"
    AXIOM_GATEWAY_PORT: "8080"
    AXIOM_HYPERVISOR_PORT: "8081"
    AXIOM_SANDBOX_PORT: "8082"
    AXIOM_GRID_PORT: "8083"
    AXIOM_HYPERVISOR_URL: https://hypervisor:8081
    AXIOM_SANDBOX_URL: https://sandbox:8082
    AXIOM_GRID_URL: https://grid:8083
    AXIOM_LOG_REQUESTS: "true"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  gateway:
    <<: *unit
    entrypoint: ["node", "src/gateway-unit.mjs"]
    environment:
      <<: *unit-environment
      AXIOM_DATA_DIR: /var/lib/axiom-mesh
      AXIOM_API_TOKENS_FILE: /run/secrets/api-tokens.json
      AXIOM_TRANSPORT_DIR: /run/secrets/transport
      AXIOM_GATEWAY_HOST: 127.0.0.1
      AXIOM_INTERNAL_HOST: 127.0.0.1
      AXIOM_GATEWAY_SOCKET: /run/axiom-mesh/gateway.sock
    volumes:
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/gateway/data
        target: /var/lib/axiom-mesh
        read_only: true
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/gateway/transport
        target: /run/secrets/transport
        read_only: true
      - type: bind
        source: ${AXIOM_GATEWAY_SOCKET_DIR_HOST:?set AXIOM_GATEWAY_SOCKET_DIR_HOST}
        target: /run/axiom-mesh
    secrets:
      - source: axiom_api_tokens
        target: api-tokens.json
    networks:
      - gateway-hypervisor
      - gateway-grid
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      grid:
        condition: service_healthy
      hypervisor:
        condition: service_healthy

  grid:
    <<: *unit
    entrypoint: ["node", "src/grid/server.mjs"]
    environment:
      <<: *unit-environment
      AXIOM_DATA_DIR: /var/lib/axiom-mesh
      AXIOM_DATA_KEY_FILE: /run/secrets/data-protection.key
      AXIOM_TRANSPORT_DIR: /run/secrets/transport
      AXIOM_GATEWAY_HOST: 127.0.0.1
      AXIOM_INTERNAL_HOST: 0.0.0.0
    volumes:
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/grid/data
        target: /var/lib/axiom-mesh
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/grid/transport
        target: /run/secrets/transport
        read_only: true
    secrets:
      - source: axiom_data_key
        target: data-protection.key
    networks:
      - gateway-grid
      - hypervisor-grid
    healthcheck:
      test: ["CMD", "node", "src/unit-healthcheck.mjs", "grid"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  hypervisor:
    <<: *unit
    entrypoint: ["node", "src/hypervisor/server.mjs"]
    environment:
      <<: *unit-environment
      AXIOM_DATA_DIR: /var/lib/axiom-mesh
      AXIOM_TRANSPORT_DIR: /run/secrets/transport
      AXIOM_GATEWAY_HOST: 127.0.0.1
      AXIOM_INTERNAL_HOST: 0.0.0.0
    volumes:
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/hypervisor/data
        target: /var/lib/axiom-mesh
        read_only: true
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/hypervisor/transport
        target: /run/secrets/transport
        read_only: true
    networks:
      - gateway-hypervisor
      - hypervisor-grid
      - hypervisor-sandbox
    healthcheck:
      test: ["CMD", "node", "src/unit-healthcheck.mjs", "hypervisor"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      grid:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  sandbox:
    <<: *unit
    entrypoint: ["node", "src/sandbox/server.mjs"]
    environment:
      <<: *unit-environment
      AXIOM_DATA_DIR: /var/lib/axiom-mesh
      AXIOM_TRANSPORT_DIR: /run/secrets/transport
      AXIOM_GATEWAY_HOST: 127.0.0.1
      AXIOM_INTERNAL_HOST: 0.0.0.0
    volumes:
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/sandbox/data
        target: /var/lib/axiom-mesh
        read_only: true
      - type: bind
        source: ${AXIOM_UNITS_DIR_HOST:?set AXIOM_UNITS_DIR_HOST}/sandbox/transport
        target: /run/secrets/transport
        read_only: true
    networks:
      - hypervisor-sandbox
    healthcheck:
      test: ["CMD", "node", "src/unit-healthcheck.mjs", "sandbox"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  gateway-hypervisor:
    internal: true
    driver: bridge
  gateway-grid:
    internal: true
    driver: bridge
  hypervisor-grid:
    internal: true
    driver: bridge
  hypervisor-sandbox:
    internal: true
    driver: bridge

secrets:
  axiom_data_key:
    file: ${AXIOM_DATA_KEY_FILE_HOST:?set AXIOM_DATA_KEY_FILE_HOST}
  axiom_api_tokens:
    file: ${AXIOM_API_TOKENS_FILE_HOST:?set AXIOM_API_TOKENS_FILE_HOST}
