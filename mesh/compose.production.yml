services:
  kernel:
    build:
      context: .
      dockerfile: Dockerfile
    image: axiom-mesh-kernel:0.12.0-dev.2
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 2.0
    network_mode: "none"
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      AXIOM_AUTO_BOOTSTRAP: "false"
      AXIOM_REQUIRE_DENY_EGRESS: "true"
      AXIOM_DATA_DIR: /var/lib/axiom-mesh
      AXIOM_DATA_KEY_FILE: /run/secrets/data-protection.key
      AXIOM_API_TOKENS_FILE: /run/secrets/api-tokens.json
      AXIOM_INTERNAL_TLS: "true"
      AXIOM_TRANSPORT_DIR: /run/secrets/transport
      AXIOM_GATEWAY_HOST: 127.0.0.1
      AXIOM_GATEWAY_SOCKET: /run/axiom-mesh/gateway.sock
      AXIOM_INTERNAL_HOST: 127.0.0.1
      AXIOM_LOG_REQUESTS: "true"
    volumes:
      - type: bind
        source: ${AXIOM_DATA_DIR_HOST:?set AXIOM_DATA_DIR_HOST}
        target: /var/lib/axiom-mesh
      - type: bind
        source: ${AXIOM_GATEWAY_SOCKET_DIR_HOST:?set AXIOM_GATEWAY_SOCKET_DIR_HOST}
        target: /run/axiom-mesh
      - type: bind
        source: ${AXIOM_TRANSPORT_DIR_HOST:?set AXIOM_TRANSPORT_DIR_HOST}/ca-cert.pem
        target: /run/secrets/transport/ca-cert.pem
        read_only: true
      - type: bind
        source: ${AXIOM_TRANSPORT_DIR_HOST:?set AXIOM_TRANSPORT_DIR_HOST}/manifest.json
        target: /run/secrets/transport/manifest.json
        read_only: true
      - type: bind
        source: ${AXIOM_TRANSPORT_DIR_HOST:?set AXIOM_TRANSPORT_DIR_HOST}/services
        target: /run/secrets/transport/services
        read_only: true
    secrets:
      - source: axiom_data_key
        target: data-protection.key
      - source: axiom_api_tokens
        target: api-tokens.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  axiom_data_key:
    file: ${AXIOM_DATA_KEY_FILE_HOST:?set AXIOM_DATA_KEY_FILE_HOST}
  axiom_api_tokens:
    file: ${AXIOM_API_TOKENS_FILE_HOST:?set AXIOM_API_TOKENS_FILE_HOST}
