version: '3.9'
services:
  hypervisor:
    build: .
    target: hypervisor
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./hypervisor/memory:/data"]
    depends_on: [grid]

  gateway:
    build: .
    target: gateway
    ports: ["8080:8080"]
    depends_on: [hypervisor]

  grid:
    image: golang:1.23
    command: go run grid/main.go
    volumes: ["./grid:/app"]
    ports: ["8545:8545"]  # local anvil or mainnet RPC proxy

  # Optional: Cross-chain relayer service (new)
  crosschain-relayer:
    build:
      context: .
      target: hypervisor
    command: ["python", "-m", "hypervisor.crosschain.OmnichainRelayer"]
    env_file: .env
