[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
anyhow = "1.0.102"
serde = "1.0.228"
serde_yaml = "0.9.34"
wasmtime = "15.0"
wasi-common = "15.0"
tokio = { version = "1", features = ["full"] }
bytes = "1.5"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
